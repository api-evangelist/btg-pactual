openapi: 3.2.0
info:
  description: API implementada pelo parceiro que utilizaremos para buscar informações de nossos clientes em comum dentro da jornada de Onboarding.
  version: 1.0.0
  title: Onboarding Utilidades API
servers:
- url: https://api.sandbox.empresas.btgpactual.com
  description: Sandbox
- url: https://api.uat.empresas.btgpactual.com
  description: UAT
- url: https://api.empresas.btgpactual.com
  description: Production
tags:
- name: Utilidades
paths:
  /onboarding/types/address:
    get:
      tags:
      - Utilidades
      description: Obter a lista de estados e cidades
      responses:
        '200':
          description: Lista de estados e cidades
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        stateCode:
                          type: string
                          example: AL
                        cityCode:
                          type: string
                          example: ALAAA
                        stateName:
                          type: string
                          example: ALAGOAS
                        cityName:
                          type: string
                          example: AGUA BRANCA
                title: AddressResponse
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Onboarding/obter-a-lista-de-estados-e-cidades
      summary: Get onboarding types address
      x-summary-source: derived
      operationId: getOnboardingTypesAddress
      x-operation-id-source: derived
  /onboarding/types/profession:
    get:
      tags:
      - Utilidades
      description: Obter lista de profissões
      responses:
        '200':
          description: Lista de profissões
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 125
                        name:
                          type: string
                          example: Administrador (a)
                title: ProfessionsResponse
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Onboarding/obter-lista-de-profissoes
      summary: Get onboarding types profession
      x-summary-source: derived
      operationId: getOnboardingTypesProfession
      x-operation-id-source: derived
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
