openapi: 3.2.0
info:
  title: Btg Pactual Pagamentos API
  termsOfService: https://www.btgpactual.com/empresas/termos-e-politicas/
  version: '1.0'
  description: 'Operations tagged Pagamentos across 2 of this provider''s published API definitions: btg-pactual-banking-payments-openapi.yml, btg-pactual-banking-payroll-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.empresas.btgpactual.com
  description: sandbox
- url: https://api.empresas.btgpactual.com
  description: produção
tags:
- name: Pagamentos
paths:
  /{companyId}/banking/payments/approvals/{paymentId}:
    delete:
      tags:
      - Pagamentos
      description: Cancelar pagamento ou transferência pendente de aprovação
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      - name: paymentId
        schema:
          type: string
          example: 29d42888-a920-4a85-a163-aa25b4937b3f
          title: PaymentId
        in: path
        required: true
      - name: x-idempotency-key
        schema:
          type: string
          example: f08jjj6b-00bc-1e3e-ad99-acb353333914
          title: XIdempotencyKey
        in: header
      responses:
        '200':
          description: Cancelamento bem sucedido
      security:
      - oauth2:
        - openid
        - empresas.btgpactual.com/pix-cash-in.readonly
        - empresas.btgpactual.com/authorized-direct-debits.readonly
        - empresas.btgpactual.com/bank-slips
        - empresas.btgpactual.com/bank-slips.readonly
        - openid empresas.btgpactual.com/payments.readonly
        - openid empresas.btgpactual.com/payments
        - empresas.btgpactual.com/accounts.readonly
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Payments/cancelar-pagamento-ou-transferencia-pendente-de-aprovacao
      summary: Delete by company id banking payments approvals by payment id
      x-summary-source: derived
      operationId: deleteByCompanyIdBankingPaymentsApprovalsByPaymentId
      x-operation-id-source: derived
    servers:
    - url: https://api.sandbox.empresas.btgpactual.com
      description: sandbox
    - url: https://api.empresas.btgpactual.com
      description: produção
  /{companyId}/banking/payments/{paymentId}:
    delete:
      tags:
      - Pagamentos
      description: Cancelar um pagamento ou transferência agendado
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      - name: paymentId
        schema:
          type: string
          example: 29d42888-a920-4a85-a163-aa25b4937b3f
          title: PaymentId
        in: path
        required: true
      - name: x-idempotency-key
        schema:
          type: string
          example: f08jjj6b-00bc-1e3e-ad99-acb353333914
          title: XIdempotencyKey
        in: header
      responses:
        '204':
          description: Exclusão do agendamento
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - openid empresas.btgpactual.com/payments
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Payments/cancelar-um-pagamento-ou-transferencia-agendado
      summary: Delete by company id banking payments by payment id
      x-summary-source: derived
      operationId: deleteByCompanyIdBankingPaymentsByPaymentId
      x-operation-id-source: derived
    get:
      tags:
      - Pagamentos
      description: Listar um pagamento ou transferência específico
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      - name: paymentId
        schema:
          type: string
          example: 29d42888-a920-4a85-a163-aa25b4937b3f
          title: PaymentId
        in: path
        required: true
      - name: x-idempotency-key
        schema:
          type: string
          example: f08jjj6b-00bc-1e3e-ad99-acb353333914
          title: XIdempotencyKey
        in: header
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentId:
                    type: string
                    example: 29d42888-a920-4a85-a163-aa25b4937b3f
                    title: PaymentId
                  type:
                    description: Boleto de cobrança
                    enum:
                    - BANKSLIP
                    - PIX_QR_CODE
                    - UTILITIES
                    - TED
                    - PIX
                    type: string
                    title: Type
                  status:
                    description: Status do pagamento
                    enum:
                    - CONFIRMED
                    - CREATED
                    - CANCELED
                    - FAILED
                    - PROCESSED
                    - ADJOURNED
                    - REVERTED
                    - SCHEDULED
                    type: string
                    example: CREATED
                    title: PaymentStatus
                  amount:
                    type: number
                    example: 0.01
                    title: Money
                  debitParty:
                    type: object
                    properties:
                      taxId:
                        type: string
                        example: '00000000000141'
                      name:
                        type: string
                        example: NOME DA EMPRESA
                      number:
                        type: string
                        example: '000000050'
                      branchCode:
                        type: string
                        example: '50'
                      bankCode:
                        type: string
                        example: '208'
                  detail:
                    type: object
                    properties:
                      digitableLine:
                        description: Linha digitavel
                        type: string
                        example: '20890050091195069626700021179601493360000000001'
                        title: DigitableLine
                      dueDate:
                        format: date
                        type: string
                        example: '2023-05-03'
                        title: Date
                      payee:
                        type: object
                        properties:
                          socialName:
                            type: string
                            example: NOME DA EMPRESA
                          fantasyName:
                            type: string
                            example: NOME DA EMPRESA
                          taxId:
                            type: string
                            example: '00000000000145'
                          bankCode:
                            type: string
                            example: '208'
                        title: Payee
                  tags:
                    type: object
                    properties:
                      externalId:
                        type: string
                        example: 8725b04c-1354-4ad7-91db-4bbb2138e390
                        title: ExternalId
                      originTransactionId:
                        type: string
                        example: 48b33060-7960-4093-bc93-ed9105c3c657
                        title: OriginTransactionId
                  paymentDate:
                    format: date
                    type: string
                    example: '2023-03-20T00:00:00.000Z'
                title: BankSlipPayment
          description: Pagamento
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - openid empresas.btgpactual.com/payments.readonly
        - openid empresas.btgpactual.com/payments
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Payments/listar-um-pagamento-ou-transferencia-especifico
      summary: Get by company id banking payments by payment id
      x-summary-source: derived
      operationId: getByCompanyIdBankingPaymentsByPaymentId
      x-operation-id-source: derived
    servers:
    - url: https://api.sandbox.empresas.btgpactual.com
      description: sandbox
    - url: https://api.empresas.btgpactual.com
      description: produção
  /{companyId}/banking/payments/barcodes:
    get:
      tags:
      - Pagamentos
      description: Consulta por código de barras
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      - examples:
          barcode example:
            value: 123464358568312341634-fbs-12343464
        name: codes
        description: Código de barras
        schema:
          type: string
        in: query
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        amount:
                          type: number
                          example: 0.01
                          title: Money
                        interest:
                          type: number
                          example: 0.01
                          title: Money
                        fine:
                          type: number
                          example: 0.01
                          title: Money
                        discount:
                          type: number
                          example: 0.01
                          title: Money
                        barcode:
                          description: Código de barras
                          type: string
                          example: '20894931200004935000050017010554970003849530'
                          title: Barcode
                        digitableLine:
                          description: Linha digitavel
                          type: string
                          example: '20890050091195069626700021179601493360000000001'
                          title: DigitableLine
                        dueDate:
                          format: date
                          type: string
                          example: '2023-05-03'
                          title: Date
                        expirationDate:
                          format: date
                          type: string
                          example: '2023-05-03'
                          title: Date
                        payee:
                          type: object
                          properties:
                            socialName:
                              type: string
                              example: NOME DA EMPRESA
                            fantasyName:
                              type: string
                              example: NOME DA EMPRESA
                            taxId:
                              type: string
                              example: '00000000000145'
                            bankCode:
                              type: string
                              example: '208'
                          title: Payee
                title: BankSlipPaymentResponse
          description: Consulta bem sucedida
      security:
      - oauth2:
        - openid
        - empresas.btgpactual.com/pix-cash-in.readonly
        - empresas.btgpactual.com/authorized-direct-debits.readonly
        - empresas.btgpactual.com/bank-slips
        - empresas.btgpactual.com/bank-slips.readonly
        - openid empresas.btgpactual.com/payments.readonly
        - openid empresas.btgpactual.com/payments
        - empresas.btgpactual.com/accounts.readonly
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Payments/consulta-por-codigo-de-barras
      summary: Get by company id banking payments barcodes
      x-summary-source: derived
      operationId: getByCompanyIdBankingPaymentsBarcodes
      x-operation-id-source: derived
    servers:
    - url: https://api.sandbox.empresas.btgpactual.com
      description: sandbox
    - url: https://api.empresas.btgpactual.com
      description: produção
  /{companyId}/banking/payments:
    post:
      tags:
      - Pagamentos
      description: Criar iniciação de pagamento ou transferência
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      - name: x-idempotency-key
        schema:
          type: string
          example: f08jjj6b-00bc-1e3e-ad99-acb353333914
          title: XIdempotencyKey
        in: header
        required: false
      requestBody:
        content:
          application/json:
            schema:
              properties:
                items:
                  type: array
                  items:
                    oneOf:
                    - description: Pagamento pix copia e cola
                      type: object
                      allOf:
                      - required:
                        - type
                        - detail
                        type: object
                        properties:
                          type:
                            description: Tipo do pagamento
                            enum:
                            - PIX_QR_CODE
                            type: string
                          detail:
                            description: Detalhes da transação referente ao campo type.
                            type: object
                            properties:
                              creditParty:
                                description: ''
                                required:
                                - name
                                - taxId
                                type: object
                                properties:
                                  name:
                                    description: Nome do detentor da chave pix
                                    type: string
                                    example: Nome
                                  taxId:
                                    description: CPF/CNPJ do detentor da chave pix
                                    type: string
                                    example: '123412342134'
                                title: pixKeyCreditParty
                              emv:
                                description: Chave copia e cola de pix
                                type: string
                                example: 123498128974239789gov-exemplo-de-emv1234123461
                            title: detail-inside-emv
                      - required:
                        - amount
                        - debitParty
                        - paymentDate
                        type: object
                        properties:
                          description:
                            type: string
                            description: Descrição do pagamento visível ao favorecido. Visível no comprovante.
                            example: Pagamento de boleto
                          internalDescription:
                            type: string
                            description: Identificação interna do pagamento. Não consta no comprovante, apenas nos eventos internos.
                            example: Pagamento de boleto
                          batchId:
                            type: string
                            description: Id do lote de pagamentos.
                            example: 117610ad-dde4-4a55-94e4-24a9c9fc1fc4
                          amount:
                            type: number
                            example: 0.01
                            title: Money
                            description: Valor da transação.
                          debitParty:
                            description: Dados da parte debitada.
                            type: object
                            properties:
                              branchCode:
                                description: Agência. Utilizar 50.
                                type: string
                                example: '50'
                              number:
                                description: Número da conta
                                type: string
                                example: '000000050'
                          tags:
                            type: object
                            properties:
                              externalId:
                                type: string
                                example: 8725b04c-1354-4ad7-91db-4bbb2138e390
                                title: ExternalId
                          paymentDate:
                            format: date
                            description: Data de pagamento
                            type: string
                            example: '2025-02-02'
                        title: BankSlipPaymentIssue
                      title: Pagamento-PIX-QR-CODE-emv
                    - description: Pagamento pix copia e cola
                      type: object
                      allOf:
                      - required:
                        - type
                        - detail
                        type: object
                        properties:
                          type:
                            description: Tipo do pagamento
                            enum:
                            - PIX_QR_CODE
                            type: string
                          detail:
                            description: Detalhes da transação referente ao campo type.
                            type: object
                            properties:
                              creditParty:
                                description: ''
                                required:
                                - name
                                - taxId
                                type: object
                                properties:
                                  name:
                                    description: Nome do detentor da chave pix
                                    type: string
                                    example: Nome
                                  taxId:
                                    description: CPF/CNPJ do detentor da chave pix
                                    type: string
                                    example: '123412342134'
                                title: pixKeyCreditParty
                              location:
                                description: Identificador do QR Code
                                type: string
                                example: qrcode.pix.com/qrs1/v2/weqriojwio5UkwwejrJoABe9iwoejiowejrDcWsDlxwzkAuuvbsUPeRAg
                            title: detail-inside-location
                      - required:
                        - amount
                        - debitParty
                        - paymentDate
                        type: object
                        properties:
                          description:
                            type: string
                            description: Descrição do pagamento visível ao favorecido. Visível no comprovante.
                            example: Pagamento de boleto
                          internalDescription:
                            type: string
                            description: Identificação interna do pagamento. Não consta no comprovante, apenas nos eventos internos.
                            example: Pagamento de boleto
                          batchId:
                            type: string
                            description: Id do lote de pagamentos.
                            example: 117610ad-dde4-4a55-94e4-24a9c9fc1fc4
                          amount:
                            type: number
                            example: 0.01
                            title: Money
                            description: Valor da transação.
                          debitParty:
                            description: Dados da parte debitada.
                            type: object
                            properties:
                              branchCode:
                                description: Agência. Utilizar 50.
                                type: string
                                example: '50'
                              number:
                                description: Número da conta
                                type: string
                                example: '000000050'
                          tags:
                            type: object
                            properties:
                              externalId:
                                type: string
                                example: 8725b04c-1354-4ad7-91db-4bbb2138e390
                                title: ExternalId
                          paymentDate:
                            format: date
                            description: Data de pagamento
                            type: string
                            example: '2025-02-02'
                        title: BankSlipPaymentIssue
                      title: Pagamento-PIX-QR-CODE-location
                    - description: Pagamento de boleto, utilities e FGTS(utilizar utilities)
                      type: object
                      allOf:
                      - required:
                        - type
                        - detail
                        type: object
                        properties:
                          type:
                            description: Tipo do pagamento
                            enum:
                            - BANKSLIP
                            - UTILITIES
                            type: string
                          detail:
                            description: Detalhes da transação referente ao campo type.
                            type: object
                            properties:
                              products:
                                description: Instruções de PagFor. Somente para o type BANKSLIP
                                required:
                                - anticipation
                                properties:
                                  anticipation:
                                    type: object
                                    required:
                                    - invoiceNumber
                                    properties:
                                      invoiceNumber:
                                        type: string
                                        description: 'Identificador da transação. Sugestão: Nota físcal'
                                        example: '123456789'
                                      paymentExternalId:
                                        type: string
                                        description: 'Identificador da transação. Sugestão: Id do pedido'
                                        example: '123456789'
                                title: PagforInfo
                              digitableLine:
                                description: Linha digitavel do documento a ser pago
                                type: string
                                example: '123498162364512309413275312'
                              barcode:
                                description: Código de barras do documento a ser pago
                                type: string
                                example: '123498162364512309413275312'
                            title: detail-inside-digitableLine
                      - required:
                        - amount
                        - debitParty
                        - paymentDate
                        type: object
                        properties:
                          description:
                            type: string
                            description: Descrição do pagamento visível ao favorecido. Visível no comprovante.
                            example: Pagamento de boleto
                          internalDescription:
                            type: string
                            description: Identificação interna do pagamento. Não consta no comprovante, apenas nos eventos internos.
                            example: Pagamento de boleto
                          batchId:
                            type: string
                            description: Id do lote de pagamentos.
                            example: 117610ad-dde4-4a55-94e4-24a9c9fc1fc4
                          amount:
                            type: number
                            example: 0.01
                            title: Money
                            description: Valor da transação.
                          debitParty:
                            description: Dados da parte debitada.
                            type: object
                            properties:
                              branchCode:
                                description: Agência. Utilizar 50.
                                type: string
                                example: '50'
                              number:
                                description: Número da conta
                                type: string
                                example: '000000050'
                          tags:
                            type: object
                            properties:
                              externalId:
                                type: string
                                example: 8725b04c-1354-4ad7-91db-4bbb2138e390
                                title: ExternalId
                          paymentDate:
                            format: date
                            description: Data de pagamento
                            type: string
                            example: '2025-02-02'
                        title: BankSlipPaymentIssue
                      title: Pagamento-Boletos_Utilities_FGTS
                    - description: PIX manual e TED
                      type: object
                      allOf:
                      - required:
                        - type
                        - detail
                        type: object
                        properties:
                          type:
                            description: Tipo do pagamento
                            enum:
                            - TED
                            - PIX_MANUAL
                            type: string
                          detail:
                            description: Detalhes da transação referente ao campo type.
                            required:
                            - creditParty
                            type: object
                            properties:
                              products:
                                description: Instruções de PagFor
                                required:
                                - anticipation
                                properties:
                                  anticipation:
                                    type: object
                                    required:
                                    - invoiceNumber
                                    properties:
                                      invoiceNumber:
                                        type: string
                                        description: 'Identificador da transação. Sugestão: Nota físcal'
                                        example: '123456789'
                                      paymentExternalId:
                                        type: string
                                        description: 'Identificador da transação. Sugestão: Id do pedido'
                                        example: '123456789'
                                title: PagforInfo
                              creditParty:
                                description: Detalhes da parte creditada.
                                required:
                                - taxId
                                - name
                                - account
                                type: object
                                properties:
                                  taxId:
                                    description: Documento da parte creditada
                                    type: string
                                    example: '12345671234'
                                  name:
                                    description: Nome da parte creditada
                                    type: string
                                    example: NOME
                                  account:
                                    description: Dados da conta
                                    required:
                                    - type
                                    - number
                                    - branch
                                    - bankCode
                                    type: object
                                    properties:
                                      type:
                                        description: Tipo da conta
                                        enum:
                                        - CC
                                        - PG
                                        - PP
                                        type: string
                                      number:
                                        description: Número da conta
                                        type: string
                                        example: '001234567'
                                      branch:
                                        description: Agência
                                        type: string
                                        example: '1'
                                      bankCode:
                                        description: Código do banco
                                        type: string
                                        example: '208'
                                    title: accountObj
                                title: creditPartyObj
                            title: creditParty
                      - required:
                        - amount
                        - debitParty
                        - paymentDate
                        type: object
                        properties:
                          description:
                            type: string
                            description: Descrição do pagamento visível ao favorecido. Visível no comprovante.
                            example: Pagamento de boleto
                          internalDescription:
                            type: string
                            description: Identificação interna do pagamento. Não consta no comprovante, apenas nos eventos internos.
                            example: Pagamento de boleto
                          batchId:
                            type: string
                            description: Id do lote de pagamentos.
                            example: 117610ad-dde4-4a55-94e4-24a9c9fc1fc4
                          amount:
                            type: number
                            example: 0.01
                            title: Money
                            description: Valor da transação.
                          debitParty:
                            description: Dados da parte debitada.
                            type: object
                            properties:
                              branchCode:
                                description: Agência. Utilizar 50.
                                type: string
                                example: '50'
                              number:
                                description: Número da conta
                                type: string
                                example: '000000050'
                          tags:
                            type: object
                            properties:
                              externalId:
                                type: string
                                example: 8725b04c-1354-4ad7-91db-4bbb2138e390
                                title: ExternalId
                          paymentDate:
                            format: date
                            description: Data de pagamento
                            type: string
                            example: '2025-02-02'
                        title: BankSlipPaymentIssue
                      title: Pagamento-TED_PIX-MANUAL
                    - description: Pix por chave pix
                      type: object
                      allOf:
                      - required:
                        - type
                        - detail
                        type: object
                        properties:
                          type:
                            description: Tipo do pagamento
                            enum:
                            - PIX_KEY
                            type: string
                          detail:
                            description: Detalhes da transação referente ao campo type.
                            required:
                            - key
                            - creditParty
                            type: object
                            properties:
                              creditParty:
                                description: ''
                                required:
                                - name
                                - taxId
                                type: object
                                properties:
                                  name:
                                    description: Nome do detentor da chave pix
                                    type: string
                                    example: Nome
                                  taxId:
                                    description: CPF/CNPJ do detentor da chave pix
                                    type: string
                                    example: '123412342134'
                                title: pixKeyCreditParty
                              key:
                                description: ''
                                required:
                                - value
                                type: object
                                properties:
                                  value:
                                    description: Chave Pix
                                    type: string
                                    example: '1132324545'
                                title: keyObj
                            title: PixData
                      - required:
                        - amount
                        - debitParty
                        - paymentDate
                        type: object
                        properties:
                          description:
                            type: string
                            description: Descrição do pagamento visível ao favorecido. Visível no comprovante.
                            example: Pagamento de boleto
