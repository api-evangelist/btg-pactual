      - write:
        - brn:btg:empresas:banking:automatic-pix
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Pix%20Autom%5Cxe1tico/criar-agendamento-de-cobranca-para-pix-automatico
