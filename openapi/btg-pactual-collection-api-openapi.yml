openapi: 3.2.0
info:
  description: API responsável por gestão das cobranças
  version: 1.0.0
  title: Banking - Collections Collection API
  contact:
    name: Contas a Receber
    email: OL-IT-BtgEmpresas-ContasAReceber@btgpactual.com
servers:
- url: https://api.sandbox.empresas.btgpactual.com
  description: Sandbox
- url: https://api.empresas.btgpactual.com
  description: Produção
tags:
- name: Collection
paths:
  /{companyId}/banking/collections/{collectionId}:
    put:
      tags:
      - Collection
      description: '## 📘 Ambiente de sandbox

        > Esta API utiliza o Wiremock


        > No sandbox este endpoint requer a utilização de Sandbox Headers


        | Header | Descrição | Valores Aceitos |

        | :--------- | :----------------------------------- | :-------------- |

        | x-response | Controlar o tipo de resposta da API. | success ou error |'
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
        description: CNPJ da empresa
        example: '30306294000145'
      - in: path
        name: collectionId
        description: Identificador da cobrança
        schema:
          type: string
          example: ff3e1be1-f409-4e3f-b13c-37ecb0ed3a84
          description: Id da cobrança
          title: CollectionId
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                required:
                - amount
                - dueDate
                - overDueDate
                - interest
                - fine
                - discounts
                properties:
                  dueDate:
                    type: string
                    format: date
                    example: '2024-05-28'
                    description: Data do vencimento da cobrança
                    title: DueDate
                  overDueDate:
                    type: string
                    format: date
                    example: '2025-04-20'
                    description: Data de expiração da cobrança
                    title: OverDueDate
                  amount:
                    type: number
                    example: 270.87
                    description: Valor da cobrança
                    title: Amount
                  description:
                    type: string
                    maxLength: 300
                    example: Mensalidade da faculdade
                    description: Descrição da cobrança
                    title: Description
                  payer:
                    type: object
                    properties:
                      email:
                        type: string
                        example: user@gmail.com
                        description: E-mail do pagador
                        title: PayerEmail
                      phoneNumber:
                        type: string
                        example: +55(99)99999-9999
                        description: Telefone do pagador
                        title: PayerPhoneNumber
                    description: Atualização dados do pagador
                    title: PayerUpdate
                  discounts:
                    type: array
                    items:
                      type: object
                      properties:
                        limitDate:
                          type: string
                          format: date
                          example: '2023-10-10'
                          description: Data limite
                        type:
                          type: string
                          enum:
                          - FIXED_VALUE
                          - NOT_APPLICABLE
                          - PERCENTAGE
                          example: FIXED_VALUE
                        value:
                          type: number
                          example: 13
                      title: Discount
                    description: Dados de desconto
                  rebate:
                    type: object
                    description: Dados de abatimento da cobrança
                    required:
                    - type
                    - value
                    properties:
                      type:
                        type: string
                        enum:
                        - FIXED_VALUE
                        - NOT_APPLICABLE
                        - PERCENTAGE
                        example: FIXED_VALUE
                        description: 'Tipo do abatimento. FIXED_VALUE: valor fixo em reais (deve ser maior que 0 e menor que o valor da cobrança). PERCENTAGE: percentual sobre o valor da cobrança (deve ser maior que 0 e menor que 100). NOT_APPLICABLE: sem abatimento (value deve ser 0).

                          '
                      value:
                        type: number
                        example: 10
                        description: Valor do abatimento. Para FIXED_VALUE, valor em reais. Para PERCENTAGE, percentual. Para NOT_APPLICABLE, deve ser 0.
                    title: Rebate
                  interest:
                    type: object
                    properties:
                      startDate:
                        type: string
                        format: date
                        example: '2023-10-02'
                      type:
                        type: string
                        enum:
                        - FIXED_VALUE_PER_DAY
                        - PERCENTAGE_PER_MONTH
                        - NOT_APPLICABLE
                        example: FIXED_VALUE_PER_DAY
                      value:
                        type: number
                        example: 123
                    title: Interest
                  fine:
                    type: object
                    properties:
                      startDate:
                        type: string
                        format: date
                        example: '2023-10-02'
                        description: Data incial
                      type:
                        type: string
                        enum:
                        - FIXED_VALUE
                        - NOT_APPLICABLE
                        - PERCENTAGE
                        example: FIXED_VALUE
                      value:
                        type: number
                        example: 13
                    title: Fine
                  detail:
                    type: object
                    properties:
                      badCredit:
                        type: object
                        description: Informações de negativação para cobranças com type BANKSLIP ou BANKSLIP_QRCODE
                        required:
                        - type
                        properties:
                          type:
                            type: string
                            description: Se NOT_APPLICABLE, o campo issueDate não deve ser informado
                            enum:
                            - APPLICABLE
                            - NOT_APPLICABLE
                            example: APPLICABLE
                          issueDate:
                            type: string
                            description: Data para negativar a cobrança
                            example: '2025-04-01'
                        title: BadCreditIssueDate
                      protest:
                        type: object
                        description: Informações de protesto para cobranças BANKSLIP e BANKSLIP_QRCODE
                        required:
                        - type
                        properties:
                          type:
                            type: string
                            description: Se NOT_APPLICABLE, issueDate não deve ser informado. A data de protesto deve ser maior que a data de vencimento e menor ou igual à data de expiração.
                            enum:
                            - APPLICABLE
                            - NOT_APPLICABLE
                            example: APPLICABLE
                          issueDate:
                            type: string
                            format: date
                            description: Data para protestar a cobrança. Deve ser maior que dueDate, menor ou igual a overDueDate e maior que badCredit.issueDate quando aplicável.
                            example: '2025-05-01'
                        title: ProtestIssueDate
                title: UpdateBankslipRequest
              - type: object
                required:
                - amount
                - dueDate
                - overDueDate
                - interest
                - fine
                - discounts
                properties:
                  dueDate:
                    type: string
                    format: date
                    example: '2024-05-28'
                    description: Data do vencimento da cobrança
                    title: DueDate
                  overDueDate:
                    type: string
                    format: date
                    example: '2025-04-20'
                    description: Data de expiração da cobrança
                    title: OverDueDate
                  amount:
                    type: number
                    example: 270.87
                    description: Valor da cobrança
                    title: Amount
                  description:
                    type: string
                    example: Atualizado Interest
                  payer:
                    type: object
                    properties:
                      email:
                        type: string
                        example: user@gmail.com
                        description: E-mail do pagador
                        title: PayerEmail
                      phoneNumber:
                        type: string
                        example: +55(99)99999-9999
                        description: Telefone do pagador
                        title: PayerPhoneNumber
                    description: Atualização dados do pagador
                    title: PayerUpdate
                  discounts:
                    type: array
                    items:
                      type: object
                      properties:
                        limitDate:
                          type: string
                          format: date
                          example: '2023-10-10'
                          description: Data limite
                        type:
                          type: string
                          enum:
                          - FIXED_VALUE
                          - NOT_APPLICABLE
                          - PERCENTAGE
                          example: FIXED_VALUE
                        value:
                          type: number
                          example: 13
                      title: Discount
                    description: Dados de desconto
                  rebate:
                    type: object
                    description: Dados de abatimento da cobrança
                    required:
                    - type
                    - value
                    properties:
                      type:
                        type: string
                        enum:
                        - FIXED_VALUE
                        - NOT_APPLICABLE
                        - PERCENTAGE
                        example: FIXED_VALUE
                        description: 'Tipo do abatimento. FIXED_VALUE: valor fixo em reais (deve ser maior que 0 e menor que o valor da cobrança). PERCENTAGE: percentual sobre o valor da cobrança (deve ser maior que 0 e menor que 100). NOT_APPLICABLE: sem abatimento (value deve ser 0).

                          '
                      value:
                        type: number
                        example: 10
                        description: Valor do abatimento. Para FIXED_VALUE, valor em reais. Para PERCENTAGE, percentual. Para NOT_APPLICABLE, deve ser 0.
                    title: Rebate
                  interest:
                    type: object
                    properties:
                      startDate:
                        type: string
                        format: date
                        example: '2023-10-02'
                      type:
                        type: string
                        enum:
                        - FIXED_VALUE_PER_DAY
                        - PERCENTAGE_PER_MONTH
                        - NOT_APPLICABLE
                        example: FIXED_VALUE_PER_DAY
                      value:
                        type: number
                        example: 123
                    title: Interest
                  fine:
                    type: object
                    properties:
                      startDate:
                        type: string
                        format: date
                        example: '2023-10-02'
                        description: Data incial
                      type:
                        type: string
                        enum:
                        - FIXED_VALUE
                        - NOT_APPLICABLE
                        - PERCENTAGE
                        example: FIXED_VALUE
                      value:
                        type: number
                        example: 13
                    title: Fine
                  detail:
                    type: object
                    properties:
                      badCredit:
                        type: object
                        description: Informações de negativação para cobranças com type BANKSLIP ou BANKSLIP_QRCODE
                        required:
                        - type
                        properties:
                          type:
                            type: string
                            description: Se NOT_APPLICABLE, o campo issueDate não deve ser informado
                            enum:
                            - APPLICABLE
                            - NOT_APPLICABLE
                            example: APPLICABLE
                          issueDate:
                            type: string
                            description: Data para negativar a cobrança
                            example: '2025-04-01'
                        title: BadCreditIssueDate
                      protest:
                        type: object
                        description: Informações de protesto para cobranças BANKSLIP e BANKSLIP_QRCODE
                        required:
                        - type
                        properties:
                          type:
                            type: string
                            description: Se NOT_APPLICABLE, issueDate não deve ser informado. A data de protesto deve ser maior que a data de vencimento e menor ou igual à data de expiração.
                            enum:
                            - APPLICABLE
                            - NOT_APPLICABLE
                            example: APPLICABLE
                          issueDate:
                            type: string
                            format: date
                            description: Data para protestar a cobrança. Deve ser maior que dueDate, menor ou igual a overDueDate e maior que badCredit.issueDate quando aplicável.
                            example: '2025-05-01'
                        title: ProtestIssueDate
                title: UpdateBankslipPixRequest
              - type: object
                required:
                - amount
                - dueDate
                - overDueDate
                - interest
                - fine
                - discounts
                properties:
                  dueDate:
                    type: string
                    format: date
                    example: '2024-05-28'
                    description: Data do vencimento da cobrança
                    title: DueDate
                  overDueDate:
                    type: string
                    format: date
                    example: '2025-04-20'
                    description: Data de expiração da cobrança
                    title: OverDueDate
                  amount:
                    type: number
                    example: 270.87
                    description: Valor da cobrança
                    title: Amount
                  description:
                    type: string
                    example: Atualizado Interest
                  payer:
                    type: object
                    properties:
                      email:
                        type: string
                        example: user@gmail.com
                        description: E-mail do pagador
                        title: PayerEmail
                      phoneNumber:
                        type: string
                        example: +55(99)99999-9999
                        description: Telefone do pagador
                        title: PayerPhoneNumber
                    description: Atualização dados do pagador
                    title: PayerUpdate
                  discounts:
                    type: array
                    items:
                      type: object
                      properties:
                        limitDate:
                          type: string
                          format: date
                          example: '2023-10-10'
                          description: Data limite
                        type:
                          type: string
                          enum:
                          - FIXED_VALUE
                          - NOT_APPLICABLE
                          - PERCENTAGE
                          example: FIXED_VALUE
                        value:
                          type: number
                          example: 13
                      title: Discount
                    description: Dados de desconto
                  rebate:
                    type: object
                    description: Dados de abatimento da cobrança
                    required:
                    - type
                    - value
                    properties:
                      type:
                        type: string
                        enum:
                        - FIXED_VALUE
                        - NOT_APPLICABLE
                        - PERCENTAGE
                        example: FIXED_VALUE
                        description: 'Tipo do abatimento. FIXED_VALUE: valor fixo em reais (deve ser maior que 0 e menor que o valor da cobrança). PERCENTAGE: percentual sobre o valor da cobrança (deve ser maior que 0 e menor que 100). NOT_APPLICABLE: sem abatimento (value deve ser 0).

                          '
                      value:
                        type: number
                        example: 10
                        description: Valor do abatimento. Para FIXED_VALUE, valor em reais. Para PERCENTAGE, percentual. Para NOT_APPLICABLE, deve ser 0.
                    title: Rebate
                  interest:
                    type: object
                    properties:
                      startDate:
                        type: string
                        format: date
                        example: '2023-10-02'
                      type:
                        type: string
                        enum:
                        - FIXED_VALUE_PER_DAY
                        - PERCENTAGE_PER_MONTH
                        - NOT_APPLICABLE
                        example: FIXED_VALUE_PER_DAY
                      value:
                        type: number
                        example: 123
                    title: Interest
                  fine:
                    type: object
                    properties:
                      startDate:
                        type: string
                        format: date
                        example: '2023-10-02'
                        description: Data incial
                      type:
                        type: string
                        enum:
                        - FIXED_VALUE
                        - NOT_APPLICABLE
                        - PERCENTAGE
                        example: FIXED_VALUE
                      value:
                        type: number
                        example: 13
                    title: Fine
                title: UpdateDueDatePixRequest
              properties:
                tags:
                  description: Objeto de exemplo para atualização de todos os tipos de cobranças.
              title: UpdateCollectionRequest
      responses:
        '200':
          description: Cobrança Atualizada
          content:
            application/json:
              schema:
                type: object
                required:
                - collectionId
                properties:
                  collectionId:
                    type: string
                    example: ff3e1be1-f409-4e3f-b13c-37ecb0ed3a84
                    description: Id da cobrança
                    title: CollectionId
                  dueDate:
                    type: string
                    format: date
                    example: '2024-05-28'
                    description: Data do vencimento da cobrança
                    title: DueDate
                  overDueDate:
                    type: string
                    format: date
                    example: '2025-04-20'
                    description: Data de expiração da cobrança
                    title: OverDueDate
                  createdAt:
                    type: string
                    example: '2025-04-15T21:00:44.875Z'
                    description: Data da criação
                    title: CreatedAt
                  amount:
                    type: number
                    example: 270.87
                    description: Valor da cobrança
                    title: Amount
                  batchId:
                    type: string
                    format: uuid
                    example: 611a3814-dc17-4d0b-b7fc-20f98ba618ee
                    description: Id do lote das cobranças
                    title: BatchId
                  deliveryMediums:
                    type: array
                    items:
                      type: string
                      enum:
                      - Sms
                      - Email
                    example:
                    - Sms
                    - Email
                    description: Configuração de envio da cobrança para o pagador
                    title: DeliveryMediums
                  interest:
                    type: object
                    properties:
                      startDate:
                        type: string
                        format: date
                        example: '2023-10-02'
                      type:
                        type: string
                        enum:
                        - FIXED_VALUE_PER_DAY
                        - PERCENTAGE_PER_MONTH
                        - NOT_APPLICABLE
                        example: FIXED_VALUE_PER_DAY
                      value:
                        type: number
                        example: 123
                    title: Interest
                  fine:
                    type: object
                    properties:
                      startDate:
                        type: string
                        format: date
                        example: '2023-10-02'
                        description: Data incial
                      type:
                        type: string
                        enum:
                        - FIXED_VALUE
                        - NOT_APPLICABLE
                        - PERCENTAGE
                        example: FIXED_VALUE
                      value:
                        type: number
                        example: 13
                    title: Fine
                  discounts:
                    type: array
                    maxLength: 3
                    items:
                      type: object
                      properties:
                        limitDate:
                          type: string
                          format: date
                          example: '2023-10-10'
                          description: Data limite
                        type:
                          type: string
                          enum:
                          - FIXED_VALUE
                          - NOT_APPLICABLE
                          - PERCENTAGE
                          example: FIXED_VALUE
                        value:
                          type: number
                          example: 13
                      title: Discount
                  rebate:
                    type: object
                    description: Dados de abatimento da cobrança
                    required:
                    - type
                    - value
                    properties:
                      type:
                        type: string
                        enum:
                        - FIXED_VALUE
                        - NOT_APPLICABLE
                        - PERCENTAGE
                        example: FIXED_VALUE
                        description: 'Tipo do abatimento. FIXED_VALUE: valor fixo em reais (deve ser maior que 0 e menor que o valor da cobrança). PERCENTAGE: percentual sobre o valor da cobrança (deve ser maior que 0 e menor que 100). NOT_APPLICABLE: sem abatimento (value deve ser 0).

                          '
                      value:
                        type: number
                        example: 10
                        description: Valor do abatimento. Para FIXED_VALUE, valor em reais. Para PERCENTAGE, percentual. Para NOT_APPLICABLE, deve ser 0.
                    title: Rebate
                  status:
                    type: string
                    enum:
                    - OVERDUE
                    - CREATED
                    - PROCESSING
                    - PAID
                    - CANCELED
                    - FAILED
                    example: PROCESSING
                    description: Status da cobrança
                    title: CollectionStatus
                  type:
                    type: string
                    enum:
                    - BANKSLIP_QRCODE
                    - BANKSLIP
                    - DUE_DATE_PIX
                    example: BANKSLIP_QRCODE
                    description: 'Tipo da cobrança

                      - `BANKSLIP`: Cobrança do tipo boleto simples

                      - `BANKSLIP_QRCODE`: Cobrança do tipo bolepix (QrCode de Pix cobrança + Código de barras)

                      - `DUE_DATE_PIX`: Cobrança do tipo QrCode (QrCode de Pix cobrança)

                      '
                    title: Type
                  payee:
                    type: object
                    properties:
                      name:
                        type: string
                        example: VECHI CONSULTORIA E PROJETOS LTDA
                        description: Nome do beneficiário
                        title: PayeeName
                      personType:
                        type: string
                        enum:
                        - J
                        - F
                        example: J
                        description: Tipo do documento
                        title: PersonType
                      taxId:
                        type: string
                        example: '37297902000141'
                        description: Documento do beneficiário
                        title: PayeeTaxId
                      bankCode:
                        type: string
                        example: '208'
                        description: Código do banco emissor
                        title: BankCode
                      branchCode:
                        type: string
                        example: '50'
                        description: Agência bancária
                        title: AccountBranch
                      number:
                        type: string
                        example: 003081850
                        description: Número da conta com dígito
                        title: AccountNumber
                    description: Dados do beneficiario
                    title: Payee
                  payer:
                    type: object
                    required:
                    - name
                    - taxId
                    - personType
                    properties:
                      name:
                        type: string
                        example: José Ribeiro
                        description: Nome do pagador
                        title: PayerName
                      taxId:
                        type: string
                        example: '12345678901'
                        description: Documento do pagador
                        title: PayerTaxId
                      personType:
                        type: string
                        enum:
                        - J
                        - F
                        example: J
                        description: Tipo do documento
                        title: PersonType
                      email:
                        type: string
                        example: user@gmail.com
                        description: E-mail do pagador
                        title: PayerEmail
                      phoneNumber:
                        type: string
                        example: +55(99)99999-9999
                        description: Telefone do pagador
                        title: PayerPhoneNumber
                      address:
                        type: object
                        required:
                        - city
                        - state
                        - street
                        - zipCode
                        - number
                        - neighborhood
                        properties:
                          city:
                            type: string
                            maxLength: 50
                            example: São Paulo
                            title: AddressCity
                          state:
                            type: string
                            example: SP
                            title: AddressState
                          street:
                            type: string
                            maxLength: 40
                            example: Av. Brig. Faria Lima
                            title: AddressStreet
                          zipCode:
                            type: string
                            maxLength: 8
                            example: 04538133
                            title: AddressZipCode
                          number:
                            type: string
                            maxLength: 10
                            example: '3477'
                            title: AddressNumber
                          neighborhood:
                            type: string
                            maxLength: 20
                            example: Itaim Bibi
                            title: AddressNeighborhood
                          complement:
                            type: string
                            example: Sala 512
                            title: AddressComplement
                        description: Informações do endereço do pagador
                        title: PayerAddress
                    description: Dados do pagador
                    title: Payer
                  description:
                    type: string
                    example: Descrição da cobrança
                  detail:
                    type: object
                    properties:
                      barCode:
                        type: string
                        example: '20892962100000010000050010000039858903886850'
                        description: Código de barras
                        title: Barcode
                      digitableLine:
                        type: string
                        example: '20890050091000003985889038868504296210000001000'
                        description: Linha digitável
                        title: DigitableLine
                      ourNumber:
                        type: string
                        maxLength: 20
                        example: '54865486214'
                        description: Nosso número da cobrança
                        title: OurNumber
                      documentNumber:
                        type: string
                        maxLength: 15
                        example: PARCELA-123
                        description: Número de documento da cobrança
                        title: DocumentNumber
                      emv:
                        type: string
                        example: 00020101021226930014br.gov.bcb.pix2571api-h.developer.btgpactual.com/pc/p/v2/573597357dc04cd388ebf85dfdd4d1cd5204000053039865802BR5925INSTITUTO PACTO PELO ESPO6009SAO PAULO61080453813362070503***80970014
                        description: Códido do copia e cola para leitura do QrCode
                        title: Emv
                      pixKey:
                        type: string
                        maxLength: 77
                        example: teste@hotmail.com
                        description: Chave pix - Caso não informado será usado uma chave EVP (aleatória)
                        title: PixKey
                      txId:
                        type: string
                        minLength: 26
                        maxLength: 35
                        example: 56487asd654ads8qwe4500000awwa
                        description: Identificador da transação
                        title: TxId
                      correlationId:
                        type: string
                        maxLength: 20
                        example: '54865486214'
                        description: Id de correlação da cobrança
                        title: CorrelationId
                      badCredit:
                        type: object
                        description: Informações de negativação para cobranças com type BANKSLIP ou BANKSLIP_QRCODE
                        required:
                        - type
                        properties:
                          type:
                            type: string
                            description: Se NOT_APPLICABLE, o campo issueDate não deve ser informado
                            enum:
                            - APPLICABLE
                            - NOT_APPLICABLE
                            example: APPLICABLE
                          issueDate:
                            type: string
                            description: Data para negativar a cobrança
                            example: '2025-04-01'
                        title: BadCreditIssueDate
                      protest:
                        type: object
                        description: Informações de protesto para cobranças BANKSLIP e BANKSLIP_QRCODE
                        required:
                        - type
                        properties:
                          type:
                            type: string
                            description: Se NOT_APPLICABLE, issueDate não deve ser informado. A data de protesto deve ser maior que a data de vencimento e menor ou igual à data de expiração.
                            enum:
                            - APPLICABLE
                            - NOT_APPLICABLE
                            example: APPLICABLE
                          issueDate:
                            type: string
                            format: date
                            description: Data para protestar a cobrança. Deve ser maior que dueDate, menor ou igual a overDueDate e maior que badCredit.issueDate quando aplicável.
                            example: '2025-05-01'
                        title: ProtestIssueDate
                      automaticPix:
                        type: object
                        properties:
                          authorizationId:
                            type: string
                            format: uuid
                            example: 611a3814-dc17-4d0b-b7fc-20f98ba618ee
                            description: Id da autorização do Pix Automático
                            title: AuthorizationId
                        title: AutomaticPix
                    title: Detail
                  tags:
                    type: object
                    additionalProperties:
                      type: string
                      example: Parcela da faculdade
                    description: Lista de tags (objeto com máximo 10 itens)
                    title: Tags
                  updatedAt:
                    type: string
                    example: '2025-04-15T21:00:44.875Z'
                    description: Data da atualização
                    title: UpdatedAt
                  protest:
                    type: object
                    description: Resumo do protesto vinculado à cobrança
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 0436436c-77a3-45c7-94af-527cb4dc80e2
                        description: ID do protesto
                      status:
                        type: string
