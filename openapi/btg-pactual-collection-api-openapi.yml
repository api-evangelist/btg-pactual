                              type: string
                              example: 003081850
                              description: Número da conta com dígito
                              title: AccountNumber
                          description: Dados do beneficiario
                          title: Payee
                        payer:
                          type: object
                          required:
                          - name
                          - taxId
                          - personType
                          properties:
                            name:
                              type: string
                              example: José Ribeiro
                              description: Nome do pagador
                              title: PayerName
                            taxId:
                              type: string
                              example: '12345678901'
                              description: Documento do pagador
