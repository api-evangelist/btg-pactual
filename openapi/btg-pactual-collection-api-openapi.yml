                              - PENDING
                              - PROCESSING
                              - SETTLED
                              - FAILED
                              - CANCELED
                              example: PENDING
                              description: Status da parte do split
                            divisionAmount:
                              type: number
                              example: 0.2
                              description: Valor nominal da divisão. Para PERCENT é uma fração menor que 1; para VALUE é o valor absoluto em BRL.
                            amountPaid:
                              type: number
                              example: 270
                              description: Valor efetivamente pago à parte (presente apenas após liquidação)
                            isBeneficiary:
                              type: boolean
                              example: false
                              description: Indica se esta é a parte residual do beneficiário emissor
                      _links:
                        type: object
                        properties:
                          details:
                            type: object
                            properties:
                              href:
                                type: string
                                example: /api/v1/Collection/ff3e1be1-f409-4e3f-b13c-37ecb0ed3a84/split/0436436c-77a3-45c7-94af-527cb4dc80e2
                                description: Link para detalhes do split
                              method:
                                type: string
                                example: GET
                              type:
                                type: string
                                example: application/json
                    title: SplitInfo
                title: CollectionResponse
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: BadRequestError
                  brn:
                    type: string
                    example: brn:empresas:banking:errors:bad-request-error
                  reason:
                    type: string
                    example: Dados inválidos na requisição
                  invalidParams:
                    type: array
                    items:
                      type: object
                      required:
                      - value
                      - name
                      - reason
                      properties:
                        name:
                          type: string
                          example: startDate
                        reason:
                          type: string
                          example: A data de inicio do juros deve ser maior ao vencimento da cobrança
                        value:
                          type: string
                          example: '1999-02-06T00:00:00Z'
                    title: BadRequestErrorResponse
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  Message:
                    type: string
                    example: Não foi possível processar a operação
                  Details:
                    type: object
                    required:
                    - brn
                    - name
                    properties:
                      brn:
                        type: string
                        example: brn:empresas:banking:errors:invalid-input-error
                        description: Brn referente ao erro.
                      name:
                        type: string
                        example: UnprocessableEntityError
                        description: Nome do erro.
                      reason:
                        type: string
                        example: UnprocessableEntityErrorResponse
                        description: Motivo do erro.
                    title: UnprocessableEntityErrorResponse
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  Message:
                    type: string
                    example: Erro interno no servidor
                  Details:
                    type: object
                    required:
                    - brn
                    - name
                    properties:
                      brn:
                        type: string
                        example: brn:empresas:banking:errors:internal-server-error
                        description: Brn referente ao erro.
                      name:
                        type: string
                        example: InternalServerError
                        description: Nome do erro.
                    title: InternalServerErrorResponse
      security:
      - write:
        - brn:btg:empresas:banking:collections
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Collections/criar-cobranca
      summary: Create by company id banking collections
      x-summary-source: derived
      operationId: postByCompanyIdBankingCollections
      x-operation-id-source: derived
    get:
      tags:
      - Collection
      description: '## 📘 Ambiente de sandbox

        > Esta API utiliza o Wiremock


        > No sandbox este endpoint requer a utilização de Sandbox Headers


        | Header | Descrição | Valores Aceitos |

        | :--------- | :----------------------------------- | :-------------- |

        | x-response | Controlar o tipo de resposta da API. | success ou error |'
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
        description: CNPJ da empresa
        example: '30306294000145'
      - in: query
        name: pageSize
        description: Tamanho da pagina
        schema:
          type: number
          example: 10
          description: Número de itens por página
          title: PageSize
        required: true
      - in: query
        name: pageNumber
        description: Número da pagina
        schema:
          type: number
          example: 1
          description: Número da página
          title: PageNumber
        required: true
      - in: query
        name: types
        description: 'Tipos de cobrança: se vazio retorna por padrão BANKSLIP e BANKSLIP_QRCODE'
        schema:
          type: string
          enum:
          - BANKSLIP_QRCODE
          - BANKSLIP
          - DUE_DATE_PIX
          example: BANKSLIP_QRCODE
          description: 'Tipo da cobrança

            - `BANKSLIP`: Cobrança do tipo boleto simples

            - `BANKSLIP_QRCODE`: Cobrança do tipo bolepix (QrCode de Pix cobrança + Código de barras)

            - `DUE_DATE_PIX`: Cobrança do tipo QrCode (QrCode de Pix cobrança)

            '
          title: Type
      - in: query
        name: id
        description: Id da cobrança
        schema:
          type: string
          example: ff3e1be1-f409-4e3f-b13c-37ecb0ed3a84
          description: Id da cobrança
          title: CollectionId
      - in: query
        name: barcode
        description: Código de barras
        schema:
          type: string
          example: '20892962100000010000050010000039858903886850'
          description: Código de barras
          title: Barcode
      - in: query
        name: digitableLine
        description: Linha digitável
        schema:
          type: string
          example: '20890050091000003985889038868504296210000001000'
          description: Linha digitável
          title: DigitableLine
      - in: query
        name: documentNumber
        description: Número do documento
        schema:
          type: string
          maxLength: 15
          example: PARCELA-123
          description: Número de documento da cobrança
          title: DocumentNumber
      - in: query
        name: ourNumber
        description: Nosso número
        schema:
          type: string
          maxLength: 20
          example: '54865486214'
          description: Nosso número da cobrança
          title: OurNumber
      - in: query
        name: startCreatedAt
        description: Data de criação mínima
        schema:
          type: string
          example: '2024-10-12'
          description: Data de criação mínima
          title: StartCreatedAt
      - in: query
        name: endCreatedAt
        description: Data de criação máxima
        schema:
          type: string
          example: '2024-10-12'
          description: Data de criação máxima
          title: EndCreatedAt
      - in: query
        name: status
        description: 'Status da cobrança, para informar mais de um status, separe os valores por vírgula: CREATED,PAID'
        schema:
          type: string
          enum:
          - OVERDUE
          - CREATED
          - PROCESSING
          - PAID
          - CANCELED
          - FAILED
          example: PROCESSING
          description: Status da cobrança
          title: CollectionStatus
      - in: query
        name: payer.name
        description: Nome do pagador
        schema:
          type: string
          example: José Ribeiro
          description: Nome do pagador
          title: PayerName
      - in: query
        name: payer.taxId
        description: Documento do pagador
        schema:
          type: string
          example: '12345678901'
          description: Documento do pagador
          title: PayerTaxId
      - in: query
        name: batchId
        description: Id do lote de emissão das cobranças
        schema:
          type: string
          format: uuid
          example: 611a3814-dc17-4d0b-b7fc-20f98ba618ee
          description: Id do lote das cobranças
          title: BatchId
      - in: query
