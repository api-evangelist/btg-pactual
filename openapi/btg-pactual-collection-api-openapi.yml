        schema:
          type: string
          example: eyJ4LWlkZW50aWZpY2F0aW9uIjoiMzcyOTc5MDIwMDAxNDEiLCJwYWdlU2l6ZSI6IjEiLCJwYWdlTnVtYmVyIjoiMiIsInN0YXR1cyI6IkNSRUFURUQiLCJpZCI6IjFlNWQ4M2M4LTkyYjUtNGYzOS04MjdjLTlkMGEzODQ3YzE4MSI
          description: Cursor de busca
          title: Cursor
