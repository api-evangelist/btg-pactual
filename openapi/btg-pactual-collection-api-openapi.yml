        description: Data de atualização
        schema:
          type: string
          example: '2025-04-15T21:00:44.875Z'
          description: Data da atualização
          title: UpdatedAt
      - in: query
        name: startDueDate
        description: Data de vencimento mínima
        schema:
          type: string
          example: '2024-10-12'
          description: Data de vencimento mínima
          title: StartDueDate
      - in: query
        name: endDueDate
        description: Data de vencimento máxima
        schema:
          type: string
          example: '2024-10-12'
          description: Data de vencimento máxima
          title: EndDueDate
      - in: query
        name: startSettledAt
        description: Data de liquidação mínima
        schema:
          type: string
          example: '2024-10-12'
          description: Data de liquidação mínima
          title: StartSettledAt
      - in: query
        name: endSettledAt
        description: Data de liquidação máxima
        schema:
          type: string
          example: '2024-10-12'
          description: Data de liquidação máxima
          title: EndSettledAt
      - in: query
        name: badCredit.status
        description: 'Status da negativação, para informar mais de um status, separe os valores por vírgula: STARTING,PROCESSING'
        schema:
          type: string
          enum:
          - STARTING
          - PROCESSING
          - WARNING_PERIOD
          - FAILED_TO_SEND
          - CONFIRMED
          - CANCELED
          example: STARTING
          description: Status da negativação
          title: BadCreditStatus
      - in: query
        name: protest.status
        description: 'Status do protesto, para informar mais de um status, separe os valores por vírgula: SCHEDULED,CONFIRMED'
        schema:
          type: string
          enum:
          - SCHEDULED
          - PROCESSING
          - CANCELED
          - SENT
          - CONFIRMED
          - FAILED
          - PAID
          - REMOVED
          - PROTESTED
          - SETTLED
          - FORFEITED
          - FORFEITING
          - REMOVING
          - REMOVE_FAILED
          - FORFEIT_FAILED
          - PENDING_REVIEW
          - CANCELING
          example: SCHEDULED,CONFIRMED,PROTESTED
          description: Status do protesto (permite múltiplos valores separados por vírgula)
          title: ProtestStatusFilter
      - in: query
        name: split.status
        description: 'Status do split, para informar mais de um status, separe os valores por vírgula: PENDING,SUCCESS'
        schema:
          type: string
          enum:
          - PENDING
          - PROCESSING
          - SUCCESS
          - FAILED
          - CANCELED
          example: PENDING,SUCCESS
          description: Status do split (permite múltiplos valores separados por vírgula)
          title: SplitStatusFilter
      - in: query
        name: isAnticipated
        description: Cobrança antecipada
        schema:
          type: string
          example: 'true'
          description: Cobrança antecipada
          title: IsAnticipated
      - in: query
