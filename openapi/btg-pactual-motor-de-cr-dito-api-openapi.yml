info:
  title: FIDC - Motor de Credito Motor de Crédito API
  version: 1.0.1
  description: 'Documentação de integração na jornada de FIDC VR.


    Links úteis:

    - Portal Developers

    - API de Arquivos'
  termsOfService: https://www.btgpactual.com/empresas/termos-e-politicas/
servers:
- url: https://api.sandbox.empresas.btgpactual.com
  description: Sandbox
- url: https://api.empresas.btgpactual.com
  description: Produção
tags:
- name: Motor de Crédito
paths:
  /v1/fidc/credit/creditengine/{fundTaxId}/customer/evaluation:
    post:
      tags:
      - Motor de Crédito
      description: Análise detalhada por cliente específico.
      parameters:
      - name: fundTaxId
        in: path
        description: CNPJ do fundo
        required: true
        schema:
          type: string
          format: text
          example: '13339532000109'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                proposalId:
                  type:
                  - string
                  - 'null'
                  format: text
                  example: PRP-3bd1e5ad73b84f4485aaed19c8aa6f1f
                  description: id da proposta na dataprev
                inlet:
                  type: string
                  format: text
                  example: CTPS
                  enum:
                  - CTPS
                  - Partner
                  description: canal de entrada do pedido da operação
                requestedAmount:
                  type: number
                  format: double
                  example: 1830.89
                  description: valor solicitada da operação via CTPS
                requestedInstallments:
                  type: number
                  format: int64
                  example: 1
                  description: quantidade de parcelas solicitada da operação via CTPS
                client:
                  type: object
                  properties:
                    cbo:
                      type: integer
                      description: fornecido pela dataprev
                      format: int64
                      example: 0
                    name:
                      type: string
                      example: Nome do Cliente
                    gender:
                      type: string
                      example: Male
                      enum:
                      - Male
                      - Female
                      description: Gênero do cliente
                    dateOfBirth:
                      type: string
                      format: datetime
                      example: '1988-10-11T14:32:50'
                    nationality:
                      type: string
                      example: Brasileira
                    alerts:
                      type: array
                      items:
                        type: object
                        properties:
                          alertType:
                            type: string
                          refereceDate:
                            type: string
                            format: datetime
                            example: '2023-05-19T00:00:00'
                          eventId:
                            type: integer
                          reason:
                            type: string
                          leaveDate:
                            type: string
                            format: datetime
                            example: '2023-05-12T14:32:50'
                          leaveEndDate:
                            type: string
                            format: datetime
                            example: '2023-05-19T02:54:22'
                          dimissalDate:
                            type: string
                            format: datetime
                            example: '2023-06-05T11:52:36'
                          advanceNoticeDate:
                            type: string
                            format: datetime
                            example: '2023-06-09T10:21:51'
                          advanceNoteceEndDate:
                            type: string
                            format: datetime
                            example: '2023-06-10T15:40:17'
                    document:
                      type: string
                      example: '12345678900'
                    baseMarginAmount:
                      type: number
                      format: double
                      example: 1830.89
                    availableMarginAmount:
                      type: number
                      format: double
                      example: 640.81
                    isEligible:
                      type: boolean
                      example: true
                    registration:
                      type: string
                      format: text
                      example: MERCADO3232
                      description: código dataprev
                    workCategory:
                      type: number
                      format: int64
                      example: 101
                    admissionDate:
                      type: string
                      format: datetime
                      example: '2023-05-19T00:00:00'
                    dissmissalDate:
                      type:
                      - string
                      - 'null'
                      format: datetime
                      example: null
                    dissmissalReason:
                      type:
                      - string
                      - 'null'
                      format: text
                      example: null
                    isPolitcallyExposedPerson:
                      type: boolean
                      example: false
                employer:
                  type: object
                  properties:
                    cnae:
                      type: string
                      format: text
                      example: '4000000'
                    name:
                      type: string
                      format: text
                      example: Nome da Empresa
                    registration:
                      type: string
                      format: text
                      example: '12345678000100'
                    registrationType:
                      type: string
                      format: text
                      example: CNPJ
                    activityStartDate:
                      type: string
                      format: datetime
                      example: '2020-12-04T00:00:00'
              title: PostCustomerEvaluationRequest
        required: true
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposalId:
                    type: string
                    format: text
                    example: PRP-1060818A
                    description: id da proposta na dataprev
                  effectiveness:
                    type: string
                    description: status da validação
                    example: Approved
                    enum:
                    - Approved
                    - Rejected
                  apparentLimitAmount:
                    type: number
                    format: double
                    example: 28830.8
                  expirationDate:
                    type: string
                    format: datetime
                    example: '2023-05-19T11:52:46.6402444-03:00'
                  creationDate:
                    type: string
                    format: datetime
                    example: '2023-05-19T11:52:46.6402444-03:00'
                  taxes:
                    type: array
                    items:
                      type: object
                      properties:
                        rate:
                          type: number
                          format: double
                          example: 0.0349
                        taxModality:
                          type: string
                          description: modalidade da taxa, com ou sem seguro
                          example: WithInsurance
                          enum:
                          - WithInsurance
                          - WithoutInsurance
                        registrationFeeRate:
                          type: number
                          format: double
                          example: 0
                        minInstallments:
                          type: integer
                          example: 2
                        maxInstallments:
                          type: integer
                          example: 24
                        penaltyFeeRate:
                          type: number
                          format: double
                          example: 0.02
                        interestArrearsRate:
                          type: number
                          format: double
                          example: 0.01
                        minInstallmentsAllowed:
                          type: integer
                          example: 2
                        minAmountPerInstallmentsAllowed:
                          type: number
                          format: double
                          example: 50
                        maxAmountPerInstallmentsAllowed:
                          type: number
                          format: double
                          example: 3864.47
                title: PostCustomerEvaluationResponse
        '400':
          description: Invalid input
        '422':
          description: Validation exception
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
                title: Error
      security:
      - oauth2:
        - empresas.btgpactual.com/loans
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/FIDC%20-%20Motor%20de%20Credito/analise-detalhada-por-cliente-especifico
