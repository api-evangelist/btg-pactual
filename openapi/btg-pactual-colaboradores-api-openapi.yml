      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
      - name: companyTaxIds
        in: query
        schema:
          type: array
          items:
            type: string
      - name: pageSize
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
