  /{companyId}/banking/payroll/employees:
    get:
      tags:
      - Colaboradores
      description: 'Retorna lista paginada de colaboradores das empresas informadas com filtros opcionais. Paginação por cursor: use o valor de `_links.next.href` para navegar entre páginas.


        **Status do colaborador:**


        | Status | Significado |

        |---|---|

        | `active` | Colaborador ativo com conta BTG |

        | `pending` | Onboarding em andamento, conta ainda não ativada |

        | `suspended` | Conta suspensa |

        | `inactive` | Colaborador desligado |


        ## 📘 Ambiente de sandbox

        > Esta API utiliza o Wiremock


        > No sandbox este endpoint requer a utilização de Sandbox Headers


        | Header | Descrição | Valores Aceitos |

        | :--------- | :----------------------------------- | :-------------- |

        | x-response | Controlar o tipo de resposta da API. | success ou error |'
