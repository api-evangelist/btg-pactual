        in: query
        schema:
          type: string
      - name: employeeTaxId
        in: query
        schema:
          type: string
      - name: branch
        in: query
        schema:
          type: string
      - name: accountNumber
        in: query
        schema:
          type: string
      - name: portability
        in: query
        schema:
          type: boolean
      - name: contractType
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
                properties:
                  data:
                    type:
                    - array
                    - 'null'
                    items:
                      type: object
                      properties:
                        name:
                          type:
                          - string
                          - 'null'
                        taxId:
                          type:
                          - string
                          - 'null'
                        personType:
                          type:
                          - string
                          - 'null'
                        status:
                          type:
                          - string
                          - 'null'
                        isActive:
                          type: boolean
                        onboardingCompleted:
                          type:
                          - string
                          - 'null'
                        isSuspended:
                          type: boolean
                        portability:
                          type:
                          - boolean
                          - 'null'
                        admissionDate:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        terminationDate:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        company:
                          type: object
                          properties:
                            name:
                              type:
                              - string
                              - 'null'
                            taxId:
                              type:
                              - string
