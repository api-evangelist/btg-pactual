                          - number
                          - branch
                          - bankCode
                          properties:
                            type:
                              type: string
                              description: Tipo de conta do pagador
                              enum:
                              - CC
                              - PP
                              - CS
                              - CD
                              - CI
                              - CG
                              - CP
                              - PG
                            number:
                              description: Número da conta do pagador
                              type: string
                            branch:
                              description: Agência da conta do pagador
                              type: string
                            bankCode:
                              description: Código do banco do pagador
                              type: string
                              pattern: ^\d{3}$
                            ispb:
                              description: ISPB do banco do pagador
                              type: string
                              example: '30306294'
                      title: RecurrenceParty
                    detail:
                      description: Detalhes do pagamento
                      oneOf:
                      - type: object
                        required:
                        - key
                        properties:
                          key:
                            description: Chave pix do pagamento
                            type: object
                            required:
                            - value
                            properties:
                              value:
                                type: string
                      - type: object
                        required:
                        - emv
                        properties:
                          emv:
                            description: EMV do pix
                            type: string
                      - type: object
                        required:
                        - key
                        - transactionId
                        properties:
                          key:
                            description: Chave pix do pagamento
                            type: object
                            required:
                            - value
                            properties:
                              value:
                                type: string
                          transactionId:
                            description: ID da transação do pagamento
                            type: string
                      - type: object
                        required:
                        - creditParty
                        properties:
                          creditParty:
                            description: Parte creditada no pagamento
                            type: object
                            required:
                            - taxId
                            - name
                            - account
                            properties:
                              taxId:
                                type: string
                                pattern: ^(\d{11}|\d{14})$
                                description: CNPJ do pagador
                              name:
                                type: string
                                description: Nome do pagador
                              account:
                                description: Conta do pagador
                                type: object
                                required:
                                - type
                                - number
                                - branch
                                - bankCode
                                properties:
                                  type:
                                    type: string
                                    description: Tipo de conta do pagador
                                    enum:
                                    - CC
                                    - PP
                                    - CS
                                    - CD
                                    - CI
                                    - CG
                                    - CP
                                    - PG
                                  number:
                                    description: Número da conta do pagador
                                    type: string
                                  branch:
                                    description: Agência da conta do pagador
                                    type: string
                                  bankCode:
                                    description: Código do banco do pagador
                                    type: string
                                    pattern: ^\d{3}$
                                  ispb:
                                    description: ISPB do banco do pagador
                                    type: string
                                    example: '30306294'
                            title: RecurrenceParty
                  title: RecurrenceBasePayment
                recurringPaymentDates:
                  type: array
                  items:
                    type: string
                    example: '2024-09-10'
              title: RecurrenceRequest
        required: true
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  operationNeedsApproval:
                    type: boolean
                    example: true
                  contractGuid:
