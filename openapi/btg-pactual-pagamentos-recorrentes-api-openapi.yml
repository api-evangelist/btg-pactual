        | :--------- | :----------------------------------- | :-------------- |

        | x-response | Controlar o tipo de resposta da API. | success ou error |'
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      - name: recurrenceId
        description: Recurrence ID
        schema:
          type: string
        in: path
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - allowOverdraftUsage
              - maxAmount
              - notifyScheduling
              properties:
                type:
                  type: string
                  enum:
                  - PIX_AUTOMATIC
                detail:
                  type: object
                  properties:
                    allowOverdraftUsage:
                      type: boolean
                      example: true
                    maxAmount:
                      type: number
                      example: 1000
                    notifyScheduling:
                      type: boolean
                      example: true
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  localtion:
                    type: string
                    example: https://bankinghub.uat.btgpactualbusiness.com/api/v1/Operations/4444444-cc81-417f-8f2d-444444a0e
      security:
      - oauth2:
