            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 35455c30-49eb-4143-ac69-1887be87de78
                  type:
                    type: string
                    example: PAYMENT
                  status:
                    type: string
                    example: STARTED
                  systemOrigin:
                    type: string
                    example: '***REMOVED_AUTHORIZATION_SERVER_CLIENT_ID***'
                  periodicity:
                    type: object
                    properties:
                      type:
                        type: string
                        example: WEEKLY
                      detail:
                        type: object
                        properties:
                          startDate:
                            type: string
                            format: date
                            example: '2025-06-16'
                          endDate:
                            type: string
                            format: date
                            example: '2025-07-28'
                          quantity:
                            type: integer
                            example: 7
                  basePayment:
                    type: object
                    properties:
                      type:
                        type: string
                        example: PIX_KEY
                      amount:
                        type: number
                        format: float
                        example: 0.55
                      debitParty:
                        type: object
                        properties:
                          name:
                            type: string
                            example: VECHI CONSULTORIA E PROJETOS LTDA
                          taxId:
                            type: string
                            example: '37297902000141'
                          account:
                            type: object
                            properties:
                              type:
                                type: string
                                example: CC
                              ispb:
                                type: string
                                example: '30306294'
                              branch:
                                type: string
                                example: '50'
                              number:
                                type: string
                                example: 003886850
                              bankCode:
                                type: string
                                example: '208'
                      detail:
                        type: object
                        properties:
                          creditParty:
                            type: object
                            properties:
                              name:
                                type: string
                                example: BRUNO VIANA DE SIQUEIRA
                              taxId:
                                type: string
                                example: '***589211**'
                              account:
                                type: object
                                properties:
                                  bankCode:
                                    type: string
                                    example: '208'
                                  ispb:
                                    type: string
                                    example: '30306294'
                                  type:
                                    type: string
                                    example: '**'
                                  branch:
                                    type: string
                                    example: '**'
                                  number:
                                    type: string
                                    example: '*********'
                          key:
                            type: object
                            properties:
                              value:
                                type: string
                                example: 06058921139
                              type:
                                type: string
                                example: TAX_ID
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        detail:
                          type: string
                          example: Pendente aprovação de representante legal.
