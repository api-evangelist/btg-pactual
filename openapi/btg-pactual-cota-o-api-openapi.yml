openapi: 3.2.0
info:
  title: HUBFX - Cambio Cotação API
  description: Esta API tem a finalidade de operar câmbio
  version: '1.0'
  contact:
    name: Time BTG Empresas Câmbio
    email: ol-it-btgempresas-tradefinance@btgpactual.com
servers:
- url: https://api.sandbox.empresas.btgpactual.com
  description: Sandbox
- url: https://api.empresas.btgpactual.com
  description: Prod
tags:
- name: Cotação
paths:
  /cambio/public/institutional/indicative:
    post:
      tags:
      - Cotação
      description: Lista cotações indicativas das principais moedas. É necessário fornecer um token reCAPTCHA válido.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                recaptcha:
                  type:
                  - string
                  - 'null'
              additionalProperties: false
              title: PublicQuoteInstitutionalCommand
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    quoteCurrency:
                      type:
                      - string
                      - 'null'
                      deprecated: true
                    quoteCurrencyCode:
                      type:
                      - string
                      - 'null'
                    quoteCurrencyName:
                      type:
                      - string
                      - 'null'
                    quoteCurrencyURL:
                      type:
                      - string
                      - 'null'
                    quoteCurrencyLocale:
                      type:
                      - string
                      - 'null'
                    baseCurrency:
                      type:
                      - string
                      - 'null'
                    price:
                      type: number
                      format: double
                    flowType:
                      type:
                      - string
                      - 'null'
                    openingPrice:
                      type: number
                      format: double
                    delta:
                      type: number
                      format: double
                  additionalProperties: false
                  title: PublicQuoteInstitutionalResponse
        '401':
          description: Unauthorized
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/HUBFX%20-%20Cambio/lista-cotacoes-indicativas-das-principais-moedas
      summary: Create cambio public institutional indicative
      x-summary-source: derived
      operationId: postCambioPublicInstitutionalIndicative
      x-operation-id-source: derived
