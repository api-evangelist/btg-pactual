                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        paymentId:
                          type: string
                          example: 29d42888-a920-4a85-a163-aa25b4937b3f
                          title: PaymentId
                        type:
                          description: Boleto de cobrança
                          enum:
                          - BANKSLIP
                          - PIX_QR_CODE
                          - UTILITIES
                          - TED
                          - PIX
                          type: string
                          title: Type
