        schema:
          type: number
        in: query
        required: true
      - examples:
          numberExample:
            value: '1'
        name: pageNumber
        description: Número da página onde começará a query
        schema:
          type: number
        in: query
        required: true
      - name: paymentType
        description: Tipo do pagamento(TED, PIX_MANUAL, etc...)
        schema:
          type: string
        in: query
        required: false
      - name: receiver
        description: CNPJ da parte creditada
        schema:
          type: string
        example: '12341234123422'
        in: query
        required: false
      - name: batchId
        description: Id do lote de transferências/pagamentos
        example: 1341bwef-124qwebd-234qsddfq
        schema:
          type: string
        in: query
        required: false
      - name: minPaymentDate
        description: Data minima de pagamento
        example: '2024-09-10'
        schema:
          type: string
        in: query
        required: false
      - name: maxPaymentDate
        description: Data máxima de pagamento
        example: '2025-09-09'
        schema:
          type: string
        in: query
        required: false
      - name: minAmount
        description: Valor minimo da transação
        example: 3
        schema:
          type: number
        in: query
        required: false
      - name: maxAmount
        description: Valor maximo da transação
        example: 4
        schema:
          type: number
        in: query
        required: false
      - name: status
        description: Status do pagamento ou transferências
        example: CONFIRMED
        schema:
          type: string
        in: query
        required: false
