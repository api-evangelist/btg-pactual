openapi: 3.0.3
info:
  title: Banking - Payments
  version: '1'
  description: Endpoints das APIs de banking do BTG PACTUAL Empresas
  termsOfService: https://www.btgpactual.com/empresas/termos-e-politicas/
servers:
- url: https://api.sandbox.empresas.btgpactual.com
  description: sandbox
- url: https://api.empresas.btgpactual.com
  description: produção
paths:
  /{companyId}/banking/batch-payments/{batchId}:
    delete:
      tags:
      - Lote de Pagamentos
      description: Abandonar Lote
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      - name: batchId
        schema:
          type: string
          description: Id do lote
          example: 829c47f2-3b5c-4103-8d15-a55bd66ae905
          title: BatchId
        in: path
        required: true
      responses:
        '200':
          description: Lote abandonado
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - openid empresas.btgpactual.com/payments
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Payments/abandonar-lote
    patch:
      tags:
      - Lote de Pagamentos
      description: Processar Lote
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      - name: batchId
        schema:
          type: string
          description: Id do lote
          example: 829c47f2-3b5c-4103-8d15-a55bd66ae905
          title: BatchId
        in: path
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isFinished:
                  type: boolean
                  description: Sinalizados de finalizador da transação
                  example: true
              title: BatchPatchBody
        required: true
      responses:
        '202':
          description: Lote finalizado
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - openid empresas.btgpactual.com/payments
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Payments/processar-lote
  /{companyId}/banking/batch-payments:
    post:
      tags:
      - Lote de Pagamentos
      description: Abrir Lote
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      requestBody:
        content:
          application/json:
            schema:
              required:
              - taxId
              type: object
              properties:
                taxId:
                  type: string
                  description: CNPJ
                  example: '46786961000174'
              title: BatchPostBody
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  batchId:
                    type: string
                    description: Id do lote
                    example: 829c47f2-3b5c-4103-8d15-a55bd66ae905
                    title: BatchId
                  expiresAt:
                    type: string
                    description: Data de expiração do lote
                    example: '2024-11-22T19:18:18.233Z'
                  maxSize:
                    type: integer
                    description: Tamanho máximo do lote
                    example: 200
                  taxId:
                    type: string
                    description: CNPJ
                    example: '46786961000174'
                title: BatchPostResponse
          description: Iniciação de Pagamento
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - openid empresas.btgpactual.com/payments
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Payments/abrir-lote
  /{companyId}/banking/payments-recurrences/{recurrenceId}:
    patch:
      tags:
      - Pagamentos Recorrentes
      description: ' ## 📘 Ambiente de sandbox

        > Esta API utiliza o [Wiremock](../../starting-doc/Recursos%20para%20Developers%20BTG%20Empresas%20/APIs/sandbox-1/sandbox-com-wiremock-v2)


        > No sandbox este endpoint requer a utilização de [Sandbox Headers](../../starting-doc/Recursos%20para%20Developers%20BTG%20Empresas%20/APIs/sandbox-1/sandbox-headers)


        | Header     | Descrição                            | Valores Aceitos |

        | :--------- | :----------------------------------- | :-------------- |

        | x-response | Controlar o tipo de resposta da API. | success ou error |'
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      - name: recurrenceId
        description: Recurrence ID
        schema:
          type: string
        in: path
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - allowOverdraftUsage
              - maxAmount
              - notifyScheduling
              properties:
                type:
                  type: string
                  enum:
                  - PIX_AUTOMATIC
                detail:
                  type: object
                  properties:
                    allowOverdraftUsage:
                      type: boolean
                      example: true
                    maxAmount:
                      type: number
                      example: 1000
                    notifyScheduling:
                      type: boolean
                      example: true
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  localtion:
                    type: string
                    example: https://bankinghub.uat.btgpactualbusiness.com/api/v1/Operations/4444444-cc81-417f-8f2d-444444a0e
      security:
      - oauth2:
        - openid empresas.btgpactual.com/payments
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Payments/alterar-recorrencia-de-pagamento
    delete:
      tags:
      - Pagamentos Recorrentes
      description: ' ## 📘 Ambiente de sandbox

        > Esta API utiliza o [Wiremock](../../starting-doc/Recursos%20para%20Developers%20BTG%20Empresas%20/APIs/sandbox-1/sandbox-com-wiremock-v2)


        > No sandbox este endpoint requer a utilização de [Sandbox Headers](../../starting-doc/Recursos%20para%20Developers%20BTG%20Empresas%20/APIs/sandbox-1/sandbox-headers)


        | Header     | Descrição                            | Valores Aceitos |

        | :--------- | :----------------------------------- | :-------------- |

        | x-response | Controlar o tipo de resposta da API. | success ou error |'
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      - name: recurrenceId
        description: Recurrence ID
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: successful operation
      security:
      - oauth2:
        - openid empresas.btgpactual.com/payments
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Payments/cancelar-recorrencia-de-pagamento
    get:
      tags:
      - Pagamentos Recorrentes
      description: ' ## 📘 Ambiente de sandbox

        > Esta API utiliza o [Wiremock](../../starting-doc/Recursos%20para%20Developers%20BTG%20Empresas%20/APIs/sandbox-1/sandbox-com-wiremock-v2)


        > No sandbox este endpoint requer a utilização de [Sandbox Headers](../../starting-doc/Recursos%20para%20Developers%20BTG%20Empresas%20/APIs/sandbox-1/sandbox-headers)


        | Header     | Descrição                            | Valores Aceitos |

        | :--------- | :----------------------------------- | :-------------- |

        | x-response | Controlar o tipo de resposta da API. | success ou error |'
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      - name: recurrenceId
        description: Recurrence ID
        schema:
          type: string
          minLength: 1
        in: path
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 35455c30-49eb-4143-ac69-1887be87de78
                  type:
                    type: string
                    example: PAYMENT
                  status:
                    type: string
                    example: STARTED
                  systemOrigin:
                    type: string
                    example: '***REMOVED_AUTHORIZATION_SERVER_CLIENT_ID***'
                  periodicity:
                    type: object
                    properties:
                      type:
                        type: string
                        example: WEEKLY
                      detail:
                        type: object
                        properties:
                          startDate:
                            type: string
                            format: date
                            example: '2025-06-16'
                          endDate:
                            type: string
                            format: date
                            example: '2025-07-28'
                          quantity:
                            type: integer
                            example: 7
                  basePayment:
                    type: object
                    properties:
                      type:
                        type: string
                        example: PIX_KEY
                      amount:
                        type: number
                        format: float
                        example: 0.55
                      debitParty:
                        type: object
                        properties:
                          name:
                            type: string
                            example: VECHI CONSULTORIA E PROJETOS LTDA
                          taxId:
                            type: string
                            example: '37297902000141'
                          account:
                            type: object
                            properties:
                              type:
                                type: string
                                example: CC
                              ispb:
                                type: string
                                example: '30306294'
                              branch:
                                type: string
                                example: '50'
                              number:
                                type: string
                                example: 003886850
                              bankCode:
                                type: string
                                example: '208'
                      detail:
                        type: object
                        properties:
                          creditParty:
                            type: object
                            properties:
                              name:
                                type: string
                                example: BRUNO VIANA DE SIQUEIRA
                              taxId:
                                type: string
                                example: '***589211**'
                              account:
                                type: object
                                properties:
                                  bankCode:
                                    type: string
                                    example: '208'
                                  ispb:
                                    type: string
                                    example: '30306294'
                                  type:
                                    type: string
                                    example: '**'
                                  branch:
                                    type: string
                                    example: '**'
                                  number:
                                    type: string
                                    example: '*********'
                          key:
                            type: object
                            properties:
                              value:
                                type: string
                                example: 06058921139
                              type:
                                type: string
                                example: TAX_ID
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        detail:
                          type: string
                          example: Pendente aprovação de representante legal.
                        code:
                          type: string
                          example: btg:enterprise:banking:payments:error:pending-approval
                        arguments:
                          type: object
                          properties:
                            contractId:
                              type: string
                              example: 13287d0e-23c8-4d31-8cc7-989a3aaa6e16
                title: RecurrenceIdGetResponse
      security:
      - oauth2:
        - openid empresas.btgpactual.com/payments.readonly
        - openid empresas.btgpactual.com/payments
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Payments/consultar-recorrencia-de-pagamento
  /{companyId}/banking/payments/approvals/{paymentId}:
    delete:
      tags:
      - Pagamentos
      description: Cancelar pagamento ou transferência pendente de aprovação
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      - name: paymentId
        schema:
          type: string
          example: 29d42888-a920-4a85-a163-aa25b4937b3f
          title: PaymentId
        in: path
        required: true
      - name: x-idempotency-key
        schema:
          type: string
          example: f08jjj6b-00bc-1e3e-ad99-acb353333914
          title: XIdempotencyKey
        in: header
      responses:
        '200':
          description: Cancelamento bem sucedido
      security:
      - oauth2:
        - openid
        - empresas.btgpactual.com/pix-cash-in.readonly
        - empresas.btgpactual.com/authorized-direct-debits.readonly
        - empresas.btgpactual.com/bank-slips
        - empresas.btgpactual.com/bank-slips.readonly
        - openid empresas.btgpactual.com/payments.readonly
        - openid empresas.btgpactual.com/payments
        - empresas.btgpactual.com/accounts.readonly
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Payments/cancelar-pagamento-ou-transferencia-pendente-de-aprovacao
  /{companyId}/banking/payments/{paymentId}:
    delete:
      tags:
      - Pagamentos
      description: Cancelar um pagamento ou transferência agendado
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      - name: paymentId
        schema:
          type: string
          example: 29d42888-a920-4a85-a163-aa25b4937b3f
          title: PaymentId
        in: path
        required: true
      - name: x-idempotency-key
        schema:
          type: string
          example: f08jjj6b-00bc-1e3e-ad99-acb353333914
          title: XIdempotencyKey
        in: header
      responses:
        '204':
          description: Exclusão do agendamento
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - openid empresas.btgpactual.com/payments
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Payments/cancelar-um-pagamento-ou-transferencia-agendado
    get:
      tags:
      - Pagamentos
      description: Listar um pagamento ou transferência específico
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      - name: paymentId
        schema:
          type: string
          example: 29d42888-a920-4a85-a163-aa25b4937b3f
          title: PaymentId
        in: path
        required: true
      - name: x-idempotency-key
        schema:
          type: string
          example: f08jjj6b-00bc-1e3e-ad99-acb353333914
          title: XIdempotencyKey
        in: header
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentId:
                    type: string
                    example: 29d42888-a920-4a85-a163-aa25b4937b3f
                    title: PaymentId
                  type:
                    description: Boleto de cobrança
                    enum:
                    - BANKSLIP
                    - PIX_QR_CODE
                    - UTILITIES
                    - TED
                    - PIX
                    type: string
                    title: Type
                  status:
                    description: Status do pagamento
                    enum:
                    - CONFIRMED
                    - CREATED
                    - CANCELED
                    - FAILED
                    - PROCESSED
                    - ADJOURNED
                    - REVERTED
                    - SCHEDULED
                    type: string
                    example: CREATED
                    title: PaymentStatus
                  amount:
                    type: number
                    example: 0.01
                    title: Money
                  debitParty:
                    type: object
                    properties:
                      taxId:
                        type: string
                        example: '00000000000141'
                      name:
                        type: string
                        example: NOME DA EMPRESA
                      number:
                        type: string
                        example: '000000050'
                      branchCode:
                        type: string
                        example: '50'
                      bankCode:
                        type: string
                        example: '208'
                  detail:
                    type: object
                    properties:
                      digitableLine:
                        description: Linha digitavel
                        type: string
                        example: '20890050091195069626700021179601493360000000001'
                        title: DigitableLine
                      dueDate:
                        format: date
                        type: string
                        example: '2023-05-03'
                        title: Date
                      payee:
                        type: object
                        properties:
                          socialName:
                            type: string
                            example: NOME DA EMPRESA
                          fantasyName:
                            type: string
                            example: NOME DA EMPRESA
                          taxId:
                            type: string
                            example: '00000000000145'
                          bankCode:
                            type: string
                            example: '208'
                        title: Payee
                  tags:
                    type: object
                    properties:
                      externalId:
                        type: string
                        example: 8725b04c-1354-4ad7-91db-4bbb2138e390
                        title: ExternalId
                      originTransactionId:
                        type: string
                        example: 48b33060-7960-4093-bc93-ed9105c3c657
                        title: OriginTransactionId
                  paymentDate:
                    format: date
                    type: string
                    example: '2023-03-20T00:00:00.000Z'
                title: BankSlipPayment
          description: Pagamento
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - openid empresas.btgpactual.com/payments.readonly
        - openid empresas.btgpactual.com/payments
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Payments/listar-um-pagamento-ou-transferencia-especifico
