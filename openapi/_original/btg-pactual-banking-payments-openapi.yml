              type: object
              properties:
                type:
                  type: string
                  description: Tipo do pagamento recorrente a ser criado
                  enum:
                  - PAYMENT
                  - PIX_AUTOMATIC
                periodicity:
                  required:
                  - type
                  - detail
                  type: object
                  properties:
                    type:
                      type: string
                      description: Tipo de periodicidade da recorrência
                      enum:
                      - DAILY
                      - WEEKLY
                      - BIWEEKLY
                      - MONTHLY
                      - ANNUALLY
                      - CUSTOM
                    detail:
                      oneOf:
                      - type: object
                        required:
                        - startDate
                        - quantity
                        properties:
                          startDate:
                            type: string
                            description: Data de início da recorrência
                            example: '2024-10-09'
                          quantity:
                            description: Quantidade de recorrências
                            type: integer
                            example: 10
                      - type: object
                        required:
                        - dates
                        properties:
                          dates:
                            description: Datas específicas para a recorrência
                            type: array
                            items:
                              type: string
                              example: '2024-09-10'
                  title: Periodicity
                basePayment:
                  type: object
                  required:
                  - type
                  - amount
                  - debitParty
                  - detail
                  properties:
                    type:
                      type: string
                      description: Tipo de pagamento a ser realizado recorrentemente
                      enum:
                      - PIX_KEY
                      - PIX_MANUAL
                      - PIX_QR_CODE
                      - TEF
                    amount:
                      description: Valor do pagamento
                      type: number
                    description:
                      description: Descrição do pagamento
                      type: string
                    internalDescription:
                      description: Descrição interna do pagamento
                      type: string
                    debitParty:
                      description: Parte debitada no pagamento
                      type: object
                      required:
                      - taxId
                      - name
                      - account
                      properties:
                        taxId:
                          type: string
                          pattern: ^(\d{11}|\d{14})$
                          description: CNPJ do pagador
                        name:
                          type: string
                          description: Nome do pagador
                        account:
                          description: Conta do pagador
                          type: object
                          required:
                          - type
                          - number
                          - branch
                          - bankCode
                          properties:
                            type:
                              type: string
                              description: Tipo de conta do pagador
                              enum:
                              - CC
                              - PP
                              - CS
                              - CD
                              - CI
                              - CG
                              - CP
                              - PG
                            number:
                              description: Número da conta do pagador
                              type: string
                            branch:
                              description: Agência da conta do pagador
                              type: string
                            bankCode:
                              description: Código do banco do pagador
                              type: string
                              pattern: ^\d{3}$
                            ispb:
                              description: ISPB do banco do pagador
                              type: string
                              example: '30306294'
                      title: RecurrenceParty
                    detail:
                      description: Detalhes do pagamento
                      oneOf:
                      - type: object
                        required:
                        - key
                        properties:
                          key:
                            description: Chave pix do pagamento
                            type: object
                            required:
                            - value
                            properties:
                              value:
                                type: string
                      - type: object
                        required:
                        - emv
                        properties:
                          emv:
                            description: EMV do pix
                            type: string
                      - type: object
                        required:
                        - key
                        - transactionId
                        properties:
                          key:
                            description: Chave pix do pagamento
                            type: object
                            required:
                            - value
                            properties:
                              value:
                                type: string
                          transactionId:
                            description: ID da transação do pagamento
                            type: string
                      - type: object
                        required:
                        - creditParty
                        properties:
                          creditParty:
                            description: Parte creditada no pagamento
                            type: object
                            required:
                            - taxId
                            - name
                            - account
                            properties:
                              taxId:
                                type: string
                                pattern: ^(\d{11}|\d{14})$
                                description: CNPJ do pagador
                              name:
                                type: string
                                description: Nome do pagador
                              account:
                                description: Conta do pagador
                                type: object
                                required:
                                - type
                                - number
                                - branch
                                - bankCode
                                properties:
                                  type:
                                    type: string
                                    description: Tipo de conta do pagador
                                    enum:
                                    - CC
