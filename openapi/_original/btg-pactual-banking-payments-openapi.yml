        - openid empresas.btgpactual.com/payments.readonly
        - openid empresas.btgpactual.com/payments
        - empresas.btgpactual.com/accounts.readonly
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Payments/consulta-por-codigo-de-barras
  /{companyId}/banking/payments-recurrences/periodicities:
    post:
      tags:
      - Pagamentos Recorrentes
      description: ' ## 📘 Ambiente de sandbox

        > Esta API utiliza o [Wiremock](../../starting-doc/Recursos%20para%20Developers%20BTG%20Empresas%20/APIs/sandbox-1/sandbox-com-wiremock-v2)


        > No sandbox este endpoint requer a utilização de [Sandbox Headers](../../starting-doc/Recursos%20para%20Developers%20BTG%20Empresas%20/APIs/sandbox-1/sandbox-headers)


        | Header     | Descrição                            | Valores Aceitos |

        | :--------- | :----------------------------------- | :-------------- |

        | x-response | Controlar o tipo de resposta da API. | success ou error |'
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - paymentType
              - periodicity
              properties:
                paymentType:
                  type: string
                  enum:
                  - PIX_KEY
                  - PIX_MANUAL
                  - PIX_QR_CODE
                  - TEF
                periodicity:
                  required:
                  - type
                  - detail
                  type: object
                  properties:
                    type:
                      type: string
                      description: Tipo de periodicidade da recorrência
                      enum:
                      - DAILY
                      - WEEKLY
                      - BIWEEKLY
                      - MONTHLY
                      - ANNUALLY
                      - CUSTOM
                    detail:
                      oneOf:
                      - type: object
                        required:
                        - startDate
                        - quantity
                        properties:
                          startDate:
                            type: string
                            description: Data de início da recorrência
                            example: '2024-10-09'
                          quantity:
                            description: Quantidade de recorrências
                            type: integer
                            example: 10
                      - type: object
                        required:
                        - dates
                        properties:
                          dates:
                            description: Datas específicas para a recorrência
                            type: array
                            items:
                              type: string
                              example: '2024-09-10'
                  title: Periodicity
              title: RecurringPaymentDatesRequest
        required: true
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - paymentType
                  - periodicity
                  properties:
                    paymentType:
                      type: string
                      enum:
                      - PIX_KEY
                      - PIX_MANUAL
                      - PIX_QR_CODE
                      - TEF
                    periodicity:
                      required:
                      - type
                      - detail
                      type: object
                      properties:
                        type:
                          type: string
                          description: Tipo de periodicidade da recorrência
                          enum:
                          - DAILY
                          - WEEKLY
                          - BIWEEKLY
                          - MONTHLY
                          - ANNUALLY
                          - CUSTOM
                        detail:
                          oneOf:
                          - type: object
                            required:
                            - startDate
                            - quantity
                            properties:
                              startDate:
                                type: string
                                description: Data de início da recorrência
                                example: '2024-10-09'
                              quantity:
                                description: Quantidade de recorrências
                                type: integer
                                example: 10
                          - type: object
                            required:
                            - dates
                            properties:
