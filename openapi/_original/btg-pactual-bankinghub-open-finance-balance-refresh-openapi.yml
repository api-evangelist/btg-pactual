info:
  title: BankingHub - Open Finance Balance Refresh
  version: 1.0.0
  termsOfService: https://www.btgpactual.com/empresas/termos-e-politicas/
  contact:
    name: Time BTG Empresas
    email: ol-it-btgempresas@btgpactual.com
servers:
- url: https://api.uat.empresas.btgpactual.com
  description: uat
- url: https://api.empresas.btgpactual.com
  description: Produção
paths:
  /{taxId}/banking/accounts/{accountId}/balances/refresh:
    get:
      tags:
      - Accounts
      description: Disparar refresh on-demand do saldo Open Finance
      operationId: refreshOpenFinanceBalance
      parameters:
      - name: taxId
        in: path
        required: true
        description: CNPJ (somente dígitos) da empresa titular da conta.
        schema:
          type: string
          example: '30306294000145'
      - name: accountId
        in: path
        required: true
        description: Identificador composto da conta, no formato `{taxId}-{bankCode}-{agency}-{accountNumber}`. Os componentes `bankCode`, `agency` e `accountNumber` são extraídos deste identificador e enviados ao upstream como parâmetros de consulta.
        schema:
          type: string
          example: 30306294000145-208-50-1234567
      responses:
        '202':
          description: Solicitação de refresh aceita. Corpo vazio — o refresh é processado de forma assíncrona.
        '400':
          description: '`accountId` em formato inválido (esperado `{taxId}-{bankCode}-{agency}-{accountNumber}`), ou requisição rejeitada pelo serviço upstream. O corpo do erro, quando presente, é repassado do upstream sem alteração.'
        '401':
          description: Não autorizado — token ausente, inválido ou expirado.
        '403':
          description: Acesso negado — `taxId`/`accountId` ausentes no path ou identidade sem permissão sobre a conta.
        '429':
          description: Limite de requisições excedido (6 requisições a cada 12 horas por identidade autenticada).
        '500':
          description: Erro no serviço upstream. Status e corpo repassados do upstream sem alteração.
      security:
      - oauth2:
        - brn:btg:empresas:openfinance:accounts:balances.readonly
        - brn:btg:empresas:openfinance:accounts:info.readonly
        - empresas.btgpactual.com/accounts.readonly
        - empresas.btgpactual.com/accounts
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/BankingHub%20-%20Open%20Finance%20Balance%20Refresh/refresh-open-finance-balance
