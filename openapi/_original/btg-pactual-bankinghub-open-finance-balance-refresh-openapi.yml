          description: Erro no serviço upstream. Status e corpo repassados do upstream sem alteração.
      security:
      - oauth2:
        - brn:btg:empresas:openfinance:accounts:balances.readonly
        - brn:btg:empresas:openfinance:accounts:info.readonly
