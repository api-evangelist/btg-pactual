                          nullable: true
                          example: '2023-06-10'
                          description: Data de pagamento da fatura do cartão de crédito
                        dueDate:
                          type: string
                          nullable: true
                          example: '2023-06-05'
                          description: Data de vencimento da fatura do cartão de crédito
