                                            - Mensalidade do cartão de crédito
                                            - Transações não mapeadas
                                            - Total da fatura anterior
                                            - Total de pagamentos feitos pelo cliente
                                            - Benefício IOF Especial
                                            - Benefício LoungeKey
                                            - Créditos recebidos
