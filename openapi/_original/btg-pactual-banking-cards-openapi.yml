        | Header     | Descrição                            | Valores Aceitos |

        | :--------- | :----------------------------------- | :-------------- |

        | x-response | Controlar o tipo de resposta da API. | success ou error |'
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
        description: CNPJ da empresa
        example: '30306294000145'
      - name: cursor
        in: query
        schema:
          type: string
          nullable: true
        description: Cursor para paginação dos resultados
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
          nullable: true
        example: '12345'
        description: Identificador único da fatura do cartão de crédito
      - name: itemsPerPage
        in: query
        schema:
          type: integer
          format: int32
          nullable: true
        example: 50
        description: Número de itens por página
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          nullable: true
        example: 1
        description: Número da página
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          example: 1234567890
                          description: Identificador único da transação do cartão de crédito
                        installment:
                          type: integer
                          format: int64
                          example: 1
                          description: Parcela atual da transação do cartão de crédito
                        numberOfInstallments:
                          type: integer
                          format: int64
                          example: 3
                          description: Número total de parcelas da transação do cartão de crédito
                        softDescriptor:
                          type: string
                          nullable: true
                          example: PARCELADO BOLETO
                          description: Descrição reduzida da transação do cartão de crédito
                        processingCode:
                          type: string
                          nullable: true
                          example: '000000'
                          description: Código de processamento da transação do cartão de crédito
                        processingDescription:
                          type: string
                          nullable: true
                          example: PARCELADO BOLETO
                          description: Descrição do processamento da transação do cartão de crédito
                        customerId:
                          type: integer
                          format: int64
                          example: 56789
                          description: Identificador do cliente associado à transação do cartão de crédito
