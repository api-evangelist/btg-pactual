                        minimumPayment:
                          type: number
                          format: double
                          example: 150
                          description: Pagamento mínimo da fatura do cartão de crédito
                        partialPayment:
                          type: number
                          format: double
                          example: 300
                          description: Pagamento parcial da fatura do cartão de crédito
                        installmentConditions:
                          type: object
                          properties:
                            fixed:
                              type: boolean
                            variable:
                              type: boolean
                            isInstallmentPendingPaymentEntry:
                              type: boolean
                            variableMinimumEntryAmount:
                              type: number
                              format: double
                              nullable: true
                            variableMaximumEntryAmount:
                              type: number
                              format: double
                              nullable: true
                          additionalProperties: false
                          title: InstallmentConditions
                        availablePaymentMethods:
                          type: array
                          items:
                            type: string
                            description: Método de pagamento disponível
                            example: BANKSLIP
                          nullable: true
                      additionalProperties: false
                      title: ListInvoiceDetailsResponseData
                    nullable: true
                additionalProperties: false
                title: ListInvoiceDetailsResponseV2
