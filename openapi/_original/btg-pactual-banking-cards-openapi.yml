                                            description: Título do item da fatura
                                            nullable: true
                                          code:
                                            type: string
                                            enum:
                                            - ITEM_ON_CASH_AMOUNT
                                            - ITEM_INSTALLMENT_AMOUNT
                                            - ITEM_MONTHLY
                                            - ITEM_OTHER
                                            - ITEM_PREVIOUS_INVOICE
                                            - ITEM_PAYMENTS
                                            - ITEM_CREDITS_SPECIAL_IOF
                                            - ITEM_CREDITS_LOUNGE_KEY
                                            - ITEM_REVERSAL
                                            nullable: true
                                          amount:
                                            type: number
                                            format: double
                                            example: 500
                                            description: Valor do item da fatura
                                        additionalProperties: false
                                        title: InvoiceItem
                                      nullable: true
                                  additionalProperties: false
                                  title: InvoiceCategory
                                nullable: true
                            additionalProperties: false
                            title: Summary
                          nullable: true
                        paymentDate:
