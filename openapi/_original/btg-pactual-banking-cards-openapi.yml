                        invoiceId:
                          type: integer
                          format: int32
                          example: 12345
                          description: Identificador único da fatura do cartão de crédito
                        month:
                          type: integer
                          format: int32
                          example: 5
                          description: Mês da fatura do cartão de crédito
                        year:
                          type: integer
                          format: int32
                          example: 2023
                          description: Ano da fatura do cartão de crédito
                        totalBalance:
                          type: number
                          format: double
                          example: 1500.75
                          description: Valor total da fatura do cartão de crédito
                        remainingBalance:
                          type: number
                          format: double
                          example: 500.25
                          description: Valor restante a pagar da fatura do cartão de crédito
                        paidBalance:
                          type: number
                          format: double
                          example: 1000.5
                          description: Valor já pago da fatura do cartão de crédito
                        previousBalance:
                          type: number
                          format: double
                          example: 2000
                          description: Valor da fatura anterior do cartão de crédito
                        minimumPayment:
                          type: number
                          format: double
                          example: 150
                          description: Pagamento mínimo da fatura do cartão de crédito
                        cycleStatus:
                          type: string
                          nullable: true
                          example: OPEN
                          description: Status do ciclo da fatura do cartão de crédito
                        realDueDate:
                          type: string
                          nullable: true
                          example: '2023-06-10'
                          description: Data real de vencimento da fatura do cartão de crédito
                        cycleClosingDate:
                          type: string
                          nullable: true
                          example: '2023-05-30'
                          description: Data de fechamento do ciclo da fatura do cartão de crédito
                        cycleOpeningDate:
                          type: string
                          nullable: true
                          example: '2023-05-01'
                          description: Data de abertura do ciclo da fatura do cartão de crédito
                        isCurrent:
                          type: boolean
                          example: true
                          description: Indica se a fatura é a atual
                        dueDate:
                          type: string
                          nullable: true
                          example: '2023-06-05'
                          description: Data de vencimento da fatura do cartão de crédito
                        bestTransactionDay:
                          type: string
                          nullable: true
                          example: '2023-05-15'
                          description: Melhor dia de compra
                        canPay:
                          type: boolean
                          example: true
                          description: Indica se a fatura pode ser paga
                        debits:
                          type: number
                          format: double
                          example: 2000
                          description: Valor total de débitos da fatura do cartão de crédito
                        credits:
                          type: number
                          format: double
                          example: 500.25
                          description: Valor total de créditos da fatura do cartão de crédito
                      additionalProperties: false
                      title: Invoice
                    nullable: true
                additionalProperties: false
                title: CardInvoicesResponseV2
      security:
      - read:
        - brn:btg:empresas:credit-cards:invoices
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Cards/listar-faturas-de-cartao-de-credito
