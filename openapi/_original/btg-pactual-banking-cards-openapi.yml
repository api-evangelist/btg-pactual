openapi: 3.0.3
info:
  title: Banking - Cards
  description: API de Cartão de Crédito
  contact: {}
  version: '1.0'
servers:
- url: https://api.sandbox.empresas.btgpactual.com
  description: Sandbox
- url: https://api.empresas.btgpactual.com
  description: Produção
paths:
  /{companyId}/banking/cards:
    get:
      tags:
      - Cartões
      description: ' ## 📘 Ambiente de sandbox

        > Esta API utiliza o [Wiremock](../../starting-doc/Recursos%20para%20Developers%20BTG%20Empresas%20/APIs/sandbox-1/sandbox-com-wiremock-v2)


        > No sandbox este endpoint requer a utilização de [Sandbox Headers](../../starting-doc/Recursos%20para%20Developers%20BTG%20Empresas%20/APIs/sandbox-1/sandbox-headers)


        | Header     | Descrição                            | Valores Aceitos |

        | :--------- | :----------------------------------- | :-------------- |

        | x-response | Controlar o tipo de resposta da API. | success ou error |'
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
        description: CNPJ da empresa
        example: '30306294000145'
      - name: itemsPerPage
        in: query
        schema:
          type: integer
          format: int32
          nullable: true
        description: Número de itens por página
        example: 50
      - name: cursor
        in: query
        schema:
          type: string
          nullable: true
        description: Cursor para paginação dos resultados
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          nullable: true
        example: 1
        description: Número da página
      - name: ownerDocument
        in: query
        schema:
          type: string
          nullable: true
        description: CPF ou CNPJ do dono do cartão
        example: '11111111111'
      - name: status
        in: query
        schema:
          type: string
          nullable: true
        description: Status do cartão
        example: REQUESTED
      - name: last4Digits
        in: query
        schema:
          type: string
          nullable: true
        example: '1234'
        description: Últimos 4 dígitos do cartão
      - name: isContactlessEnabled
        in: query
        schema:
          type: boolean
          nullable: true
        description: Indica se o cartão tem aproximação habilitada
        example: true
      - name: isTravelNoticeEnabled
        in: query
        schema:
          type: boolean
          nullable: true
        example: false
        description: Indica se o aviso de viagem está habilitado
      - name: isOnlineShoppingEnabled
        in: query
        schema:
          type: boolean
          nullable: true
        example: true
        description: Indica se compras online estão habilitadas
      - name: isWithdrawalEnabled
        in: query
        schema:
          type: boolean
          nullable: true
        example: false
        description: Indica se saques estão habilitados
      - name: printedName
        in: query
        schema:
          type: string
          nullable: true
        example: JOAO DA SILVA
        description: Nome impresso no cartão
      - name: order
        in: query
        schema:
          type: string
          nullable: true
        description: Ordem de exibição dos resultados
      - name: sortBy
        in: query
        schema:
          type: string
          nullable: true
        description: Campo para ordenação dos resultados
      - name: limitOperator
        in: query
        schema:
          type: string
          nullable: true
        description: Operador para filtro de limite do cartão
      - name: limitAmount
        in: query
        schema:
          type: string
          nullable: true
        description: Valor para filtro de limite do cartão
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        cardId:
                          type: string
                          example: f47d235c-17de-4e4b-87eb-a60208acf11f
                          description: Identificador único do cartão
                          nullable: true
                        last4Digits:
                          type: string
                          example: '1234'
                          description: Últimos 4 dígitos do cartão
                          nullable: true
                        status:
                          type: string
                          enum:
                          - CREATED
                          - REQUESTED
                          example: REQUESTED
                          description: Status do cartão
                          nullable: true
                        printedName:
                          type: string
                          example: JOAO DA SILVA
                          description: Nome impresso no cartão
                          nullable: true
                        modality:
                          type: string
                          enum:
                          - CREDIT
                          - DEBIT
                          example: DEBIT
                          description: Modalidade do cartão
                          nullable: true
                        variant:
                          type: string
                          example: GOLD
                          description: Variante do cartão
                          nullable: true
                        activatedAt:
                          type: string
                          example: '2023-01-15'
                          description: Data de ativação do cartão
                          nullable: true
                        type:
                          type: string
                          example: PHYSICAL
                          description: Tipo do cartão
                          nullable: true
                        owner:
                          type: object
                          properties:
                            document:
                              type: string
                              example: '11111111111'
                              description: CPF or CNPJ do dono do cartão
                              nullable: true
                            name:
                              type: string
                              example: JOAO DA SILVA
                              description: Nome do dono do cartão
                              nullable: true
                            birthDate:
                              type: string
                              example: '1980-01-01'
                              description: Data de nascimento do dono do cartão
                              nullable: true
                            phone:
                              type: string
                              example: '+5511999999999'
                              description: Telefone do dono do cartão
                              nullable: true
                          additionalProperties: false
                          title: CardOwnerItem
                        debitAccount:
                          type: object
                          properties:
                            branch:
                              type: string
                              example: '50'
                              description: Agência da conta débito vinculada ao cartão
                              nullable: true
                            number:
                              type: string
                              example: 12345-6
                              description: Número da conta débito vinculada ao cartão
                              nullable: true
                          additionalProperties: false
                          title: DebitAccountItem
                      additionalProperties: false
                      title: CardItem
                    nullable: true
                  _links:
                    type: object
                    properties:
                      next:
                        type: string
                        nullable: true
                      previous:
                        type: string
                        nullable: true
                    additionalProperties: false
                    title: Links
                additionalProperties: false
                title: GetCardsByAccountAndFiltersResponseV2
      security:
      - read:
        - brn:btg:empresas:credit-cards:invoices
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Cards/listar-cartoes
  /{companyId}/banking/cards/invoices:
    get:
      tags:
      - Faturas
      description: ' ## 📘 Ambiente de sandbox

        > Esta API utiliza o [Wiremock](../../starting-doc/Recursos%20para%20Developers%20BTG%20Empresas%20/APIs/sandbox-1/sandbox-com-wiremock-v2)


        > No sandbox este endpoint requer a utilização de [Sandbox Headers](../../starting-doc/Recursos%20para%20Developers%20BTG%20Empresas%20/APIs/sandbox-1/sandbox-headers)


        | Header     | Descrição                            | Valores Aceitos |

        | :--------- | :----------------------------------- | :-------------- |

        | x-response | Controlar o tipo de resposta da API. | success ou error |'
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
        description: CNPJ da empresa
        example: '30306294000145'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        creditAccountId:
                          type: integer
                          format: int32
                          example: 98765
