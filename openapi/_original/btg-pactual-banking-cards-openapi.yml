                                example: INTEREST
                              value:
                                type: number
                                format: double
                                example: 15
                          nullable: true
                        eventDate:
                          type: string
                          format: date-time
                          example: '2023-05-20T14:30:00'
                          description: Data e hora do evento da transação do cartão de crédito
                        createdAt:
                          type: string
                          format: date-time
                          example: '2023-05-20T14:35:00'
                          description: Data e hora de criação da transação do cartão de crédito
                        transactionType:
                          type: object
                          properties:
                            id:
                              type: integer
                              format: int64
                              example: 1234
                              description: Identificador do tipo de transação do cartão de crédito
                            description:
                              type: string
                              nullable: true
                              example: Compra à vista
                              description: Descrição do tipo de transação do cartão de crédito
                            isCredit:
                              type: boolean
                              example: false
                              description: Indica se a transação é de crédito
                            postedTransaction:
                              type: boolean
                              example: true
                              description: Indica se a transação foi lançada
                          additionalProperties: false
                          title: TransactionType
                        amount:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                enum:
                                - PRINCIPAL
                                - SETTLEMENT
                                - LOCAL
                                example: PRINCIPAL
                                description: Tipo do valor da transação do cartão de crédito
                                nullable: true
                              currency:
                                type: string
                                example: BRL
                                description: Moeda do valor da transação do cartão de crédito
                                nullable: true
                              value:
                                type: number
                                format: double
                                example: 250.75
                                description: Valor
                              rate:
                                type: number
                                format: double
                                example: 1
                                description: Taxa de câmbio aplicada na transação do cartão de crédito
                                nullable: true
                            additionalProperties: false
                            title: TransactionAmount
                          nullable: true
                        merchant:
                          type: object
                          properties:
                            type:
                              type: string
                              description: Tipo do comerciante
                              example: NETWORK
                              nullable: true
                            name:
                              type: string
                              description: Nome do comerciante
                              example: Google
                              nullable: true
                            city:
                              type: string
                              description: Cidade do comerciante
                              example: SAO PAULO
                              nullable: true
                            state:
                              type: string
                              description: Localização da cidade do comerciante
                              example: BR
                              nullable: true
                            imageUrl:
                              type: string
                              example: https://example.com/example.png
                              nullable: true
                            category:
                              type: object
                              properties:
                                code:
                                  type: string
