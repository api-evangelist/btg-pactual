        | :--------- | :----------------------------------- | :--------------- |

        | x-response | Controlar o tipo de resposta da API. | success ou error |'
      operationId: cancelProtest
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
        description: CNPJ da empresa
        example: '30306294000145'
      - name: id
        in: path
        required: true
        description: Identificador UUID do protesto
        schema:
