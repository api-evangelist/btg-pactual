paths:
  /credenciadoras/antecipacao:
    post:
      tags:
      - Subcredenciadoras
      description: Realiza a antecipação de recebíveis de subcredenciadoras
      operationId: createReceivablesAnticipation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - recebiveis
              - conta
              properties:
                recebiveis:
                  type: array
                  description: Lista de recebíveis a serem antecipados
                  items:
                    type: object
                    required:
                    - valorVencimento
                    - sacadoCnpj
                    - bandeira
                    - dataVencimento
                    properties:
                      valorVencimento:
                        type: number
                        format: double
                        description: Valor de vencimento do recebível
                        example: 1000
                      sacadoCnpj:
                        type: string
                        description: CNPJ do sacado (credenciadora)
                        pattern: ^\d{14}$
                        example: '12345678000100'
                      sacadoNome:
                        type: string
                        description: Nome do sacado (credenciadora)
                        example: Empresa Sacado LTDA
                      bandeira:
                        type: string
                        description: Bandeira do cartão de crédito
                        enum:
                        - Visa
                        - Mastercard
                        - Elo
                        - Amex
                        - Hipercard
                        example: Visa
                      dataVencimento:
                        type: string
                        format: date
                        description: Data de vencimento do recebível no formato ISO-8601 (yyyy-MM-dd)
                        example: '2026-06-01'
                      dataDesembolso:
                        type: string
                        format: date
                        description: Data de desembolso no formato ISO-8601 (yyyy-MM-dd)
                        example: '2026-04-20'
                      idExterno:
                        type: string
                        description: Identificador externo do recebível
                        example: ext-001
                      cedenteCnpj:
                        type: string
                        description: CNPJ do cedente (estabelecimento comercial)
                        pattern: ^\d{14}$
                        example: '98765432000100'
                      cedenteNome:
                        type: string
                        description: Nome do cedente (estabelecimento comercial)
                        example: Empresa Cedente LTDA
                    title: ReceivableRequest
                conta:
                  type: object
                  required:
                  - codigoBanco
                  - agencia
                  - numeroConta
                  - digitoConta
                  properties:
                    codigoBanco:
                      type: string
                      description: Código do banco
                      example: '208'
                    agencia:
                      type: string
                      description: Número da agência
                      example: '1'
                    numeroConta:
                      type: string
                      description: Número da conta
                      example: '12345'
                    digitoConta:
                      type: string
                      description: Dígito verificador da conta
                      example: '6'
                  title: ContaBancaria
              title: OperationRequest
            example:
              recebiveis:
              - valorVencimento: 1000
                sacadoCnpj: '12345678000100'
                sacadoNome: Empresa Sacado LTDA
                bandeira: Visa
                dataVencimento: '2026-06-01'
                dataDesembolso: '2026-04-20'
                idExterno: ext-001
                cedenteCnpj: '98765432000100'
                cedenteNome: Empresa Cedente LTDA
              conta:
                codigoBanco: '208'
                agencia: '1'
                numeroConta: '12345'
                digitoConta: '6'
      responses:
        '200':
          description: Antecipação realizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  recebiveis:
                    type: array
                    description: Lista de recebíveis com suas respectivas cotações
                    items:
                      type: object
                      properties:
                        cotacao:
                          type: number
                          format: double
                          description: Valor da cotação (valor de desembolso)
                          example: 950
                          nullable: true
                        erro:
                          type: string
                          description: Mensagem de erro caso a cotação não seja possível
                          example: null
                          nullable: true
                        recebivel:
                          type: object
                          required:
                          - valorVencimento
                          - sacadoCnpj
                          - bandeira
                          - dataVencimento
                          properties:
                            valorVencimento:
                              type: number
                              format: double
                              description: Valor de vencimento do recebível
                              example: 1000
                            sacadoCnpj:
                              type: string
                              description: CNPJ do sacado (credenciadora)
                              pattern: ^\d{14}$
                              example: '12345678000100'
                            sacadoNome:
                              type: string
                              description: Nome do sacado (credenciadora)
                              example: Empresa Sacado LTDA
                            bandeira:
                              type: string
                              description: Bandeira do cartão de crédito
                              enum:
                              - Visa
                              - Mastercard
                              - Elo
                              - Amex
                              - Hipercard
                              example: Visa
                            dataVencimento:
                              type: string
                              format: date
                              description: Data de vencimento do recebível no formato ISO-8601 (yyyy-MM-dd)
                              example: '2026-06-01'
                            dataDesembolso:
                              type: string
                              format: date
                              description: Data de desembolso no formato ISO-8601 (yyyy-MM-dd)
                              example: '2026-04-20'
                            idExterno:
                              type: string
                              description: Identificador externo do recebível
                              example: ext-001
                            cedenteCnpj:
                              type: string
                              description: CNPJ do cedente (estabelecimento comercial)
                              pattern: ^\d{14}$
                              example: '98765432000100'
                            cedenteNome:
                              type: string
                              description: Nome do cedente (estabelecimento comercial)
                              example: Empresa Cedente LTDA
                          title: ReceivableRequest
                        trackingId:
                          type: string
                          description: Identificador de rastreamento da cotação
                          example: abc-123-def-456
                        taxaMensal:
                          type: number
                          format: double
                          description: Taxa mensal aplicada
                          example: 1.5
                        taxaTotal:
                          type: number
                          format: double
                          description: Taxa total aplicada
                          example: 3
                        tier:
                          type: string
                          description: Tier do cliente
                          example: TIER_A
                        tierId:
                          type: integer
                          format: int64
                          description: Identificador do tier
                          example: 1
                      title: ReceivableResult
                  conta:
                    type: object
                    required:
                    - codigoBanco
                    - agencia
                    - numeroConta
                    - digitoConta
                    properties:
                      codigoBanco:
                        type: string
                        description: Código do banco
                        example: '208'
                      agencia:
                        type: string
                        description: Número da agência
                        example: '1'
                      numeroConta:
                        type: string
                        description: Número da conta
                        example: '12345'
                      digitoConta:
                        type: string
                        description: Dígito verificador da conta
                        example: '6'
                    title: ContaBancaria
                  erro:
                    type: string
                    description: Mensagem de erro caso a operação não seja possível
                    example: null
                    nullable: true
                title: OperationResult
              example:
                recebiveis:
                - cotacao: 950
                  erro: null
                  recebivel:
                    valorVencimento: 1000
                    sacadoCnpj: '12345678000100'
                    sacadoNome: Empresa Sacado LTDA
                    bandeira: Visa
                    dataVencimento: '2026-06-01'
                    dataDesembolso: '2026-04-20'
                    idExterno: ext-001
                    cedenteCnpj: '98765432000100'
                    cedenteNome: Empresa Cedente LTDA
                  trackingId: abc-123-def-456
                  taxaMensal: 1.5
                  taxaTotal: 3
                  tier: TIER_A
                  tierId: 1
                conta:
                  codigoBanco: '208'
                  agencia: '1'
                  numeroConta: '12345'
                  digitoConta: '6'
                erro: null
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    description: Lista de erros de validação
                    items:
                      type: object
                      properties:
                        field:
