  /credenciadoras/recebiveis:
    get:
      tags:
      - Subcredenciadoras
      description: 'Retorna a lista de recebíveis de cartão de crédito disponíveis para antecipação do cedente autenticado, filtrados pelo CNPJ do sacado (credenciadora). O cedente é identificado automaticamente a partir do token de autenticação.

        '
      operationId: getCreditCardReceivablesCedente
      parameters:
      - name: sacadoCnpj
        in: query
        required: true
        description: CNPJ do sacado (credenciadora) no formato de 14 dígitos numéricos
        schema:
          type: string
          pattern: ^\d{14}$
          example: '12345678000100'
      - name: $filter
        in: query
        required: false
        description: Filtro OData para refinar os resultados
        schema:
          type: string
          example: maturityDate ge 2026-06-01
      - name: $orderby
        in: query
        required: false
        description: Ordenação OData dos resultados
        schema:
          type: string
          example: maturityDate asc
      - name: $top
        in: query
        required: false
        description: Número máximo de registros a retornar (OData)
        schema:
          type: integer
          example: 50
      - name: $skip
        in: query
        required: false
        description: Número de registros a ignorar para paginação (OData)
        schema:
          type: integer
          example: 0
      responses:
        '200':
          description: Lista de recebíveis de cartão disponíveis para o cedente
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Representa um recebível de cartão de crédito disponível para antecipação pelo cedente
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Identificador único do recebível
                      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    valorVencimento:
                      type: number
                      format: double
                      description: Valor de face do recebível no vencimento
                      example: 1000
                    valorAntecipado:
                      type: number
                      format: double
                      description: Valor líquido caso o recebível seja antecipado
                      example: 950
                      nullable: true
                    sacadoCnpj:
                      type: string
                      description: CNPJ do sacado (credenciadora)
                      pattern: ^\d{14}$
                      example: '12345678000100'
                    sacadoNome:
                      type: string
                      description: Nome do sacado (credenciadora)
                      example: Empresa Sacado LTDA
                    cedenteCnpj:
                      type: string
                      description: CNPJ do cedente (estabelecimento comercial)
                      pattern: ^\d{14}$
                      example: '98765432000100'
                    cedenteNome:
                      type: string
                      description: Nome do cedente (estabelecimento comercial)
                      example: Empresa Cedente LTDA
                    bandeira:
                      type: string
                      description: Bandeira do cartão de crédito
                      enum:
                      - Visa
                      - Mastercard
                      - Elo
                      - Amex
                      - Hipercard
                      example: Visa
                    dataVencimento:
                      type: string
                      format: date
                      description: Data de vencimento do recebível no formato ISO-8601 (yyyy-MM-dd)
                      example: '2026-06-01'
                    dataDesembolso:
                      type: string
                      format: date
                      description: Data prevista de desembolso no formato ISO-8601 (yyyy-MM-dd)
                      example: '2026-04-20'
                      nullable: true
                    tipoProduto:
                      type: string
                      description: Tipo do produto financeiro
                      enum:
                      - Cartao
                      example: Cartao
                  title: ReceivableCedenteDto
              example:
              - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                valorVencimento: 1000
                valorAntecipado: 950
                sacadoCnpj: '12345678000100'
                sacadoNome: Empresa Sacado LTDA
                cedenteCnpj: '98765432000100'
                cedenteNome: Empresa Cedente LTDA
                bandeira: Visa
                dataVencimento: '2026-06-01'
                dataDesembolso: '2026-04-20'
                tipoProduto: Cartao
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    description: Lista de erros de validação
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          description: Campo que contém o erro
                          example: sacadoCnpj
                        message:
                          type: string
                          description: Mensagem de erro
                          example: CNPJ inválido
                title: ValidationError
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: 'Recurso não encontrado. Pode ocorrer quando: - O cedente (empresa do token autenticado) não é encontrado pelo CNPJ. - O sacado informado via sacadoCnpj não está vinculado ao cedente.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Mensagem descritiva do recurso não encontrado
                    example: Cedente não encontrado. Verifique o CNPJ.
                title: NotFoundError
              examples:
                cedente_nao_encontrado:
                  summary: Cedente não encontrado
                  value:
                    message: Cedente não encontrado. Verifique o CNPJ.
                sacado_nao_encontrado:
                  summary: Sacado não encontrado
                  value:
                    message: Sacado não encontrado. Verifique o CNPJ.
      security:
      - write:
        - qf:Receivables.Get
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/ANTECRED-Subcredenciadores/get-credit-card-receivables-cedente
