        **Nota:** A listagem aplica filtro implícito por janela de tempo. Pagamentos fora da janela padrão podem não aparecer mesmo após liquidação. Use `startDate` e `endDate` para ampliar o período de busca.


        ## 📘 Ambiente de sandbox

        > Esta API utiliza o [Wiremock](../../starting-doc/Recursos%20para%20Developers%20BTG%20Empresas%20/APIs/sandbox-1/sandbox-com-wiremock-v2)


        > No sandbox este endpoint requer a utilização de [Sandbox Headers](../../starting-doc/Recursos%20para%20Developers%20BTG%20Empresas%20/APIs/sandbox-1/sandbox-headers)


        | Header     | Descrição                            | Valores Aceitos |

        | :--------- | :----------------------------------- | :-------------- |

        | x-response | Controlar o tipo de resposta da API. | success ou error |'
      operationId: listPayments
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
      - name: companyTaxIds
        in: query
        description: CNPJs das empresas (14 dígitos, sem formatação). Aceita múltiplos valores.
        schema:
          type: array
          items:
            type: string
      - name: pageSize
        in: query
        description: Quantidade de itens por página (default 20, máximo 50)
        schema:
          type: integer
          format: int32
          default: 20
      - name: cursor
        in: query
        description: Token opaco de cursor para paginação. Ausente na primeira requisição. Extrair de _links.next.href. Não construir manualmente.
        schema:
          type: string
      - name: startDate
        in: query
        description: Data de início do filtro (YYYY-MM-DD)
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: Data de fim do filtro (YYYY-MM-DD)
        schema:
          type: string
          format: date-time
