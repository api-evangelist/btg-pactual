  /{companyId}/banking/payroll/payments/{paymentId}:
    get:
      tags:
      - Pagamentos
      description: 'Retorna o detalhe completo de um lote de pagamento, incluindo status individual de cada item.


        **Estados terminais:** `settled` · `failed` · `cancelled`


        ## 📘 Ambiente de sandbox

        > Esta API utiliza o [Wiremock](../../starting-doc/Recursos%20para%20Developers%20BTG%20Empresas%20/APIs/sandbox-1/sandbox-com-wiremock-v2)


        > No sandbox este endpoint requer a utilização de [Sandbox Headers](../../starting-doc/Recursos%20para%20Developers%20BTG%20Empresas%20/APIs/sandbox-1/sandbox-headers)


        | Header     | Descrição                            | Valores Aceitos |

        | :--------- | :----------------------------------- | :-------------- |

        | x-response | Controlar o tipo de resposta da API. | success ou error |'
      operationId: getPaymentBatch
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
      - name: paymentId
        in: path
        description: Identificador único do lote de pagamento
        required: true
        schema:
          type: integer
          format: int32
      - name: companyTaxIds
        in: query
        description: CNPJs das empresas (14 dígitos, sem formatação). Aceita múltiplos valores.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
                properties:
                  paymentId:
                    type: integer
                    format: int32
                  description:
                    type: string
                    nullable: true
                  status:
                    type: string
                    nullable: true
                  debitParty:
                    type: object
                    properties:
                      branchCode:
                        type: string
                        nullable: true
                      number:
                        type: string
                        nullable: true
                    additionalProperties: false
                    title: PayrollBatchDetailDebitPartyDto
                  submittedAt:
                    type: string
                    format: date-time
                    nullable: true
                  approvedAt:
                    type: string
                    format: date-time
                    nullable: true
                  settledAt:
                    type: string
                    format: date-time
                    nullable: true
                  cancelledAt:
                    type: string
                    format: date-time
                    nullable: true
                  scheduledDate:
                    type: string
                    format: date-time
                    nullable: true
                  totalEmployees:
                    type: integer
                    format: int32
