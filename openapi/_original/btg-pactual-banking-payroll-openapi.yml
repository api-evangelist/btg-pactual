  /{companyId}/banking/payroll/employees/{employeeTaxId}/account:
    get:
      tags:
      - Colaboradores
      description: 'Retorna o estado da conta bancária de um colaborador identificado pelo CPF.


        **Parâmetro `bank`:**


        | Valor | Comportamento |

        |---|---|

        | `BTG` (padrão) | Consulta a conta BTG do colaborador |

        | `PAN` | Fallback para colaboradores sem conta BTG ativa |


        Se a requisição sem `bank` retornar `404`, tente com `?bank=PAN`. Colaboradores no início do onboarding podem ainda não ter conta BTG ativa.


        ## 📘 Ambiente de sandbox

        > Esta API utiliza o [Wiremock](../../starting-doc/Recursos%20para%20Developers%20BTG%20Empresas%20/APIs/sandbox-1/sandbox-com-wiremock-v2)


