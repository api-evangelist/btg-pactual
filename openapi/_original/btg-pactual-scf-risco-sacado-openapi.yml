openapi: 3.0.3
info:
  title: SCF - Risco Sacado
  description: Esta API tem a finalidade de contratar Antecipações de Recebíveis. Para autenticação é necessário a utilização do fluxo de client credentials para autenticação na documentação da API. `AUTENTICAÇÃO -> Fluxos de Autenticação -> Client Credentials`
  version: 1.4.1
  contact:
    name: Time BTG Empresas
    email: ol-it-btgempresas@btgpactual.com
servers:
- url: https://api.sandbox.empresas.btgpactual.com/v1/scf
  description: SANDBOX URL
- url: https://api.empresas.btgpactual.com/v1/scf
  description: PROD URL
paths:
  /companies/commercial-strategies:
    post:
      tags:
      - Company
      - Commercial strategy
      description: Associação de lote de empresas a uma estratégia comercial.
      operationId: addCompaniesToCommercialStrategyRequest
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - companies
              - strategyUuid
              properties:
                companies:
                  type: array
                  items:
                    type: object
                    required:
                    - taxId
                    properties:
                      taxId:
                        type: string
                      name:
                        type: string
                    title: CompanyNameTaxIdDto
                strategyUuid:
                  type: string
      responses:
        '200':
          description: Define se houve sucesso ou erro ao executar o fluxo
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        errorMessage:
                          type: string
                          description: Erro ocorrido
                        errorCode:
                          type: string
                          enum:
                          - CACSQF0001
                          - CACSQF0002
                          - CACSQF0003
                          - CACSQF0004
                          - CACSQF0005
                          - CACSQF0006
                          - CACSQF0007
                          - CACSQF0008
                          - CACSQF0009
                          description: '___

                            Errors:

                            * CACSQF0001 - Commercial strategy UUID must be provided.

                            * CACSQF0002 - Commercial strategy not found.

                            * CACSQF0003 - Incomplete commercial strategy.

                            * CACSQF0004 - At least one company must be provided.

                            * CACSQF0005 - Company TaxId must be provided.

                            * CACSQF0006 - Can''t add company without name.

                            * CACSQF0007 - Company with id {companyId} had error on associate with commercial strategy {strategyUuid}.

                            * CACSQF0008 - Error on creating counterparties.

                            '
                        propertyName:
                          type: string
                          description: Propriedade que houve erro.
                title: ValidationResultSchema
        '400':
          description: Define se houve sucesso ou erro ao executar o fluxo
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        errorMessage:
                          type: string
                          description: Erro ocorrido
                        errorCode:
                          type: string
                          enum:
                          - CACSQF0001
                          - CACSQF0002
                          - CACSQF0003
                          - CACSQF0004
                          - CACSQF0005
                          - CACSQF0006
                          - CACSQF0007
                          - CACSQF0008
                          - CACSQF0009
                          description: '___

                            Errors:

                            * CACSQF0001 - Commercial strategy UUID must be provided.

                            * CACSQF0002 - Commercial strategy not found.

                            * CACSQF0003 - Incomplete commercial strategy.

                            * CACSQF0004 - At least one company must be provided.

                            * CACSQF0005 - Company TaxId must be provided.

                            * CACSQF0006 - Can''t add company without name.

                            * CACSQF0007 - Company with id {companyId} had error on associate with commercial strategy {strategyUuid}.

                            * CACSQF0008 - Error on creating counterparties.

                            '
                        propertyName:
                          type: string
                          description: Propriedade que houve erro.
                title: ValidationResultSchema
        '401':
          description: Não autorizado
      security:
      - oauth2:
        - empresas.btgpactual.com/scf/companies
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/SCF%20-%20Risco%20Sacado/add-companies-to-commercial-strategy-request
  /borderos/{trackingId}/receivables-cancellation:
    post:
      tags:
      - Bordero
      description: Esta rota serve para cancelar recebíveis de um bordero.
      operationId: cancelReceivablesFromBordero
      parameters:
      - in: path
        name: trackingId
        schema:
          type: string
          description: Uid Gerado
          example: 3382cc6f-1c59-4423-b364-c837deaf110d
          title: UIDSchema
        required: true
        description: Tracking Id do bordero
      requestBody:
        description: Dados para cancelar recebíveis
        content:
          application/json:
            schema:
              type: object
              required:
              - receivables
              properties:
                receivables:
                  type: array
                  items:
                    type: object
                    required:
                    - identification
                    - maturityDate
                    - maturityAmount
                    properties:
                      identification:
                        type: string
                        description: 'Identificação do recebível (ex: Nº da NF)'
                        example: '5120070562'
                        title: ReceivableIdentificationSchema
                      maturityDate:
                        description: Data de vencimento
                        type: string
                        format: date
                      maturityAmount:
                        description: Valor de vencimento
                        type: number
                        format: double
                    title: ReceivableCancelSchema
        required: true
      responses:
        '204':
          description: Sucesso
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                type: object
                required:
                - errorCode
                - message
                properties:
                  errorCode:
                    type: integer
                  message:
                    type: string
                  errorDetails:
                    type: array
                    items:
                      type: object
                      properties:
                        target:
                          type: string
                        code:
                          type: string
                          enum:
                          - BDQF0001
                          - BDQF0002
                          - BDQF0003
                          - BDQF0004
                          - BDQF0005
                          - BDQF0006
                          - BDQF0007
                          - BDQF0008
                          - BDQF0009
                          - BDQF0010
                          - BDQF0011
                          - BDQF0012
