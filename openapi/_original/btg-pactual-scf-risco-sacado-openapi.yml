  /settlements/{settlementId}:
    get:
      tags:
      - Settlement
      description: O objetivo dessa rota é pesquisar um pedido de liquidação previamente cadastrado.
      parameters:
      - in: path
        name: settlementId
        description: Id da liquidação
        schema:
          description: Identificador
          type: string
          example: 3382cc6f-1c59-4423-b364-c837deaf110d
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    description: Identificador da liquidação
                    type: string
                    example: 3382cc6f-1c59-4423-b364-c837deaf110e
                  payment:
                    type: object
                    properties:
                      account:
                        type: object
                        description: Dados da conta bancária
                        properties:
                          bank:
                            description: Código do banco
                            type: string
                          agency:
                            description: Agência da conta bancária
                            type: string
                          number:
                            description: Número da conta bancária
                            type: string
                          digit:
                            description: Dígito da conta bancária
                            type: string
                        title: AccountSchema
                      method:
                        enum:
                        - pix
                        - ted
                        type: string
                        example: ted
                      code:
                        description: Identificador a ser preenchido na transferência via PIX ou TED.
                        type: string
                        example: c3357540-fa15-4dbf-844c-1ce70ddb0d6c
                      maturityDate:
                        description: Timestamp (ISO 8601) da data e hora limite para expiração do pagamento. O pagamento deve ser realizado até essa hora, caso contrário, a liquidação será cancelada.
                        type: string
                        example: '2023-02-01T18:00:00.000Z'
                  trades:
                    type: array
                    items:
                      required:
                      - identification
                      - paidDate
                      - paidAmount
                      type: object
                      properties:
                        tradeId:
                          description: Identificador do trade
                          type: string
                        amount:
                          description: Valor de pagamento da transação
                          type: string
                        amount_settled:
                          description: Valor já pago do recebivel
                          type: string
                        status:
                          description: Status do trade
                          enum:
                          - PROCESSING
                          - PROCESSED
                          - CANCELLED
                          - INVALID
                          type: string
                          title: SettlementTradeStatusSchema
                        reason:
                          description: Descrição do status
                          type: string
                  status:
                    description: Status da liquidação
                    enum:
                    - CREATED
                    - VALIDATING
                    - INVALID
                    - WAITING_FOR_PAYMENT
                    - PROCESSED
                    - EXPIRED
                    type: string
                    title: SettlementStatusSchema
                title: SettlementReadSchema
          description: Sucesso na consulta do pedido de liquidação.
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                type: object
                required:
                - errorCode
                - message
                properties:
                  errorCode:
                    type: integer
                  message:
                    type: string
                  errorDetails:
                    type: array
                    items:
                      type: object
                      properties:
                        target:
                          type: string
                        code:
                          type: string
                          enum:
                          - STQF0001
                          - STQF0002
                          - STQF0003
                          - STQF0004
                          - STQF0005
                          - STQF0006
                          - STQF0007
                          - STQF0008
                          - STQF0009
                          - STQF0010
                          - STQF0011
                          - STQF0012
                          - STQF0013
                          - STQF0014
                          - STQF0015
                          - STQF0016
                          - STQF0017
                          - STQF0018
                          description: "___\nErrors:\n * STQF0001 - Identificação do pagador não preenchido\n * STQF0002 - Identificação do pagador inválido\n * STQF0003 - Identificação do pagador não relacionado com as entidades de um ou mais trades\n * STQF0004 - Pagamento não preenchido\n * STQF0005 - Método de pagamento não preenchido\n * STQF0006 - Método de pagamento inválido\n * STQF0007 - Trade não preenchido\n * STQF0008 - Existem trades duplicados na coleção\n * STQF0009 - Identificador do Trade inválido\n * STQF0010 - Identificador do Trade não encontrado\n * STQF0011 - Trade já liquidado previamente\n * STQF0012 - Trade sendo processado em outro pedido de liquidação\n * STQF0013 - Valor do trade inválido\n * STQF0014 - Valor do trade menor ou igual a zero\n * STQF0015 - Valor do trade diferente do valor de vencimento do recebivel\n * STQF0016 - Valor do trade indisponível\n * STQF0017 - Identificador da liquidação inválido\n * STQF0018 - Liquidação não encontrada\n"
                          title: ValidationErrorsSettlementEnumSchema
                title: SettlementBadRequestResponseSchema
        '401':
          description: Não autorizado
        default:
          description: Erro
          content:
            application/json:
              schema:
                type: object
                required:
                - errorCode
                - message
                properties:
                  errorCode:
                    type: integer
                  message:
                    type: string
                title: ErrorResponseSchema
      security:
      - oauth2:
        - empresas.btgpactual.com/scf/settlements
        - empresas.btgpactual.com/scf/settlements.readonly
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/SCF%20-%20Risco%20Sacado/consultar-um-pedido-de-liquidacao-cadastrado
  /borderos:
    post:
      tags:
      - Bordero
      description: Esta rota tem como objetivo criar um bordero para Antecipação de Recebíveis. Você nos enviará os recebíveis dos cedentes ou sacados, informando os campos necessários, com a possibilidade de informar a Estratégia cuja função é configurar as taxas da operação.
      operationId: createBordero
      requestBody:
        description: Dados dos recebíveis para antecipação
        content:
          application/json:
            schema:
              type: object
              required:
              - receivables
              properties:
                receivables:
                  type: array
                  items:
                    required:
                    - identification
                    - maturityDate
                    - maturityAmount
                    - payerTaxId
                    - payeeTaxId
                    - documentType
                    - currency
                    type: object
                    properties:
                      identification:
                        type: string
                        description: 'Identificação do recebível (ex: Nº da NF)'
                        example: '5120070562'
                        title: ReceivableIdentificationSchema
                      maturityDate:
                        description: Data de vencimento
                        type: string
                        format: date
                      maturityAmount:
                        description: Valor de vencimento
                        type: number
                        format: double
                      disbursementAmount:
                        description: Valor de desembolso
                        type: number
                        format: double
                      payerTaxId:
                        description: Documento do sacado
                        type: string
                      payeeTaxId:
                        description: Documento do cedente
                        type: string
                      documentType:
                        description: Tipo de documento do cedente ou sacado (depende do produto)
                        type: string
                        enum:
                        - CNPJ
                        - CPF
                      currency:
                        enum:
                        - BRL
                        - USD
                        - EUR
                        description: Moeda
                        type: string
                        title: CurrencySchema
                      repository:
                        description: Registradora
                        type: string
                        enum:
                        - CERC
                        - CIP
                        - ADIQ
                        - CIELO
                      registerNumber:
                        description: Número de registro
                        type: string
                      account:
                        type: object
                        description: Dados da conta bancária
                        properties:
                          bank:
                            description: Código do banco
                            type: string
                          agency:
                            description: Agência da conta bancária
                            type: string
                          number:
                            description: Número da conta bancária
                            type: string
                          digit:
                            description: Dígito da conta bancária
                            type: string
                        title: AccountSchema
                      files:
                        type: array
                        items:
                          description: Arquivos necessários serão alinhados de acordo com a especificação do negócio
                          type: object
                          properties:
                            url:
                              description: URL do arquivo
                              type: string
                            type:
                              description: Tipo do arquivo
                              type: string
                              enum:
                              - Nota
                              - Contrato
                              - Garantia
                              - Adesao
                              - Auxiliar
                              - Duplicata
                              - Canhoto
                              example: Nota
                            extension:
                              description: Extensão do arquivo
                              type: string
                              example: PDF
                          title: FileSchema
                product:
                  enum:
                  - CSCSacado
                  - CSCCedente
                  - CCC
                  description: Produto a operar
                  type: string
                  title: ProductSchema
                strategy:
                  type: string
                  description: GUID da Estratégia
                  example: 72e4d0db-841c-4bcd-9750-98e333507f67
        required: true
      responses:
        '201':
          description: Sucesso ao criar bordero de antecipação
          headers:
            Location:
              schema:
                type: string
                description: Uid Gerado
                example: 3382cc6f-1c59-4423-b364-c837deaf110d
                title: UIDSchema
          content:
            application/json:
              schema:
                type: object
