          application/json:
            schema:
              type: object
              required:
              - Receivables
              properties:
                Receivables:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                    - Identification
                    - MaturityDate
                    - MaturityAmount
                    properties:
                      Identification:
                        type: string
                      MaturityDate:
                        type: string
                        format: date-time
                      MaturityAmount:
                        type: number
                        format: double
              title: CancelReceivablesRequest
      responses:
        '200':
          description: Solicitud de cancelación recibida correctamente.
        '400':
          description: Solicitud inválida.
