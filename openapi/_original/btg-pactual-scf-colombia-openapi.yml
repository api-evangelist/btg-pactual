  /borderos:
    post:
      tags:
      - Operaciones
      description: Crea una operación con sus facturas en Colombia.
      operationId: createColombiaBordero
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - Receivables
              - Product
              properties:
                PayerTaxId:
                  type: string
                  nullable: true
                  description: NIT del pagador aplicable a todos los documentos por cobrar.
                PayerCountryCode:
                  type: string
                  nullable: true
                  description: Código ISO 3166-1 alpha-2 del país del pagador.
                  example: CO
                Receivables:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                    - PayerTaxId
                    - PayeeTaxId
                    - Identification
                    - MaturityDate
                    - MaturityAmount
                    - DocumentType
                    - Currency
                    - RadianEvent
                    properties:
                      PayerTaxId:
                        type: string
                        description: NIT del pagador.
                        example: '900000001'
                      PayerCountryCode:
                        type: string
                        enum:
                        - CO
                        description: Código ISO 3166-1 alpha-2 del país del pagador.
                      PayeeTaxId:
                        type: string
                        description: NIT del proveedor.
                        example: '900000002'
                      PayeeName:
                        type: string
                        description: Razón social del proveedor.
                      PayeeCountryCode:
                        type: string
                        enum:
                        - CO
                        description: Código ISO 3166-1 alpha-2 del país del proveedor.
                      Identification:
                        type: string
                        description: Identificador único del documento por cobrar.
                      MaturityDate:
                        type: string
                        format: date-time
                        description: Fecha de vencimiento.
                      MaturityAmount:
                        type: number
                        format: double
                        description: Valor nominal al vencimiento.
                      DisbursementAmount:
                        type: number
                        format: double
                        nullable: true
                        description: Valor previsto para el desembolso.
                      DisbursementDate:
                        type: string
                        format: date-time
                        nullable: true
                        description: Fecha prevista para el desembolso.
                      DocumentType:
                        type: string
                        enum:
                        - Offshore
                        description: Tipo de documento utilizado en la operación.
                      Currency:
                        type: string
                        enum:
                        - COP
                        description: Moneda de la operación.
                      OriginId:
                        type: string
                        nullable: true
                        description: Identificador del documento en el sistema de origen.
                      InvoiceKey:
                        type: string
                        nullable: true
                        description: CUFE de la factura electrónica.
                      SubProduct:
                        type: string
                        nullable: true
                        enum:
                        - Confirming
                        - Factoring
                        description: Modalidad de la operación.
                      LegitimateHolderTaxId:
                        type: string
                        nullable: true
                        description: NIT del legítimo tenedor.
                      LegitimateHolderName:
                        type: string
                        nullable: true
                        description: Razón social del legítimo tenedor.
                      Account:
                        type: object
                        allOf:
                        - type: object
                          properties:
                            Bank:
                              type: string
                              nullable: true
                              description: Código del banco.
                            Agency:
                              type: string
                              nullable: true
                              description: Código de la sucursal.
                            AgencyDigit:
                              type: string
                              nullable: true
                              description: Dígito de la sucursal.
                            Number:
                              type: string
                              nullable: true
                              description: Número de la cuenta.
                            Digit:
                              type: string
                              nullable: true
                              description: Dígito de la cuenta.
                            Type:
                              type: string
                              nullable: true
                              description: Tipo de cuenta, por ejemplo Ahorros o Corriente.
                            OwnerTaxId:
                              type: string
                              nullable: true
                              description: NIT del titular de la cuenta.
                            OwnerName:
                              type: string
                              nullable: true
                              description: Razón social del titular de la cuenta.
                            Company:
                              type: string
                              nullable: true
                              description: Identificador de la empresa asociada.
                            Cge:
                              type: string
                              nullable: true
                              description: Identificador CGE.
                          title: ColombiaAccount
                        nullable: true
                      IssueDate:
                        type: string
                        format: date-time
                        nullable: true
                        description: Fecha de emisión de la factura.
                      RadianEvent:
                        type: string
                        description: Código obligatorio del evento RADIAN.
                        example: '037'
                      DiscountDate:
                        type: string
                        format: date-time
                        nullable: true
                        description: Fecha de descuento.
                    title: ColombiaReceivable
                Strategy:
                  type: string
                  format: uuid
                  nullable: true
                  description: Identificador de la estrategia comercial. Campo opcional.
                Product:
                  type: string
                  enum:
                  - CSCSacado
                  description: Producto de la operación. Debe informarse como CSCSacado.
                TrackingId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Identificador de seguimiento proporcionado por el cliente. Campo opcional.
                PartnerIdentification:
                  type: string
                  nullable: true
                  description: Identificación del partner que origina la operación.
              title: CreateBorderoRequest
            example:
              PayerTaxId: null
              PayerCountryCode: null
              Receivables:
              - PayerTaxId: '900000001'
                PayerCountryCode: CO
                PayeeTaxId: '900000002'
                PayeeName: PROVEEDOR DE EJEMPLO SAS
                PayeeCountryCode: CO
                Identification: FE-2669
                MaturityDate: '2026-09-11T00:00:00-03:00'
                MaturityAmount: 752256558
                DisbursementAmount: 742640140.34779
                DisbursementDate: '2026-08-14T00:00:00-03:00'
                DocumentType: Offshore
                Currency: COP
                OriginId: 2b3fe241-2dc3-4a04-a0f0-342b1872861d
                InvoiceKey: CUFE-1234567890
                SubProduct: Confirming
                LegitimateHolderTaxId: '900000003'
                LegitimateHolderName: TENEDOR LEGÍTIMO DE EJEMPLO SAS
                Account:
                  Bank: '1007'
                  Agency: '999'
                  AgencyDigit: null
                  Number: '0000000000'
                  Digit: null
                  Type: Ahorros
                  OwnerTaxId: '900000003'
                  OwnerName: TENEDOR LEGÍTIMO DE EJEMPLO SAS
                  Company: null
                  Cge: null
                IssueDate: '2026-08-05T00:00:00-03:00'
                RadianEvent: '037'
                DiscountDate: '2026-08-14T00:00:00-03:00'
              Strategy: ba00e42d-1a7f-470e-b9c5-cae2d82ec435
              Product: CSCSacado
              TrackingId: 64166ec5-0d73-4050-9e2f-244f674ce86f
              PartnerIdentification: null
      responses:
        '201':
          description: Operación creada correctamente.
          headers:
            Location:
              description: Dirección para consultar la operación creada.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - TrackingId
                properties:
                  TrackingId:
                    type: string
                    format: uuid
                    description: Identificador de seguimiento de la operación creada.
