paths:
  /fidc-loan/v1/document:
    post:
      tags:
      - Document
      description: Envio de documentos auxiliares da operação de crédito.
      operationId: createDocument
      requestBody:
        description: Informações dos arquivos
        content:
          application/json:
            schema:
              type: object
              properties:
                fund:
                  description: Identificador do fundo
                  type: string
                  example: MT_FGTS
                files:
                  type: array
                  items:
                    type: object
                    properties:
                      externalId:
                        description: Identificador do contrato
                        type: string
                        example: 612746716/FTS
                      taxIdentification:
                        type: string
                        example: '15996430000182'
                        description: CNPJ/CPF
                        title: TaxIdSchema
                      fileName:
                        description: Nome do arquivo
                        type: string
                        example: exemplo_nome
                      fileIdentification:
                        description: Tipo do arquivo referente a operação
                        type: string
                        example: TERMO_CESSAO
                        enum:
                        - TERMO_CESSAO
                        - REGISTRO_C3
                        - COMPROVANTE_DESEMBOLSO
                        - TERMO_ENDOSSO
                        - NF
                        - COMPROVANTE_AVERBACAO
                        - TERMO_ADESAO
                        - CONTRATO_MUTUO
                        - COMPLEMENTO_AUXILIAR
                      fileExtension:
                        description: Extensão do arquivo
                        type: string
                        example: PDF
                      fileS3Url:
                        description: Link do s3 onde o arquivo esta armazenado
                        type: string
                        example: https://
                    title: FileSchema
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    description: Mesagem de sucesso
                    example: Request received
                title: SucessSchema
        '401':
