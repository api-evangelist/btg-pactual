openapi: 3.0.3
info:
  title: FIDC - Warranty
  version: 1.0.0
  description: Esta API tem a finalidade de contratar e simular empréstimos, realizar cessão de direitos creditórios e consulta de carteira.
  termsOfService: https://www.btgpactual.com/empresas/termos-e-politicas/
  contact:
    name: Time BTG Empresas
    email: ol-it-btgempresas@btgpactual.com
servers:
- url: https://api.sandbox.empresas.btgpactual.com
  description: Sandbox
- url: https://api.empresas.btgpactual.com
  description: Produção
paths:
  /fidc-loan/v1/warranty:
    post:
      tags:
      - Warranty
      description: O objetivo dessa rota é criar uma garantia
      requestBody:
        description: Informações de garantias
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Nome do arquivo com extensão
                        example: meu_arquivo.pdf
                      type:
                        type: string
                        description: Tipo de arquivo
                        enum:
                        - TERMO_ENDOSSO
                        - COMPLEMENTO_AUXILIAR
                      downloadUri:
                        type: string
                        description: Link para download do arquivo
                        example: https://arquivolink.com
                warranties:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Tipo de garantia
                        enum:
                        - CesFidConta
                        - CesFidDirCred
                        - Vehicle
                        - AliFidImovel
                        - HipotecaImovel
                        - AliFidMercantil
                        - PenhorMercantil
                        - AliFidAgricola
                        - PenhorAgricola
                      acquisitionDate:
                        type: string
                        description: Data de aquisição da garantia
                        example: '2023-08-03 00:00:00'
                      value:
                        type: number
                        description: Valor total da garantia
                        example: 500
                      details:
                        oneOf:
                        - type: object
                          properties:
                            currency:
                              type: string
                              description: Moeda
                              example: BRL
                            amount:
                              type: number
                              description: Valor da garantia
                              example: 500
                            bankCode:
                              type: string
                              description: Código do banco
                              example: 208
                            agency:
                              type: string
                              description: Identificador da Agência
                              example: 1
                            account:
                              type: string
                              description: Identificador da Conta
                              example: 4959995
                            isInternal:
                              type: boolean
                              description: Identificador se é uma conta interna
                              example: true
                            linkedAccount:
                              type: boolean
                              description: Identificador se é uma conta vínculada
                              example: false
                          title: AccountFiduciaryAssignmentSchema
                        - type: object
                          properties:
                            description:
                              type: array
                              items:
                                type: string
                                description: Descrição
                                enum:
                                - Contrato de Locação
                                - Outros
                            amount:
                              type: number
                              description: Valor
                              example: 200
                            currency:
                              type: string
                              description: Moeda
                              example: BRL
                          title: CreditRightFiduciaryAssignmentSchema
                        - type: object
                          properties:
                            Renavam:
                              type: string
                              description: Número do renavam
                              example: 1202137579
                            Chassi:
                              type: string
                              description: Identificador do chassi
                              example: 9BFZH54SXL8404704
                            LicensePlate:
                              type: string
                              description: Placa
                              example: QUN2087
                            Model:
                              type: string
                              description: Modelo
                              example: Ka 1.5 Sedan SE Plus 12V Flex 4p Aut.
                            ModelYear:
                              type: number
                              description: Ano Modelo
                              example: 2020
                            ProductionYear:
                              type: number
                              description: Ano de produção
                              example: 2020
                            StateCode:
                              type: string
                              description: Estado de compra do veículo
                              example: SP
                            Feeder:
                              type: string
                              description: Tabela referência
                              example: FIPE
                            CodFeeder:
                              type: string
                              description: Código da tabela
                              example: 003465-7
                            ValueFeeder:
                              type: number
                              description: Valor de tabela
                              example: 66204
                            IsChassiRemarked:
                              type: boolean
                              description: Identificador de chassi remarcado
                              example: false
                            VehicleType:
                              type: string
                              description: Tipo de veículo
                              example: LEVE
                            FundedMonths:
                              type: number
                              description: Parcelas devidas
                              example: 0
                            IsZeroKilometer:
                              type: boolean
                              description: Identificador se é veículo é zero quilometro
                              example: false
