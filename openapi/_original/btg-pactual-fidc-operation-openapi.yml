openapi: 3.0.3
info:
  title: FIDC - Operation
  version: 1.0.0
  description: Esta API tem a finalidade de contratar e simular empréstimos, realizar cessão de direitos creditórios e consulta de carteira.
  termsOfService: https://www.btgpactual.com/empresas/termos-e-politicas/
  contact:
    name: Time BTG Empresas
    email: ol-it-btgempresas@btgpactual.com
servers:
- url: https://api.sandbox.empresas.btgpactual.com
  description: Sandbox
- url: https://api.empresas.btgpactual.com
  description: Produção
paths:
  /fidc-loan/v1/operation:
    post:
      tags:
      - Operation
      description: Essa rota serve para realizar a cessão de crédito ou emprestimo.
      operationId: createOperation
      requestBody:
        description: Dados da operação
        content:
          application/json:
            schema:
              type: object
              properties:
                AgreementId:
                  type: string
                  description: Identificador do convênio
                  example: XXXXXXXXXXXXXXXXXX
                ExternalId:
                  type: string
                  description: Identificador do parceiro para envios de hooks
                  example: IDENTIFICADOR_UNICO_PARCEIRO
                TaxIdCounterparty:
                  type: string
                  description: Cnpj/Cpf do tomador do emprestimo
                  example: XXXXXXXXXXX
                Term:
                  type: number
                  description: Quatidade de parcelas
                TotalAmount:
                  deprecated: true
                  type: number
                  format: double
                  description: Valor total do Empréstimo + Juros + Comissao + Impostos. Soma de todas as PMTs
                  example: 10.01
                Interest:
                  type: object
                  properties:
                    Index:
                      type: string
                      description: Indexador utilizado
                      default: PRE
                      enum:
                      - PRE
                      - CDIE
                      - NIPCA
                    PreIndexRate:
                      type: number
                      format: double
                      description: Taxa Pré Fixada do emprestimo
                      example: 0.0225
                    PosIndexPercentage:
                      type: number
                      format: double
                      description: Porcentagem do indexador Pós fixado a ser considerado (1 = 100%, 1.2 = 120%)
                      example: 1
                    BaseDayCount:
                      type: number
                      description: Base de dias para o calculo da taxa. Ex. 30, 365, 252, 30360
                      example: 30
                LatePaymentCharges:
                  type: object
                  description: Juros cobrados por atraso
                  properties:
                    PosIndexCode:
                      type: string
                      description: Indexador pos utilizado
                      default: PRE
                      enum:
                      - PRE
                      - CDIE
                      - NIPCA
                    PreIndexRate:
                      type: number
                      format: double
                      description: Taxa Pré Fixada do emprestimo cobrados por atraso
                      example: 0.0225
                    PosIndexPercentage:
                      type: number
                      format: double
                      description: Porcentagem do indexador Pós fixado a ser considerado (1 = 100%, 1.2 = 120%) em cobrança por atraso
                      example: 1
                PurchaseInformation:
                  type: object
                  properties:
                    amount:
                      type: number
                      format: double
                      nullable: true
                    interest:
                      type: object
                      properties:
                        index:
                          enum:
                          - PRE
                          - CDIE
                          - NIPCA
                          - PTAX
                          - IGPM
                          - NIGPM
                          - SELIC
                          - TR
                          type: string
                        preIndexRate:
                          type: number
                          format: double
                          nullable: true
                        posIndexPercentage:
                          type: number
                          format: double
                          nullable: true
                        baseDayCount:
                          type: integer
                          format: int32
                          nullable: true
                      additionalProperties: false
                Amount:
                  type: number
                  format: double
                  description: Valor do emprestimo
                  example: 10.01
                Rate:
                  deprecated: true
                  type: number
                  format: double
                  description: Substituido por "Interest"."PreIndexRate"
                AssignmentRate:
                  type: number
                  format: double
                  description: Taxa da cessão
                  example: 0.0247
                Tax:
                  type: number
                  format: double
                  description: Valor de imposto aplicada. IOF
                  example: 10.01
                Arrears:
                  type: number
                  format: double
                  description: Mora
                  example: 0.01
                Penalty:
                  type: number
                  format: double
                  description: Multa
                  example: 0.02
                LatePaymentRate:
                  deprecated: true
                  type: number
                  format: double
                  description: Substituido por "LatePaymentCharges"."PreIndexRate" Taxa de juros por atraso
                  example: 0.02
                Charges:
                  type: number
                  format: double
                  description: Valor dos Encargos. Soma dos FEEs/Ágio/Deságio
                  example: 10.01
                Cet:
                  type: number
                  format: double
                  description: Custo Efetivo Total
                  example: 0.0369
                BaseDayCount:
                  type: number
                  description: Substituido por "Interest"."BaseDayCount"
                  example: 30
                  deprecated: true
                AcquisitionAmount:
                  type: number
                  format: double
                  description: Valor de aquisição da operação. Amount + FEEs + Ágio/Deságio
                  example: 10.01
                ClientNetAmount:
                  type: number
                  format: double
                  description: Valor liquido desembolsado para a contraparte do emprestimo
                  example: 10.01
                BaseDate:
                  type: string
                  format: date
                  description: Start Accrual da operação
                SettlementDate:
                  type: string
                  format: date
                  description: Data de vencimento da operação. End Accrual da operação
                FundingDate:
                  type: string
                  format: date
                  description: Data de Liquidacao para a contraparte
                FirtsInstallmentDate:
                  type: string
                  format: date
                  description: Data de end accrual da primeira parcela
                OperationType:
                  type: string
                  description: 'Tipo do operação. Ex: NEW, PORTABILITY, REFINANCING.'
                  example: NEW
                Settlement:
                  type: object
                  properties:
                    Type:
                      type: string
                      description: Tipo da liquidação
                      enum:
                      - DebitoEmConta
                      - Boleto
                    Account:
                      type: object
                      properties:
                        BankCode:
                          type: string
                          description: Código do banco
                          example: '208'
                        Agency:
                          type: string
                          description: Número da agência
                          example: '0001'
                        DigitAgency:
                          type: string
                          description: Dígito da agência
                          example: '2'
                        Number:
                          type: string
                          description: Número da conta
                          example: '22501'
                        DigitAccount:
                          type: string
                          description: Dígito da conta
                          example: '3'
                Disbursement:
                  type: object
                  properties:
                    Type:
                      type: string
                      description: Tipo da conta
                      example: Corrente
                      enum:
                      - Corrente
                      - Poupanca
                      - Salario
                    Account:
                      type: object
                      properties:
                        BankCode:
                          type: string
                          description: Código do banco
                          example: '208'
                        Agency:
                          type: string
                          description: Número da agência
                          example: '0001'
                        DigitAgency:
                          type: string
                          description: Dígito da agência
                          example: '2'
                        Number:
                          type: string
                          description: Número da conta
                          example: '22501'
                        DigitAccount:
                          type: string
                          description: Dígito da conta
                          example: '3'
                    AdditionalDisbursements:
                      type: array
                      items:
                        type: object
                        description: Avalistas da operação
                        properties:
                          Type:
                            type: string
                            description: Tipo da conta
                            example: SSIS
                            enum:
                            - Corrente
                            - Poupanca
                            - Salario
                            - SSIS
                          TaxId:
                            type: string
                            description: Documento Nacional do proprietário da conta
                            example: XXXXXXXXXXX
                          Account:
                            type: object
                            properties:
                              BankCode:
                                type: string
                                description: Código do banco
                                example: '208'
                              Agency:
                                type: string
                                description: Número da agência
                                example: '0001'
                              DigitAgency:
                                type: string
                                description: Dígito da agência
                                example: '2'
                              Number:
                                type: string
                                description: Número da conta
                                example: '22501'
                              DigitAccount:
                                type: string
                                description: Dígito da conta
                                example: '3'
                Contract:
                  type: object
                  properties:
                    ExternalId:
                      type: string
                      description: Identificador do parceiro para envios de hooks
                      example: IDENTIFICADOR_UNICO_PARCEIRO
                    Number:
                      type: string
                      description: Identificador único do contrato
                      example: NUMERO_CONTRATO
                    FormalizationDate:
                      type: string
                      format: date
                      description: Data da formalização do contrato
                    Guarantees:
                      type: array
                      items:
                        type: object
                        description: Avalistas da operação
                        properties:
                          Name:
                            type: string
                            description: Nome do avalista
                            example: NOME_AVALISTA
                          TaxId:
                            type: string
                            description: Cnpj/Cpf do avalista
                            example: XXXXXXXXXXX
                          Amount:
                            description: Valor Garantido por este Avalista
                            type: number
                            format: double
                            example: 10.01
                    EmissionType:
                      type: string
                      description: Tipo de emissao do contrato
                      example: CARTULAR
                      enum:
                      - NONE
                      - CARTULAR
                      - ESCRITURAL
                      - ELETRONICA
                Installments:
                  type: array
                  items:
                    type: object
                    description: Parcelas da operação
                    properties:
                      Code:
                        type: number
                        description: Numero da parcela
                        example: 1
                      Amortization:
                        type: number
                        format: double
                        description: Principal da parcela. Amortização
                        example: 10.01
                      Amount:
                        type: number
                        format: double
                        description: Valor da parcela. PMT
                        example: 10.01
                      Interest:
                        type: number
                        format: double
                        description: Juros da parcela
                        example: 10.01
                      Tax:
                        type: number
                        format: double
                        description: Valor do IOF na parcela
                        example: 0.63
                      IsPaid:
                        type: boolean
                        description: Indicador se houve pagamento completo anteriormente da parcela
                        example: false
                      PaidValue:
                        type: number
                        format: double
                        description: Valor anteriormente pago da parcela
                        example: 0
                      StartAccrual:
                        type: string
                        format: date
                        description: Data de inicio de accrual da parcela
                      EndAccrual:
                        type: string
                        format: date
                        description: Data de termino de accrual da parcela
                      PaymentDate:
                        type: string
                        format: date
                        description: Data de pagamento da parcela
                      MaturityDate:
                        type: string
                        format: date
                        description: Data de vencimento da parcela
                OtherFees:
                  type: array
                  description: Taxas adicionais de cessão. Obrigatório se custos por cessão forem aplicáveis.
                  items:
                    type: object
                    properties:
                      Type:
                        type: string
                        description: Tipo do Fee
                        example: BROKER
                        enum:
                        - REGISTRATOR
                        - BROKER
                        - RCO
                        - CIP
                        - TAC
                      Value:
                        type: number
                        format: double
                        description: Valor Nominal
                        example: 10.01
                Fees:
                  type: array
                  description: Taxas adicionais de bancarização. Se aplicável (Obrigatorio se houver Fee)
                  items:
                    type: object
                    properties:
                      Type:
                        type: string
                        description: Tipo do Fee
                        example: TAC
                        enum:
                        - REGISTRATOR
                        - BROKER
                        - RCO
                        - CIP
                        - TAC
                      Value:
                        type: number
                        format: double
                        description: Valor Nominal
                        example: 10.01
                GenericIdentifiers:
                  type: array
                  description: Informações adicionais
                  items:
                    type: object
                    properties:
                      Type:
                        type: string
                        description: Tipo da informação do campo generico
                        example: IPOC
                        enum:
                        - IPOC
                        - CessionNumber
                        - EndorsementNumber
                        - ConciliationIdentifier
                        - CCIIdentifier
                        - SNGRegistry
                        - ConsigCode
                        - SignatureDate
                        - FederativeUnit
                        - RATING
                        - STORE_ID
                        - SEGMENT
                        - ConsignedEntity
                        - ConsignedEntityPayer
                      Value:
                        type: string
                        description: Valor do campo generico
                        example: XXXXXXXXXXXXXXXXXX
                RelatedOperations:
                  type: array
                  items:
                    type: object
                    description: Parcelas da operação
                    properties:
                      PositionAmount:
                        type: number
                        description: Valor da posição
                        example: 100.25
                      PositionDate:
                        type: string
                        format: date
                        description: Data da posição
                        example: '2024-01-01'
                      ContractNumber:
                        type: string
                        description: Código do contrato
                        example: NUMERO_CONTRATO
                WarrantyIdentification:
                  type: string
                  description: Identificador da garantia
                  example: cfd57a8d-20b6-45d3-8c4e-bd688425e31a
        required: true
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    description: Mesagem de sucesso
                    example: Request received
                title: SucessSchema
        '401':
          description: Não autorizado
        '500':
          description: Erro
          content:
            application/json:
              schema:
                type: object
                required:
                - errorCode
                - message
                properties:
                  errorCode:
                    type: integer
                  message:
                    type: string
                title: ErrorResponseSchema
      security:
      - oauth2:
        - empresas.btgpactual.com/loans
      callbacks:
        OperationUpdatedStatus:
          <webhook-host-http>/:
            post:
              summary: Chamada webhook de atualização no status da operação
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        Identification:
                          description: Identificador do BTG da operação
                          type: string
                          example: XXXXXXXXXX
                        ExternalId:
                          description: Identificador do parceiro para envios de hooks
                          type: string
                          example: IDENTIFICADOR_UNICO_PARCEIRO
                        Amount:
                          description: Valor do credito
                          type: number
                          format: double
                          example: 10.01
                        Status:
                          description: 'Status do empréstimo. Possiveis: PendenteValidacao, EnvioTrade, TradeEnviado, AguardandoDesembolso, Desembolsado, Liquidado, Invalido, Cancelado.'
                          type: string
                          example: Desembolsado
                        RejectedStatusCodes:
                          type: array
                          items:
                            type: string
                            description: Lista de motivos de rejeição
                        PartyTaxId:
                          type: string
                          format: string
                          description: Identificador do fundo
                          example: '30306294000145'
                        PublishDate:
                          description: Data de publicação do evento
                          type: string
                          format: date-time
                          example: '2023-04-14T00:00:01.000Z'
                        AgreementId:
                          type: string
                          description: Identificador do convênio
                          example: XXXXXXXXXXXXXXXXXX
                        Disbursement:
                          description: Informações do desembolso da cessão
                          type: object
                          properties:
                            Amount:
                              description: Valor total do desembolso na cessão do credito
                              type: number
                              format: double
                              example: 11.02
                            FeeAmount:
                              description: Valor discriminado do agio na cessão do credito, caso tenha
                              type: number
                              format: double
                              example: 1.01
                        Contract:
                          description: Informações do contrato
                          type: object
                          properties:
                            Number:
                              description: Identificador único do contrato
                              type: string
                              example: NUMERO_CONTRATO
                      title: OperationWebhookSchema
              responses:
                '200':
                  description: Seu servidor deve retornar 200 caso tenha processado a requisição corretamente
        Bankslip:
          <webhook-host-http>/:
            post:
              summary: Chamada webhook com os dados do boleto emitido
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        ClientTaxId:
                          type: string
                          example: '15996430000182'
                          description: CNPJ/CPF
                          title: TaxIdSchema
                        TradeId:
                          description: Identificador da operação da API da carteira
                          type: string
                          example: '582152'
                        ValueTitle:
                          description: Valor do boleto
                          type: number
                          format: double
                        PublishDate:
                          description: Data de publicação do evento
                          type: string
                          format: date-time
                          example: '2023-04-14T00:00:01.000Z'
                        BarCodeNumber:
                          description: Linha digitavel do boleto
                          type: string
                          example: '20890001091000000120532016696604192200000161979'
                        MaturityTitle:
                          description: Data de maturidade do boleto
                          type: string
                          format: date-time
                          example: '2023-04-14T00:00:01.000Z'
                        Identification:
                          description: Identificador unico do boleto
                          type: string
                          example: ujhaf09qfqf=1rjf
                        InstallmentNumber:
                          description: Numero da parcela
                          type: string
                          example: '1'
                        StatusDescription:
                          description: 'Descrição do status do boleto. Possiveis: EMITIDO, PAGO, CANCELADO'
                          type: string
                          example: EMITIDO
                        StatusId:
                          description: 'Codigo do status do boleto. Possiveis: EMITIDO = 4, PAGO = 5, CANCELADO = 7'
                          type: string
                          example: '4'
                        ExternalId:
                          description: Identificador externo da operação
                          example: b2eaa18b-985e-473f-92bf-8cf9a407aee1
                        File:
                          description: Base64 do arquivo
                          type: string
                          example: Base64
                      title: BankslipWebhookSchema
              responses:
                '200':
                  description: Seu servidor deve retornar 200 caso tenha processado a requisição corretamente
        DirectDebit:
          <webhook-host-http>/:
            post:
              summary: Chamada webhook com os dados do resultado do débito em conta
              requestBody:
                content:
                  application/json:
                    schema:
                      type: array
                      items:
                        type: object
                        properties:
                          identification:
                            type: string
                            description: Identificador do débito em conta
                            example: '00000000000000000000'
                          status:
                            type: string
                            description: Status do débito em conta
                            example: Completed
                            enum:
                            - Scheduled
                            - Completed
                            - Error
                            - Cancelled
                            - WaitingUpdate
                            - Issued
                            - Processing
                            - ReceivedByScheduler
                            - ScheduleWindowOpened
                            - ScheduleRequestGenerated
                            - CancelError
                          description:
                            type: string
                            description: Descrição de status do débito em conta
                            example: Sucesso do Layout de 150 posições da FEBRABAN - Débito efetuado
                          contractNumber:
                            type: string
                            description: Identificador do contrato
                            example: 623426236/FTS
                          installmentNumber:
                            type: number
                            description: Numero da parcela
                            example: 1
                          executionDate:
                            type: string
                            format: date-time
                            description: Data da operação
                            example: '2023-04-14T00:00:01.000Z'
                          fundTaxId:
                            type: string
                            format: string
                            description: Identificador do fundo
                            example: '15996430000182'
                          settlementMethod:
                            type: string
                            description: Forma de agendamento da liquidação
                            example: ExternalDebitScheduler
                            enum:
                            - ExternalDebitScheduler
                        title: DirectDebitSchema
                      title: DirectDebitResponseSchema
              responses:
                '200':
                  description: Seu servidor deve retornar 200 caso tenha processado a requisição corretamente
