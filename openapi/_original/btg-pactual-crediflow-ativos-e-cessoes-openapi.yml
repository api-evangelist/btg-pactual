# x-archived-on: 2026-10-18
openapi: 3.0.3
info:
  title: CrediFlow - Ativos e Cessões
  description: Esta documentação tem a finalidade de instruir parceiros na utilização das APIs de CrediFlow para criação e acompanhamento de ativos de crédito e suas cessões para um FIDC. Para autenticação é necessária a utilização do fluxo de client credentials de acordo com o menu `Authentication -> Fluxos de Autenticação -> Client Credentials`. O fluxo de negócio (admissão, cessão, grupos de desembolso) está descrito no guia conceitual da API de CrediFlow.
  version: '1.0'
servers:
- url: https://api.sandbox.empresas.btgpactual.com
  description: Sandbox
- url: https://api.empresas.btgpactual.com
  description: Produção
paths:
  /fidc/v1/assets/{asset_id}:
    put:
      tags:
      - Assets
      description: Corrige os dados de um ativo reprovado na admissão e reprocessa a admissão automaticamente. Rejeitado se o ativo possuir uma cessão ativa (erro CF-38).
      parameters:
      - in: path
        name: asset_id
        description: Identificador do ativo (retornado na criação)
        required: true
        schema:
          type: string
          format: uuid
          example: 0524b1ed-6a78-4f00-8394-543ffcd188f0
      requestBody:
        description: Dados corrigidos do ativo. Mesma estrutura da criação, exceto `identification` e `fundTaxId`, que não podem ser alterados.
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                description: Dados do ativo (operação de crédito)
                required:
                - identification
                - fundTaxId
                - draweeIdentification
                - assignorIdentification
                - currency
                - product
                - operationType
                - installments
                properties:
                  identification:
                    type: string
                    description: Identificador externo do ativo, único por fundo. É a chave de idempotência da criação (junto com `fundTaxId`) e o valor usado depois para consultar o motivo de rejeição pela rota `operation-rejection-reason`
                    example: NOTA-2024-000123
                  fundTaxId:
                    type: string
                    description: CNPJ do fundo que receberá o ativo. Determina qual configuração de fundo será aplicada — ou seja, quais etapas de admissão e cessão serão executadas e com quais regras de validação
                    example: '15996430000182'
                  draweeIdentification:
                    type: string
                    description: CPF/CNPJ do sacado (devedor da operação). Na etapa de busca de contrapartes da admissão, esse documento é pesquisado no catálogo de participantes; se não for encontrado, o ativo é reprovado
                    example: '12345678000199'
                  assignorIdentification:
                    type: string
                    description: CPF/CNPJ do cedente (quem vende o ativo ao fundo). Também é validado na busca de contrapartes e usado como favorecido padrão do desembolso da cessão
                    example: '98765432000188'
                  currency:
                    type: string
                    description: Moeda da operação. Deve corresponder a um valor aceito pela plataforma
                    example: BRL
                  product:
                    type: string
                    description: Tipo de produto da operação. Define a natureza do ativo — recebível (ex. duplicata) ou empréstimo (ex. CCB) — o que muda os campos exigidos na validação (empréstimos exigem `contract` e `interestRate`). Produtos fora dessas duas categorias são rejeitados (erro CF-33)
                    example: CCB
                  operationType:
                    type: string
                    description: Tipo da operação de aquisição pretendida para o ativo (ex. cessão). Usado na validação e repassado no registro do trade
                    example: Cession
                  warrantiesId:
                    type: string
                    format: uuid
                    nullable: true
                    description: Identificador do pacote de garantias vinculado ao ativo, quando houver. As garantias são geridas em outro fluxo e apenas referenciadas aqui
                    example: 5f7d1c1e-3b2a-4c8d-9e6f-0a1b2c3d4e5f
                  fees:
                    type: array
                    nullable: true
                    description: Taxas cobradas na originação do ativo (ex. TAC). São consideradas na composição financeira da operação enviada ao registro
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: Categoria da taxa, conforme os tipos aceitos pela plataforma (ex. TAC). Valores fora da lista são reprovados na validação
                          example: Tac
                        amount:
                          type: number
                          description: Valor monetário da taxa. Deve ser maior ou igual a zero
                          example: 150
                      title: FeeSchema
                  genericIdentifiers:
                    type: array
                    nullable: true
                    description: Identificadores adicionais do ativo em sistemas do parceiro (ex. número da nota fiscal). Não afetam o processamento — servem para rastreio e conciliação
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: Categoria do identificador, conforme os tipos aceitos pela plataforma (ex. número de nota fiscal)
                          example: InvoiceNumber
                        value:
                          type: string
                          description: Valor do identificador no sistema de origem. Usado apenas para rastreio e conciliação
                          example: '000123456'
                      title: GenericIdentifierSchema
                  installments:
                    type: array
                    description: Cronograma de parcelas do ativo. É a base do fluxo de caixa da operação — usado na validação, na precificação da cessão e no cálculo do valor total do ativo
                    items:
                      type: object
                      properties:
                        number:
                          type: number
                          description: Número sequencial da parcela dentro do cronograma (maior que zero)
                          example: 1
                        maturityDate:
                          type: string
                          format: date-time
                          description: Data de vencimento da parcela. A maior data do cronograma define o vencimento final do ativo
                          example: '2024-12-01T00:00:00'
                        amount:
                          type: number
                          description: Valor de vencimento (face) da parcela, maior que zero. A soma das parcelas em aberto compõe o valor total do ativo usado na precificação
                          example: 1050
                        amortizationAmount:
                          type: number
                          nullable: true
                          description: Porção da parcela que corresponde a principal (amortização). Junto com juros e impostos, detalha a composição do valor de vencimento
                          example: 1000
                        interestAmount:
                          type: number
                          nullable: true
                          description: Porção da parcela que corresponde a juros
                          example: 45
                        taxAmount:
                          type: number
                          nullable: true
                          description: Porção da parcela que corresponde a impostos (ex. IOF)
                          example: 5
                        isPaid:
                          type: boolean
                          description: Indica se a parcela já foi liquidada pelo devedor. Parcelas pagas não entram no valor cedido — controlam também a obrigatoriedade de `paidAmount` e `paymentDate`
                          example: false
                        paidAmount:
                          type: number
                          nullable: true
                          description: Valor efetivamente pago da parcela. Obrigatório e maior que zero quando `isPaid` é true; deve ser nulo caso contrário
                          example: null
                        paymentDate:
                          type: string
                          format: date-time
                          nullable: true
                          description: Data em que o pagamento ocorreu. Obrigatória (e não futura) quando `isPaid` é true; deve ser nula caso contrário
                          example: null
                        startAccrual:
                          type: string
                          format: date-time
                          nullable: true
                          description: Início do período de incidência de juros (accrual) da parcela
                          example: '2024-06-01T00:00:00'
                        endAccrual:
                          type: string
                          format: date-time
                          nullable: true
                          description: Fim do período de incidência de juros (accrual) da parcela
                          example: '2024-12-01T00:00:00'
                        externalSettlement:
                          type: object
                          nullable: true
                          description: Instrução de como o devedor liquida esta parcela (Pix, boleto ou conta bancária). Direciona para onde o pagamento da parcela deve ser feito após a cessão
                          properties:
                            type:
                              type: string
                              description: Meio de liquidação da parcela. Determina qual dos demais campos deve ser preenchido
                              example: Pix
                            bankAccount:
                              type: object
                              nullable: true
                              description: Dados de conta bancária, usados como destino de pagamentos (liquidação de parcelas, desembolso da cessão ou liquidação da cessão, conforme o contexto)
                              properties:
                                number:
                                  type: string
                                  description: Número da conta, sem o dígito verificador
                                  example: '123456'
                                digit:
                                  type: string
                                  description: Dígito verificador da conta
                                  example: '7'
                                bankCode:
                                  type: string
                                  description: Código COMPE do banco (3 dígitos)
                                  example: '208'
                                agency:
                                  type: string
                                  description: Número da agência, sem o dígito
                                  example: '0001'
                                digitAgency:
                                  type: string
                                  nullable: true
                                  description: Dígito verificador da agência, quando houver
                                  example: '9'
                              title: BankAccountSchema
                            pixEmv:
                              type: string
                              nullable: true
                              description: Código EMV (copia-e-cola) do Pix, quando o meio de liquidação é Pix
                              example: 00020126580014br.gov.bcb.pix...
                            bankslipBarCode:
                              type: string
                              nullable: true
                              description: Código de barras do boleto, quando o meio de liquidação é boleto
                              example: '20890001091000000024918026988206892410000024418'
                      title: InstallmentSchema
                  relatedOperations:
                    type: array
                    nullable: true
                    description: Referências a outras operações vinculadas a este ativo (ex. operação original em uma renegociação)
                    items:
                      type: object
                      properties:
                        positionDate:
                          type: string
                          format: date-time
                          description: Data da posição da operação relacionada
                          example: '2024-06-01T00:00:00'
                        identification:
                          type: string
                          description: Identificador externo da operação relacionada
                          example: NOTA-2024-000100
                  interestRate:
                    allOf:
                    - type: object
                      description: Estrutura de taxa de juros. Pode ser puramente fixa (`fixedInterestRate`), atrelada a um indexador (`variableInterestRate`) ou híbrida (fixa + indexador)
                      properties:
                        fixedInterestRate:
                          type: number
                          nullable: true
                          description: Componente fixo da taxa de juros, em percentual no período da base de accrual
                          example: 1.99
                        variableInterestRate:
                          type: object
                          nullable: true
                          description: Componente pós-fixado da taxa, atrelado a um indexador de mercado
                          properties:
                            indexType:
                              type: string
                              description: Indexador de mercado que corrige a taxa (ex. CDI)
                              example: CDI
                            rateMultiplier:
                              type: number
                              description: Percentual aplicado sobre o indexador (ex. 110 = 110% do CDI). Deve ser maior que zero
                              example: 110
                        baseDayCount:
                          type: string
                          nullable: true
                          description: Convenção de contagem de dias usada no accrual dos juros (ex. BUS252 = dias úteis, base 252)
                          example: BUS252
                      title: InterestRateSchema
                    nullable: true
                    description: Taxa de juros remuneratórios do ativo. Obrigatória para empréstimos; usada no accrual do contrato e repassada ao registro do trade
                  latePaymentInterest:
                    allOf:
                    - allOf:
                      - type: object
                        description: Estrutura de taxa de juros. Pode ser puramente fixa (`fixedInterestRate`), atrelada a um indexador (`variableInterestRate`) ou híbrida (fixa + indexador)
                        properties:
                          fixedInterestRate:
                            type: number
                            nullable: true
                            description: Componente fixo da taxa de juros, em percentual no período da base de accrual
                            example: 1.99
                          variableInterestRate:
                            type: object
                            nullable: true
                            description: Componente pós-fixado da taxa, atrelado a um indexador de mercado
                            properties:
                              indexType:
                                type: string
                                description: Indexador de mercado que corrige a taxa (ex. CDI)
                                example: CDI
                              rateMultiplier:
                                type: number
                                description: Percentual aplicado sobre o indexador (ex. 110 = 110% do CDI). Deve ser maior que zero
                                example: 110
                          baseDayCount:
                            type: string
                            nullable: true
                            description: Convenção de contagem de dias usada no accrual dos juros (ex. BUS252 = dias úteis, base 252)
                            example: BUS252
                        title: InterestRateSchema
                      type: object
                      description: Encargos aplicados quando o devedor atrasa o pagamento — estende a estrutura de taxa de juros (taxa de atraso e indexador) e acrescenta mora e multa
                      properties:
                        arrearsAmount:
                          type: number
                          nullable: true
                          description: Percentual de juros de mora incidente por atraso, aplicado pro-rata sobre o valor em aberto
                          example: 1
                        penaltyAmount:
                          type: number
                          nullable: true
                          description: Percentual de multa aplicado uma única vez sobre o valor em aberto quando a parcela atrasa
                          example: 2
                      title: LatePaymentInterestSchema
                    nullable: true
                    description: Encargos aplicáveis em caso de atraso do devedor (taxa de atraso, mora e multa). Não afetam o preço da cessão — definem como o ativo remunera após o vencimento
                  contract:
                    type: object
                    nullable: true
                    description: Dados do contrato que formaliza a operação. Obrigatório para empréstimos (ex. CCB); não se aplica a recebíveis
                    properties:
                      number:
                        type: string
                        description: Número do contrato formalizado
                        example: 6764459321/EP
                      formalizationDate:
                        type: string
                        format: date-time
                        description: Data em que o contrato foi formalizado/assinado
                        example: '2024-05-15T00:00:00'
                      emissionType:
                        type: string
                        description: Forma de emissão do contrato (ex. digital ou física), relevante para o registro
                        example: Digital
                title: AssetPayloadSchema
              description: Mesma estrutura do payload de criação. Os campos `identification` e `fundTaxId` são ignorados — a identidade do ativo não pode ser alterada na correção.
              title: AssetCorrectionPayloadSchema
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                description: Envelope padrão de resposta da API
                properties:
                  trackingId:
                    type: string
                    format: uuid
                    description: Identificador de rastreio da requisição (informe ao suporte em caso de problemas)
                    example: 8bce6cfc-dcd4-473b-9fae-60ef3f60ec11
                  succeeded:
                    type: boolean
                    description: Indica se a requisição foi bem-sucedida
                    example: true
                  message:
                    type: string
                    description: Mensagem geral da resposta
                    example: Request succeeded.
                  statusCode:
                    type: number
                    description: Código HTTP da resposta
                    example: 200
                  errors:
                    type: array
                    description: Lista de erros (vazia em caso de sucesso)
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro (consulte a tabela de erros no guia da API)
                          example: CF-67
                        message:
                          type: string
                          description: Descrição do erro
                          example: The asset must be Eligible before creating a cession.
                        field:
                          type: string
                          nullable: true
                          description: Campo relacionado ao erro, quando aplicável
                          example: assetIds
                      title: ErrorSchema
                  data:
                    nullable: true
                    description: Dados da resposta (nulo em caso de erro)
                title: ResponseEnvelopeSchema
        '400':
          description: Erro
          content:
            application/json:
              schema:
                type: object
                description: Envelope padrão de resposta de erro
                properties:
                  trackingId:
                    type: string
                    format: uuid
                    description: Identificador de rastreio da requisição
                    example: 8bce6cfc-dcd4-473b-9fae-60ef3f60ec11
                  succeeded:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unsuccessful request, see errors to get more details.
                  statusCode:
                    type: number
                    example: 422
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro (consulte a tabela de erros no guia da API)
                          example: CF-67
                        message:
                          type: string
                          description: Descrição do erro
                          example: The asset must be Eligible before creating a cession.
                        field:
                          type: string
                          nullable: true
                          description: Campo relacionado ao erro, quando aplicável
                          example: assetIds
                      title: ErrorSchema
                  data:
                    nullable: true
                    example: null
                title: ErrorEnvelopeSchema
        '401':
          description: Não autorizado
        '404':
          description: Erro
          content:
            application/json:
              schema:
                type: object
                description: Envelope padrão de resposta de erro
                properties:
                  trackingId:
                    type: string
                    format: uuid
                    description: Identificador de rastreio da requisição
                    example: 8bce6cfc-dcd4-473b-9fae-60ef3f60ec11
                  succeeded:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unsuccessful request, see errors to get more details.
                  statusCode:
                    type: number
                    example: 422
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro (consulte a tabela de erros no guia da API)
                          example: CF-67
                        message:
                          type: string
                          description: Descrição do erro
                          example: The asset must be Eligible before creating a cession.
                        field:
                          type: string
                          nullable: true
                          description: Campo relacionado ao erro, quando aplicável
                          example: assetIds
                      title: ErrorSchema
                  data:
                    nullable: true
                    example: null
                title: ErrorEnvelopeSchema
        '422':
          description: Erro
          content:
            application/json:
              schema:
                type: object
                description: Envelope padrão de resposta de erro
                properties:
                  trackingId:
                    type: string
                    format: uuid
                    description: Identificador de rastreio da requisição
                    example: 8bce6cfc-dcd4-473b-9fae-60ef3f60ec11
                  succeeded:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unsuccessful request, see errors to get more details.
                  statusCode:
                    type: number
                    example: 422
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro (consulte a tabela de erros no guia da API)
                          example: CF-67
                        message:
                          type: string
                          description: Descrição do erro
                          example: The asset must be Eligible before creating a cession.
                        field:
                          type: string
                          nullable: true
                          description: Campo relacionado ao erro, quando aplicável
                          example: assetIds
                      title: ErrorSchema
                  data:
                    nullable: true
                    example: null
                title: ErrorEnvelopeSchema
      security:
      - oauth2:
        - empresas.btgpactual.com/crediflow
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/CrediFlow%20-%20Ativos%20e%20Cess%5Cxf5es/atualizar-ativo-correcao
  /fidc/v1/cessions:
    get:
      tags:
      - Cessions
      description: Consulta a situação de uma cessão, retornando os identificadores (externo e interno) e o status atual. A busca é feita por query string, informando exatamente um entre `id` (identificador interno, gerado pela plataforma) e `externalId` (identificador externo, informado pelo parceiro). Ao consultar por identificador externo, é obrigatório informar o `fundTaxId` (CNPJ do fundo), pois o identificador externo só é único dentro de um mesmo fundo.
      parameters:
      - in: query
        name: id
        description: Identificador interno da cessão (gerado pela plataforma). Mutuamente exclusivo com `externalId`; informe exatamente um dos dois.
        required: false
        schema:
          type: string
          format: uuid
          example: 8bce6cfc-dcd4-473b-9fae-60ef3f60ec11
      - in: query
        name: externalId
        description: Identificador externo da cessão (informado pelo parceiro). Mutuamente exclusivo com `id`; informe exatamente um dos dois. Ao usar o identificador externo, informe também o `fundTaxId`.
        required: false
        schema:
          type: string
          example: REG-2024-000123
      - in: query
        name: fundTaxId
        description: CNPJ do fundo (somente dígitos). Obrigatório quando a consulta é feita pelo identificador externo, pois o identificador externo só é único dentro de um mesmo fundo.
        required: false
        schema:
          type: string
          example: '15996430000182'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  description: Envelope padrão de resposta da API
                  properties:
                    trackingId:
                      type: string
                      format: uuid
                      description: Identificador de rastreio da requisição (informe ao suporte em caso de problemas)
                      example: 8bce6cfc-dcd4-473b-9fae-60ef3f60ec11
                    succeeded:
                      type: boolean
                      description: Indica se a requisição foi bem-sucedida
                      example: true
                    message:
                      type: string
                      description: Mensagem geral da resposta
                      example: Request succeeded.
                    statusCode:
                      type: number
                      description: Código HTTP da resposta
                      example: 200
                    errors:
                      type: array
                      description: Lista de erros (vazia em caso de sucesso)
                      items:
                        type: object
                        properties:
                          code:
                            type: string
                            description: Código do erro (consulte a tabela de erros no guia da API)
                            example: CF-67
                          message:
                            type: string
                            description: Descrição do erro
                            example: The asset must be Eligible before creating a cession.
                          field:
                            type: string
                            nullable: true
                            description: Campo relacionado ao erro, quando aplicável
                            example: assetIds
                        title: ErrorSchema
                    data:
                      nullable: true
                      description: Dados da resposta (nulo em caso de erro)
                  title: ResponseEnvelopeSchema
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Identificador interno da cessão (gerado pela plataforma)
                          example: 8bce6cfc-dcd4-473b-9fae-60ef3f60ec11
                        externalId:
                          type: string
                          nullable: true
                          description: Identificador externo da cessão (informado pelo parceiro)
                          example: REG-2024-000123
                        status:
                          type: string
                          description: Status atual da cessão
                          example: Ceded
        '401':
          description: Não autorizado
        '404':
          description: Erro
          content:
            application/json:
              schema:
                type: object
                description: Envelope padrão de resposta de erro
                properties:
                  trackingId:
                    type: string
                    format: uuid
                    description: Identificador de rastreio da requisição
                    example: 8bce6cfc-dcd4-473b-9fae-60ef3f60ec11
                  succeeded:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unsuccessful request, see errors to get more details.
                  statusCode:
                    type: number
                    example: 422
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro (consulte a tabela de erros no guia da API)
                          example: CF-67
                        message:
                          type: string
                          description: Descrição do erro
                          example: The asset must be Eligible before creating a cession.
                        field:
                          type: string
                          nullable: true
                          description: Campo relacionado ao erro, quando aplicável
                          example: assetIds
                      title: ErrorSchema
                  data:
                    nullable: true
                    example: null
                title: ErrorEnvelopeSchema
      security:
      - oauth2:
        - empresas.btgpactual.com/crediflow
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/CrediFlow%20-%20Ativos%20e%20Cess%5Cxf5es/consultar-cessao
    post:
      tags:
      - Cessions
      description: Cria a cessão do ativo para o fundo, iniciando de forma assíncrona a precificação, elegibilidade, reserva de limite, envio do trade e desembolso (conforme a configuração do fundo). Informe exatamente um entre `asset` (cria o ativo e a cessão em etapa única) e `assetId` (ativo já criado e elegível).
      requestBody:
        description: Dados da cessão. Informe exatamente um entre `asset` e `assetId`.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                asset:
                  allOf:
                  - type: object
                    description: Dados do ativo (operação de crédito)
                    required:
                    - identification
                    - fundTaxId
                    - draweeIdentification
                    - assignorIdentification
                    - currency
                    - product
                    - operationType
                    - installments
                    properties:
                      identification:
                        type: string
                        description: Identificador externo do ativo, único por fundo. É a chave de idempotência da criação (junto com `fundTaxId`) e o valor usado depois para consultar o motivo de rejeição pela rota `operation-rejection-reason`
                        example: NOTA-2024-000123
                      fundTaxId:
                        type: string
                        description: CNPJ do fundo que receberá o ativo. Determina qual configuração de fundo será aplicada — ou seja, quais etapas de admissão e cessão serão executadas e com quais regras de validação
                        example: '15996430000182'
                      draweeIdentification:
                        type: string
                        description: CPF/CNPJ do sacado (devedor da operação). Na etapa de busca de contrapartes da admissão, esse documento é pesquisado no catálogo de participantes; se não for encontrado, o ativo é reprovado
                        example: '12345678000199'
                      assignorIdentification:
                        type: string
                        description: CPF/CNPJ do cedente (quem vende o ativo ao fundo). Também é validado na busca de contrapartes e usado como favorecido padrão do desembolso da cessão
                        example: '98765432000188'
                      currency:
                        type: string
                        description: Moeda da operação. Deve corresponder a um valor aceito pela plataforma
                        example: BRL
                      product:
                        type: string
                        description: Tipo de produto da operação. Define a natureza do ativo — recebível (ex. duplicata) ou empréstimo (ex. CCB) — o que muda os campos exigidos na validação (empréstimos exigem `contract` e `interestRate`). Produtos fora dessas duas categorias são rejeitados (erro CF-33)
                        example: CCB
                      operationType:
                        type: string
                        description: Tipo da operação de aquisição pretendida para o ativo (ex. cessão). Usado na validação e repassado no registro do trade
                        example: Cession
                      warrantiesId:
                        type: string
                        format: uuid
                        nullable: true
                        description: Identificador do pacote de garantias vinculado ao ativo, quando houver. As garantias são geridas em outro fluxo e apenas referenciadas aqui
                        example: 5f7d1c1e-3b2a-4c8d-9e6f-0a1b2c3d4e5f
                      fees:
                        type: array
                        nullable: true
                        description: Taxas cobradas na originação do ativo (ex. TAC). São consideradas na composição financeira da operação enviada ao registro
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              description: Categoria da taxa, conforme os tipos aceitos pela plataforma (ex. TAC). Valores fora da lista são reprovados na validação
                              example: Tac
                            amount:
                              type: number
                              description: Valor monetário da taxa. Deve ser maior ou igual a zero
                              example: 150
                          title: FeeSchema
                      genericIdentifiers:
                        type: array
                        nullable: true
                        description: Identificadores adicionais do ativo em sistemas do parceiro (ex. número da nota fiscal). Não afetam o processamento — servem para rastreio e conciliação
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              description: Categoria do identificador, conforme os tipos aceitos pela plataforma (ex. número de nota fiscal)
                              example: InvoiceNumber
                            value:
                              type: string
                              description: Valor do identificador no sistema de origem. Usado apenas para rastreio e conciliação
                              example: '000123456'
                          title: GenericIdentifierSchema
                      installments:
                        type: array
                        description: Cronograma de parcelas do ativo. É a base do fluxo de caixa da operação — usado na validação, na precificação da cessão e no cálculo do valor total do ativo
                        items:
                          type: object
                          properties:
                            number:
                              type: number
                              description: Número sequencial da parcela dentro do cronograma (maior que zero)
                              example: 1
                            maturityDate:
                              type: string
                              format: date-time
                              description: Data de vencimento da parcela. A maior data do cronograma define o vencimento final do ativo
                              example: '2024-12-01T00:00:00'
                            amount:
                              type: number
                              description: Valor de vencimento (face) da parcela, maior que zero. A soma das parcelas em aberto compõe o valor total do ativo usado na precificação
                              example: 1050
                            amortizationAmount:
                              type: number
                              nullable: true
                              description: Porção da parcela que corresponde a principal (amortização). Junto com juros e impostos, detalha a composição do valor de vencimento
                              example: 1000
                            interestAmount:
                              type: number
                              nullable: true
                              description: Porção da parcela que corresponde a juros
                              example: 45
                            taxAmount:
                              type: number
                              nullable: true
                              description: Porção da parcela que corresponde a impostos (ex. IOF)
                              example: 5
                            isPaid:
                              type: boolean
                              description: Indica se a parcela já foi liquidada pelo devedor. Parcelas pagas não entram no valor cedido — controlam também a obrigatoriedade de `paidAmount` e `paymentDate`
                              example: false
                            paidAmount:
                              type: number
                              nullable: true
                              description: Valor efetivamente pago da parcela. Obrigatório e maior que zero quando `isPaid` é true; deve ser nulo caso contrário
                              example: null
                            paymentDate:
                              type: string
                              format: date-time
                              nullable: true
                              description: Data em que o pagamento ocorreu. Obrigatória (e não futura) quando `isPaid` é true; deve ser nula caso contrário
                              example: null
                            startAccrual:
                              type: string
                              format: date-time
                              nullable: true
                              description: Início do período de incidência de juros (accrual) da parcela
                              example: '2024-06-01T00:00:00'
                            endAccrual:
                              type: string
                              format: date-time
                              nullable: true
                              description: Fim do período de incidência de juros (accrual) da parcela
                              example: '2024-12-01T00:00:00'
                            externalSettlement:
                              type: object
                              nullable: true
                              description: Instrução de como o devedor liquida esta parcela (Pix, boleto ou conta bancária). Direciona para onde o pagamento da parcela deve ser feito após a cessão
                              properties:
                                type:
                                  type: string
                                  description: Meio de liquidação da parcela. Determina qual dos demais campos deve ser preenchido
                                  example: Pix
                                bankAccount:
                                  type: object
                                  nullable: true
                                  description: Dados de conta bancária, usados como destino de pagamentos (liquidação de parcelas, desembolso da cessão ou liquidação da cessão, conforme o contexto)
                                  properties:
                                    number:
                                      type: string
                                      description: Número da conta, sem o dígito verificador
                                      example: '123456'
                                    digit:
                                      type: string
                                      description: Dígito verificador da conta
                                      example: '7'
                                    bankCode:
                                      type: string
                                      description: Código COMPE do banco (3 dígitos)
                                      example: '208'
                                    agency:
                                      type: string
                                      description: Número da agência, sem o dígito
                                      example: '0001'
                                    digitAgency:
                                      type: string
                                      nullable: true
                                      description: Dígito verificador da agência, quando houver
                                      example: '9'
                                  title: BankAccountSchema
                                pixEmv:
                                  type: string
                                  nullable: true
                                  description: Código EMV (copia-e-cola) do Pix, quando o meio de liquidação é Pix
                                  example: 00020126580014br.gov.bcb.pix...
                                bankslipBarCode:
                                  type: string
                                  nullable: true
                                  description: Código de barras do boleto, quando o meio de liquidação é boleto
                                  example: '20890001091000000024918026988206892410000024418'
                          title: InstallmentSchema
                      relatedOperations:
                        type: array
                        nullable: true
                        description: Referências a outras operações vinculadas a este ativo (ex. operação original em uma renegociação)
                        items:
                          type: object
                          properties:
                            positionDate:
                              type: string
                              format: date-time
                              description: Data da posição da operação relacionada
                              example: '2024-06-01T00:00:00'
                            identification:
                              type: string
                              description: Identificador externo da operação relacionada
                              example: NOTA-2024-000100
                      interestRate:
                        allOf:
                        - type: object
                          description: Estrutura de taxa de juros. Pode ser puramente fixa (`fixedInterestRate`), atrelada a um indexador (`variableInterestRate`) ou híbrida (fixa + indexador)
                          properties:
                            fixedInterestRate:
                              type: number
                              nullable: true
                              description: Componente fixo da taxa de juros, em percentual no período da base de accrual
                              example: 1.99
                            variableInterestRate:
                              type: object
                              nullable: true
                              description: Componente pós-fixado da taxa, atrelado a um indexador de mercado
                              properties:
                                indexType:
                                  type: string
                                  description: Indexador de mercado que corrige a taxa (ex. CDI)
                                  example: CDI
                                rateMultiplier:
                                  type: number
                                  description: Percentual aplicado sobre o indexador (ex. 110 = 110% do CDI). Deve ser maior que zero
                                  example: 110
                            baseDayCount:
                              type: string
                              nullable: true
                              description: Convenção de contagem de dias usada no accrual dos juros (ex. BUS252 = dias úteis, base 252)
                              example: BUS252
                          title: InterestRateSchema
                        nullable: true
                        description: Taxa de juros remuneratórios do ativo. Obrigatória para empréstimos; usada no accrual do contrato e repassada ao registro do trade
                      latePaymentInterest:
                        allOf:
                        - allOf:
                          - type: object
                            description: Estrutura de taxa de juros. Pode ser puramente fixa (`fixedInterestRate`), atrelada a um indexador (`variableInterestRate`) ou híbrida (fixa + indexador)
                            properties:
                              fixedInterestRate:
                                type: number
                                nullable: true
                                description: Componente fixo da taxa de juros, em percentual no período da base de accrual
                                example: 1.99
                              variableInterestRate:
                                type: object
                                nullable: true
                                description: Componente pós-fixado da taxa, atrelado a um indexador de mercado
                                properties:
                                  indexType:
                                    type: string
                                    description: Indexador de mercado que corrige a taxa (ex. CDI)
                                    example: CDI
                                  rateMultiplier:
                                    type: number
                                    description: Percentual aplicado sobre o indexador (ex. 110 = 110% do CDI). Deve ser maior que zero
                                    example: 110
                              baseDayCount:
                                type: string
                                nullable: true
                                description: Convenção de contagem de dias usada no accrual dos juros (ex. BUS252 = dias úteis, base 252)
                                example: BUS252
                            title: InterestRateSchema
                          type: object
                          description: Encargos aplicados quando o devedor atrasa o pagamento — estende a estrutura de taxa de juros (taxa de atraso e indexador) e acrescenta mora e multa
                          properties:
                            arrearsAmount:
                              type: number
                              nullable: true
                              description: Percentual de juros de mora incidente por atraso, aplicado pro-rata sobre o valor em aberto
                              example: 1
                            penaltyAmount:
                              type: number
                              nullable: true
                              description: Percentual de multa aplicado uma única vez sobre o valor em aberto quando a parcela atrasa
                              example: 2
                          title: LatePaymentInterestSchema
                        nullable: true
                        description: Encargos aplicáveis em caso de atraso do devedor (taxa de atraso, mora e multa). Não afetam o preço da cessão — definem como o ativo remunera após o vencimento
                      contract:
                        type: object
                        nullable: true
                        description: Dados do contrato que formaliza a operação. Obrigatório para empréstimos (ex. CCB); não se aplica a recebíveis
                        properties:
                          number:
                            type: string
                            description: Número do contrato formalizado
                            example: 6764459321/EP
                          formalizationDate:
                            type: string
                            format: date-time
                            description: Data em que o contrato foi formalizado/assinado
                            example: '2024-05-15T00:00:00'
                          emissionType:
                            type: string
                            description: Forma de emissão do contrato (ex. digital ou física), relevante para o registro
                            example: Digital
                    title: AssetPayloadSchema
                  description: Dados completos do ativo, para criação de ativo e cessão em etapa única. Mutuamente exclusivo com `assetId`.
                assetId:
                  type: string
                  format: uuid
                  description: Identificador de um ativo já criado e elegível. Mutuamente exclusivo com `asset`.
                  example: 0524b1ed-6a78-4f00-8394-543ffcd188f0
                terms:
                  type: object
                  description: Termos comerciais da cessão — definem por quanto o ativo é comprado, onde a operação é registrada e como o dinheiro chega ao cedente
                  required:
                  - register
                  - purchaseInformation
                  properties:
                    register:
                      type: object
                      description: Dados do registro da cessão na registradora. Enviados no trade para formalizar a operação
                      properties:
                        identification:
                          type: string
                          description: Identificação da cessão perante a registradora
                          example: REG-2024-000123
                        repository:
                          type: string
                          description: Registradora onde a cessão será registrada (ex. CERC)
                          example: CERC
                    purchaseInformation:
                      type: object
                      description: Condições de compra do ativo pelo fundo. É a base da etapa de precificação e da reserva de limite
                      properties:
                        amount:
                          type: number
                          description: Preço de aquisição do ativo (valor que o fundo paga ao cedente), maior que zero. É o valor reservado no limite do fundo e conferido contra o total dos desembolsos
                          example: 9850
                        interestRate:
                          allOf:
                          - type: object
                            description: Estrutura de taxa de juros. Pode ser puramente fixa (`fixedInterestRate`), atrelada a um indexador (`variableInterestRate`) ou híbrida (fixa + indexador)
                            properties:
                              fixedInterestRate:
                                type: number
                                nullable: true
                                description: Componente fixo da taxa de juros, em percentual no período da base de accrual
                                example: 1.99
                              variableInterestRate:
                                type: object
                                nullable: true
                                description: Componente pós-fixado da taxa, atrelado a um indexador de mercado
                                properties:
                                  indexType:
                                    type: string
                                    description: Indexador de mercado que corrige a taxa (ex. CDI)
                                    example: CDI
                                  rateMultiplier:
                                    type: number
                                    description: Percentual aplicado sobre o indexador (ex. 110 = 110% do CDI). Deve ser maior que zero
                                    example: 110
                              baseDayCount:
                                type: string
                                nullable: true
                                description: Convenção de contagem de dias usada no accrual dos juros (ex. BUS252 = dias úteis, base 252)
                                example: BUS252
                            title: InterestRateSchema
                          nullable: true
                          description: Taxa de desconto/remuneração da compra, usada na precificação da cessão
                    disbursements:
                      type: array
                      nullable: true
                      description: Instruções de pagamento ao(s) favorecido(s) da cessão. Quando o fundo realiza o desembolso, são obrigatórias e a data não pode estar no passado — a soma dos valores deve corresponder ao valor de compra. Quando o desembolso ocorre fora da plataforma, a data deve estar no passado (registro do que já foi pago)
                      items:
                        type: object
                        properties:
                          taxId:
                            type: string
                            description: CPF/CNPJ do favorecido que receberá o desembolso (normalmente o cedente)
                            example: '98765432000188'
                          amount:
                            type: number
                            nullable: true
                            description: Valor a ser desembolsado para este favorecido, maior que zero. A soma dos desembolsos é conferida contra o valor de compra da cessão
                            example: 9850
                          date:
                            type: string
                            format: date-time
                            description: Data em que o desembolso deve ocorrer (ou ocorreu, quando fora da plataforma). Em grupos de desembolso, o pagamento é liberado em lote quando o grupo é liberado
                            example: '2024-06-03T00:00:00'
                          bankAccount:
                            allOf:
                            - type: object
                              nullable: true
                              description: Dados de conta bancária, usados como destino de pagamentos (liquidação de parcelas, desembolso da cessão ou liquidação da cessão, conforme o contexto)
                              properties:
                                number:
                                  type: string
                                  description: Número da conta, sem o dígito verificador
                                  example: '123456'
                                digit:
                                  type: string
                                  description: Dígito verificador da conta
                                  example: '7'
                                bankCode:
                                  type: string
                                  description: Código COMPE do banco (3 dígitos)
                                  example: '208'
                                agency:
                                  type: string
                                  description: Número da agência, sem o dígito
                                  example: '0001'
                                digitAgency:
                                  type: string
                                  nullable: true
                                  description: Dígito verificador da agência, quando houver
                                  example: '9'
                              title: BankAccountSchema
                            description: Conta bancária de destino do desembolso (inclui também `accountType`, o tipo da conta — ex. conta corrente ou poupança). Pode ser enriquecida automaticamente com dados cadastrais do favorecido
                    settlement:
                      type: object
                      nullable: true
                      description: Instrução de liquidação financeira da cessão em si (como o valor transita entre as partes)
                      properties:
                        type:
                          type: string
                          description: Meio de liquidação da cessão (ex. TED)
                          example: Ted
                        bankAccount:
                          type: object
                          nullable: true
                          description: Dados de conta bancária, usados como destino de pagamentos (liquidação de parcelas, desembolso da cessão ou liquidação da cessão, conforme o contexto)
                          properties:
                            number:
                              type: string
                              description: Número da conta, sem o dígito verificador
                              example: '123456'
                            digit:
                              type: string
                              description: Dígito verificador da conta
                              example: '7'
                            bankCode:
                              type: string
                              description: Código COMPE do banco (3 dígitos)
                              example: '208'
                            agency:
                              type: string
                              description: Número da agência, sem o dígito
                              example: '0001'
                            digitAgency:
                              type: string
                              nullable: true
                              description: Dígito verificador da agência, quando houver
                              example: '9'
                          title: BankAccountSchema
                    fees:
                      type: array
                      nullable: true
                      description: Taxas cobradas na operação de cessão (distintas das taxas do ativo). Impactam o valor líquido da operação
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            description: Categoria da taxa, conforme os tipos aceitos pela plataforma (ex. TAC). Valores fora da lista são reprovados na validação
                            example: Tac
                          amount:
                            type: number
                            description: Valor monetário da taxa. Deve ser maior ou igual a zero
                            example: 150
                        title: FeeSchema
                    genericIdentifiers:
                      type: array
                      nullable: true
                      description: Identificadores adicionais da cessão em sistemas do parceiro, para rastreio e conciliação
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            description: Categoria do identificador, conforme os tipos aceitos pela plataforma (ex. número de nota fiscal)
                            example: InvoiceNumber
                          value:
                            type: string
                            description: Valor do identificador no sistema de origem. Usado apenas para rastreio e conciliação
                            example: '000123456'
                        title: GenericIdentifierSchema
                  title: CessionTermsSchema
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                description: Envelope padrão de resposta da API
                properties:
                  trackingId:
                    type: string
                    format: uuid
                    description: Identificador de rastreio da requisição (informe ao suporte em caso de problemas)
                    example: 8bce6cfc-dcd4-473b-9fae-60ef3f60ec11
                  succeeded:
                    type: boolean
                    description: Indica se a requisição foi bem-sucedida
                    example: true
                  message:
                    type: string
                    description: Mensagem geral da resposta
                    example: Request succeeded.
                  statusCode:
                    type: number
                    description: Código HTTP da resposta
                    example: 200
                  errors:
                    type: array
                    description: Lista de erros (vazia em caso de sucesso)
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro (consulte a tabela de erros no guia da API)
                          example: CF-67
                        message:
                          type: string
                          description: Descrição do erro
                          example: The asset must be Eligible before creating a cession.
                        field:
                          type: string
                          nullable: true
                          description: Campo relacionado ao erro, quando aplicável
                          example: assetIds
                      title: ErrorSchema
                  data:
                    nullable: true
                    description: Dados da resposta (nulo em caso de erro)
                title: ResponseEnvelopeSchema
        '400':
          description: Erro
          content:
            application/json:
              schema:
                type: object
                description: Envelope padrão de resposta de erro
                properties:
                  trackingId:
                    type: string
                    format: uuid
                    description: Identificador de rastreio da requisição
                    example: 8bce6cfc-dcd4-473b-9fae-60ef3f60ec11
                  succeeded:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unsuccessful request, see errors to get more details.
                  statusCode:
                    type: number
                    example: 422
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro (consulte a tabela de erros no guia da API)
                          example: CF-67
                        message:
                          type: string
                          description: Descrição do erro
                          example: The asset must be Eligible before creating a cession.
                        field:
                          type: string
                          nullable: true
                          description: Campo relacionado ao erro, quando aplicável
                          example: assetIds
                      title: ErrorSchema
                  data:
                    nullable: true
                    example: null
                title: ErrorEnvelopeSchema
        '401':
          description: Não autorizado
        '422':
          description: Erro
          content:
            application/json:
              schema:
                type: object
                description: Envelope padrão de resposta de erro
                properties:
                  trackingId:
                    type: string
                    format: uuid
                    description: Identificador de rastreio da requisição
                    example: 8bce6cfc-dcd4-473b-9fae-60ef3f60ec11
                  succeeded:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unsuccessful request, see errors to get more details.
                  statusCode:
                    type: number
                    example: 422
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro (consulte a tabela de erros no guia da API)
                          example: CF-67
                        message:
                          type: string
                          description: Descrição do erro
                          example: The asset must be Eligible before creating a cession.
                        field:
                          type: string
                          nullable: true
                          description: Campo relacionado ao erro, quando aplicável
                          example: assetIds
                      title: ErrorSchema
                  data:
                    nullable: true
                    example: null
                title: ErrorEnvelopeSchema
      security:
      - oauth2:
        - empresas.btgpactual.com/crediflow
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/CrediFlow%20-%20Ativos%20e%20Cess%5Cxf5es/criar-cessao
  /fidc/v1/disbursement-groups:
    get:
      tags:
      - DisbursementGroups
