    post:
      tags:
      - DisbursementGroups
      description: Cria um único grupo de desembolso a partir de um identificador externo e de uma lista de ativos. Todos os ativos enviados devem ter o mesmo sacado, o mesmo cedente, o mesmo fundo e a mesma data de desembolso; caso algum ativo divirja, a requisição é recusada com 400 e nenhum grupo é criado. Para criar vários grupos, faça uma chamada por grupo, cada uma com o seu próprio `externalId`. Os ativos agrupados têm seus desembolsos liberados em lote quando o grupo é liberado. A data de desembolso e a conta bancária de destino são opcionais; quando informadas, definem quando o pagamento em lote deve ocorrer e para qual conta.
      requestBody:
        description: Dados do grupo de desembolso a ser criado
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - externalId
              - assetIds
              properties:
                externalId:
                  type: string
                  format: uuid
                  description: Identificador externo do grupo, definido pelo parceiro. Usado depois para consultar o grupo gerado. Cada identificador externo corresponde a exatamente um grupo interno
                  example: bb9d844c-8041-464c-b160-471d437231d6
                disbursementDate:
                  type: string
                  format: date-time
                  nullable: true
                  description: Data em que o desembolso em lote deve ocorrer. Opcional; quando omitida, o grupo é criado sem data agendada
                  example: '2024-06-03T00:00:00'
                bankAccount:
                  allOf:
                  - type: object
                    nullable: true
                    description: Dados de conta bancária, usados como destino de pagamentos (liquidação de parcelas, desembolso da cessão ou liquidação da cessão, conforme o contexto)
                    properties:
                      number:
                        type: string
                        description: Número da conta, sem o dígito verificador
                        example: '123456'
                      digit:
                        type: string
                        description: Dígito verificador da conta
                        example: '7'
                      bankCode:
                        type: string
                        description: Código COMPE do banco (3 dígitos)
                        example: '208'
                      agency:
                        type: string
                        description: Número da agência, sem o dígito
                        example: '0001'
                      digitAgency:
                        type: string
                        nullable: true
                        description: Dígito verificador da agência, quando houver
                        example: '9'
                    title: BankAccountSchema
                  nullable: true
                  description: Conta bancária de destino do desembolso do grupo — mesma estrutura usada nos desembolsos da cessão. Opcional; quando omitida, vale a conta já definida para o desembolso
                assetIds:
                  type: array
                  description: Identificadores dos ativos que compõem o grupo (mínimo 1, cada um deve ser um identificador válido). Todos os ativos devem compartilhar o mesmo sacado, o mesmo cedente, o mesmo fundo e a mesma data de desembolso; ativos divergentes resultam em 400
                  items:
                    type: string
                    format: uuid
                    example: 0524b1ed-6a78-4f00-8394-543ffcd188f0
      responses:
        '200':
          description: Grupo de desembolso criado
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  description: Envelope padrão de resposta da API
                  properties:
                    trackingId:
                      type: string
                      format: uuid
                      description: Identificador de rastreio da requisição (informe ao suporte em caso de problemas)
