                            example: 8bce6cfc-dcd4-473b-9fae-60ef3f60ec11
                          status:
                            type: string
                            description: Status atual do grupo de desembolso, que indica em que ponto do fluxo ele está (ex. recém-criado e ainda não liberado)
                            example: Created
                          assetIds:
                            type: array
                            description: Identificadores dos ativos que compõem o grupo. Definem quais desembolsos serão liberados juntos quando o grupo for liberado
                            items:
                              type: string
                              format: uuid
                              example: 0524b1ed-6a78-4f00-8394-543ffcd188f0
                        title: DisbursementGroupSummarySchema
        '400':
