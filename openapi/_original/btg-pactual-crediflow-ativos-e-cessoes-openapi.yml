                      title: ErrorSchema
                  data:
                    nullable: true
                    example: null
                title: ErrorEnvelopeSchema
        '401':
          description: Não autorizado
        '422':
          description: Erro
          content:
            application/json:
              schema:
                type: object
                description: Envelope padrão de resposta de erro
                properties:
                  trackingId:
