    get:
      tags:
      - Link de Pagamento Recorrente
      description: 'API responsável por listar os ciclos de um link de pagamento recorrente. O recurso é restrito ao beneficiário autenticado — recorrências de outros beneficiários resultam em `404`. A paginação é cursor-based: quando existe página seguinte, o campo `_links.next` traz o cursor codificado com os filtros ativos.'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
          example: 019c8c26-ed76-7116-a333-d30ec882493e
