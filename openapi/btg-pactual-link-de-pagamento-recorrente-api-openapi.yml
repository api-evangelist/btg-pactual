        name: pageSize
        description: Quantidade de registros por página. Não obrigatório quando um `cursor` válido é enviado.
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 3000
          example: 10
          description: Quantidade de registros por página
          title: PageSize
      - in: query
        name: pageNumber
        description: Número da página. Não obrigatório quando um `cursor` válido é enviado.
        required: true
        schema:
          type: integer
          minimum: 1
          example: 1
          description: Número da página
          title: PageNumber
      - in: query
        name: status
        required: false
        description: 'Lista de status de ciclo separados por vírgula. Ex.: `SCHEDULED,ACTIVE`.'
