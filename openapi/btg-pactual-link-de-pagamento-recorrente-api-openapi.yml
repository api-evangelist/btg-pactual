openapi: 3.2.0
info:
  description: API responsável por gerenciar links de pagamento recorrentes via Developers. Uma recorrência gera automaticamente um novo link de pagamento a cada ciclo periódico e expõe uma URL pública única e estável para o pagador.
  version: 1.0.0
  title: Banking - PaymentLinkRec Link de Pagamento Recorrente API
servers:
- url: https://api.sandbox.empresas.btgpactual.com
  description: Sandbox
- url: https://api.empresas.btgpactual.com
  description: Produção
tags:
- name: Link de Pagamento Recorrente
paths:
  /{companyId}/banking/payment-link/recurrence/{id}:
    put:
      tags:
      - Link de Pagamento Recorrente
      description: API responsável por atualizar as configurações de um link de pagamento recorrente. Permitido apenas nos status `ACTIVE` e `PAUSED`, e as alterações afetam somente ciclos futuros — o link de pagamento do ciclo corrente permanece inalterado.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
          example: 019c8c26-ed76-7116-a333-d30ec882493e
          description: Identificador do link de pagamento recorrente
          title: PaymentLinkRecurrenceId
      - name: companyId
        in: path
        required: true
        description: Identificador da empresa, validado pelo portal Developers
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - period
              - paymentMethods
              - notifications
              - amount
              description: Alterações afetam apenas ciclos futuros. Permitido somente nos status `ACTIVE` e `PAUSED`.
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: Assinatura Mensal
                  description: Nome da recorrência. Não pode conter URLs.
                  title: RecurrenceName
                period:
                  type: string
                  enum:
                  - WEEKLY
                  - MONTHLY
                  - QUARTERLY
                  - SEMI_ANNUALLY
                  - ANNUALLY
                  example: MONTHLY
                  description: Periodicidade de geração dos ciclos
                  title: RecurrencePeriod
                paymentMethods:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum:
                    - BANKSLIP
                    - IMMEDIATE_QRCODE
                    - CREDIT_CARD
                  example:
                  - BANKSLIP
                  - IMMEDIATE_QRCODE
                  description: Métodos de pagamento permitidos nos links gerados
                  title: PaymentMethods
                notifications:
                  type: object
                  properties:
                    deliveryMediums:
                      type: array
                      items:
                        type: string
                        enum:
                        - Sms
                        - Email
                        - Push
                      example:
                      - Email
                      description: Meios de notificação
                      title: DeliveryMediums
                    email:
                      type: string
                      format: email
                      example: exemplo@btgpactual.com
                      title: Email
                    phone:
                      type: string
                      example: '11912345678'
                      title: PhoneNumber
                  description: Configuração de notificação enviada ao pagador em cada ciclo. `email` é obrigatório quando `deliveryMediums` contém `Email` ou `Push`; `phone` é obrigatório quando contém `Sms`.
                  title: Notifications
                amount:
                  type: number
                  example: 99.9
                  description: Valor cobrado em cada ciclo da recorrência. Para `CREDIT_CARD`, mínimo de 5 e máximo de 999999.99.
                  title: Amount
                description:
                  type: string
                  maxLength: 100
                  example: Plano mensal de serviços
                  description: Descrição da recorrência
                  title: Description
                numberOfCycles:
                  allOf:
                  - type: integer
                    minimum: 1
                    example: 12
                    description: Critério de término por quantidade de ciclos. Opcional — quando omitido junto de `endDate`, a recorrência é indeterminada.
                    title: NumberOfCycles
                  description: Critério de término por quantidade de ciclos. Envie `null` para remover o critério.
                endDate:
                  allOf:
                  - type: string
                    format: date
                    example: '2026-07-01'
                    description: Data no formato YYYY-MM-DD
                    title: Date
                  description: Critério de término por data. Não pode ser no passado. Envie `null` para remover o critério.
                maxInstallments:
                  type: integer
                  minimum: 1
                  maximum: 24
                  example: 3
                  description: Número máximo de parcelas no cartão de crédito, de 1 a 24. Obrigatório quando `paymentMethods` inclui `CREDIT_CARD`, proibido caso contrário. Cada parcela deve ter no mínimo R$ 5,00.
                  title: MaxInstallments
                transferCardFeesToPayer:
                  type: boolean
                  example: false
                  description: Repassa o custo da transação por cartão ao pagador. Obrigatório quando `paymentMethods` inclui `CREDIT_CARD`, proibido caso contrário.
                  title: TransferCardFeesToPayer
              title: UpdatePaymentLinkRecurrenceRequest
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentLinkRecurrenceId:
                    type: string
                    format: uuid
                    example: 019c8c26-ed76-7116-a333-d30ec882493e
                    description: Identificador do link de pagamento recorrente
                    title: PaymentLinkRecurrenceId
                  name:
                    type: string
                    maxLength: 100
                    example: Assinatura Mensal
                    description: Nome da recorrência. Não pode conter URLs.
                    title: RecurrenceName
                  status:
                    type: string
                    enum:
                    - ACTIVE
                    - PAUSED
                    - CANCELED
                    - FINISHED
                    example: ACTIVE
                    description: Status da recorrência
                    title: RecurrenceStatus
                  period:
                    type: string
                    enum:
                    - WEEKLY
                    - MONTHLY
                    - QUARTERLY
                    - SEMI_ANNUALLY
                    - ANNUALLY
                    example: MONTHLY
                    description: Periodicidade de geração dos ciclos
                    title: RecurrencePeriod
                  paymentMethods:
                    type: array
                    minItems: 1
                    items:
                      type: string
                      enum:
                      - BANKSLIP
                      - IMMEDIATE_QRCODE
                      - CREDIT_CARD
                    example:
                    - BANKSLIP
                    - IMMEDIATE_QRCODE
                    description: Métodos de pagamento permitidos nos links gerados
                    title: PaymentMethods
                  notifications:
                    type: object
                    properties:
                      deliveryMediums:
                        type: array
                        items:
                          type: string
                          enum:
                          - Sms
                          - Email
                          - Push
                        example:
                        - Email
                        description: Meios de notificação
                        title: DeliveryMediums
                      email:
                        type: string
                        format: email
                        example: exemplo@btgpactual.com
                        title: Email
                      phone:
                        type: string
                        example: '11912345678'
                        title: PhoneNumber
                    description: Configuração de notificação enviada ao pagador em cada ciclo. `email` é obrigatório quando `deliveryMediums` contém `Email` ou `Push`; `phone` é obrigatório quando contém `Sms`.
                    title: Notifications
                  startDate:
                    type: string
                    format: date
                    example: '2026-07-01'
                    description: Data no formato YYYY-MM-DD
                    title: Date
                  createdAt:
                    type: string
                    format: date-time
                    example: '2026-07-01T00:00:00.000Z'
                    title: DateTime
                  updatedAt:
                    type: string
                    format: date-time
                    example: '2026-07-01T00:00:00.000Z'
                    title: DateTime
                  payer:
                    type: object
                    properties:
                      name:
                        type: string
                        example: João Silva
                      personType:
                        type: string
                        enum:
                        - F
                        - J
                        example: J
                        description: 'Tipo de pessoa: física (F) ou jurídica (J)'
                        title: PersonType
                      taxId:
                        type: string
                        example: '37297902000141'
                        description: Documento (CPF ou CNPJ) sem formatação
                        title: TaxId
                      email:
                        type: string
                        format: email
                        example: exemplo@btgpactual.com
                        title: Email
                      phoneNumber:
                        type: string
                        example: '11912345678'
                        title: PhoneNumber
                      deliveryMediums:
                        type: array
                        items:
                          type: string
                          enum:
                          - Sms
                          - Email
                          - Push
                        example:
                        - Email
                        description: Meios de notificação
                        title: DeliveryMediums
                      address:
                        type: object
                        required:
                        - city
                        - state
                        - street
                        - zipCode
                        - number
                        - neighborhood
                        properties:
                          city:
                            type: string
                            example: São Paulo
                          state:
                            type: string
                            example: SP
                          street:
                            type: string
                            example: Faria Lima
                          zipCode:
                            type: string
                            example: '06312412'
                          number:
                            type: string
                            example: '123'
                          neighborhood:
                            type: string
                            example: Itaim Bibi
                          complement:
                            type: string
                            example: Sala 12
                        description: Endereço
                        title: Address
                    description: Pagador da recorrência
                    title: PayerResponse
                  account:
                    type: object
                    required:
                    - number
                    - branch
                    properties:
                      number:
                        type: string
                        example: '12345'
                        description: Número da conta do beneficiário
                      branch:
                        type: string
                        example: '0001'
                        description: Agência do beneficiário
                    description: Conta do beneficiário que receberá os pagamentos
                    title: Account
                  hasOverdueCycles:
                    type: boolean
                    example: false
                    description: Indica se a recorrência possui ciclos em atraso
                  linkUrl:
                    type: string
                    example: https://links.btgpactual.com/abc123
                    description: URL pública única e estável da recorrência. Sempre resolve para o link de pagamento do ciclo corrente.
                    title: LinkUrl
                  amount:
                    type: number
                    example: 99.9
                    description: Valor cobrado em cada ciclo da recorrência. Para `CREDIT_CARD`, mínimo de 5 e máximo de 999999.99.
                    title: Amount
                  description:
                    type: string
                    maxLength: 100
                    example: Plano mensal de serviços
                    description: Descrição da recorrência
                    title: Description
                  numberOfCycles:
                    type: integer
                    minimum: 1
                    example: 12
                    description: Critério de término por quantidade de ciclos. Opcional — quando omitido junto de `endDate`, a recorrência é indeterminada.
                    title: NumberOfCycles
                  endDate:
                    type: string
                    format: date
                    example: '2026-07-01'
                    description: Data no formato YYYY-MM-DD
                    title: Date
                  missedCyclesCount:
                    type: integer
                    example: 0
                    description: Quantidade de ciclos que deixaram de ser gerados durante a pausa
                  maxInstallments:
                    type: integer
                    minimum: 1
                    maximum: 24
                    example: 3
                    description: Número máximo de parcelas no cartão de crédito, de 1 a 24. Obrigatório quando `paymentMethods` inclui `CREDIT_CARD`, proibido caso contrário. Cada parcela deve ter no mínimo R$ 5,00.
                    title: MaxInstallments
