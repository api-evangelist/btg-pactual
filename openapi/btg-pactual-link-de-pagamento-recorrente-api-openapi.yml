        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - SCHEDULED
            - ACTIVE
            - PAID
            - EXPIRED
            - CANCELED
            - REACTIVATED
            example: ACTIVE
            description: Status do ciclo da recorrência
            title: RecurrenceCycleStatus
      - in: query
        name: payer.name
        required: false
        description: Filtro parcial (case-insensitive) pelo nome do pagador do ciclo.
        schema:
          type: string
          example: João da Silva
      - in: query
        name: minEndAt
        required: false
        description: Data inicial (inclusive) de término do ciclo, no formato `YYYY-MM-DD`.
        schema:
          type: string
          format: date
          example: '2026-07-01'
          description: Data no formato YYYY-MM-DD
          title: Date
      - in: query
        name: maxEndAt
        required: false
        description: Data final (inclusive) de término do ciclo, no formato `YYYY-MM-DD`.
        schema:
          type: string
          format: date
          example: '2026-07-01'
          description: Data no formato YYYY-MM-DD
          title: Date
      - in: query
        name: cycleNumber
        required: false
        description: Filtra pelo número exato do ciclo.
        schema:
          type: integer
          minimum: 1
          example: 3
      - in: query
        name: minAmount
        required: false
        description: Valor mínimo (inclusive) do valor do link de pagamento do ciclo.
        schema:
          type: number
          example: 99.9
      - in: query
        name: maxAmount
        required: false
        description: Valor máximo (inclusive) do valor do link de pagamento do ciclo.
        schema:
          type: number
          example: 199.9
      - in: query
        name: cursor
        description: Cursor opaco devolvido em `_links.next`/`_links.previous`. Quando presente, os demais parâmetros são preenchidos pelo cursor decodificado.
        required: false
        schema:
          type: string
          example: eyJwYWdlU2l6ZSI6IjEwIiwicGFnZU51bWJlciI6IjIifQ==
      - name: companyId
        in: path
