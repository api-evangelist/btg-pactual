openapi: 3.2.0
info:
  title: Banking - Payments Lote de Pagamentos API
  version: '1'
  description: Endpoints das APIs de banking do BTG PACTUAL Empresas
  termsOfService: https://www.btgpactual.com/empresas/termos-e-politicas/
servers:
- url: https://api.sandbox.empresas.btgpactual.com
  description: sandbox
- url: https://api.empresas.btgpactual.com
  description: produção
tags:
- name: Lote de Pagamentos
paths:
  /{companyId}/banking/batch-payments/{batchId}:
    delete:
      tags:
      - Lote de Pagamentos
      description: Abandonar Lote
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      - name: batchId
        schema:
          type: string
          description: Id do lote
          example: 829c47f2-3b5c-4103-8d15-a55bd66ae905
          title: BatchId
        in: path
        required: true
      responses:
        '200':
          description: Lote abandonado
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - openid empresas.btgpactual.com/payments
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Payments/abandonar-lote
      summary: Delete by company id banking batch payments by batch id
      x-summary-source: derived
      operationId: deleteByCompanyIdBankingBatchPaymentsByBatchId
      x-operation-id-source: derived
    patch:
      tags:
      - Lote de Pagamentos
      description: Processar Lote
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      - name: batchId
        schema:
          type: string
          description: Id do lote
          example: 829c47f2-3b5c-4103-8d15-a55bd66ae905
          title: BatchId
        in: path
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isFinished:
                  type: boolean
                  description: Sinalizados de finalizador da transação
                  example: true
              title: BatchPatchBody
        required: true
      responses:
        '202':
          description: Lote finalizado
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - openid empresas.btgpactual.com/payments
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Payments/processar-lote
      summary: Update by company id banking batch payments by batch id
      x-summary-source: derived
      operationId: patchByCompanyIdBankingBatchPaymentsByBatchId
      x-operation-id-source: derived
  /{companyId}/banking/batch-payments:
    post:
      tags:
      - Lote de Pagamentos
      description: Abrir Lote
      parameters:
      - name: companyId
        schema:
          description: CNPJ da empresa realizando a requisição.
          type: string
          example: '30306294000145'
          title: CompanyId
        in: path
        required: true
      requestBody:
        content:
          application/json:
            schema:
              required:
              - taxId
              type: object
              properties:
                taxId:
                  type: string
                  description: CNPJ
                  example: '46786961000174'
              title: BatchPostBody
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  batchId:
                    type: string
                    description: Id do lote
                    example: 829c47f2-3b5c-4103-8d15-a55bd66ae905
                    title: BatchId
                  expiresAt:
                    type: string
                    description: Data de expiração do lote
                    example: '2024-11-22T19:18:18.233Z'
                  maxSize:
                    type: integer
                    description: Tamanho máximo do lote
                    example: 200
                  taxId:
                    type: string
                    description: CNPJ
                    example: '46786961000174'
                title: BatchPostResponse
          description: Iniciação de Pagamento
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - openid empresas.btgpactual.com/payments
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Banking%20-%20Payments/abrir-lote
      summary: Create by company id banking batch payments
      x-summary-source: derived
      operationId: postByCompanyIdBankingBatchPayments
      x-operation-id-source: derived
components:
  securitySchemes:
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: https://id.sandbox.btgpactual.com/oauth2/authorize
          tokenUrl: https://id.sandbox.btgpactual.com/oauth2/token
          scopes:
            openid: Consultar seu perfil BTG Id
            empresas.btgpactual.com/pix-cash-in: Consultar Pix Cobrança. Emitir Pix Cobrança.
            empresas.btgpactual.com/pix-cash-in.readonly: Consultar Pix Cobrança.
      type: oauth2
