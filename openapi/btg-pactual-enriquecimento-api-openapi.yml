openapi: 3.2.0
info:
  description: API implementada pelo parceiro que utilizaremos para buscar informações de nossos clientes em comum dentro da jornada de Onboarding.
  version: 1.0.0
  title: Onboarding Enriquecimento API
servers:
- url: https://api.sandbox.empresas.btgpactual.com
  description: Sandbox
- url: https://api.uat.empresas.btgpactual.com
  description: UAT
- url: https://api.empresas.btgpactual.com
  description: Production
tags:
- name: Enriquecimento
paths:
  /apps/{clientId}/.well-known/customers/{taxId}:
    get:
      tags:
      - Enriquecimento
      description: Obter informações básicas da empresa cliente no parceiro
      parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          example: '00000000000125'
          title: ClientId
      - name: taxId
        in: path
        required: true
        schema:
          type: string
          minLength: 11
          maxLength: 14
          pattern: ^[0-9]{11}|[0-9]{14}$
          example: '00000000000125'
          title: TaxId
      - name: x-correlation-id
        in: header
        description: Cabeçalho para correlação de logs
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json-CustomerInfo:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: EMPRESA SANDBOX
                  legalNature:
                    type: string
                    example: EI
                  email:
                    type: string
                    example: sandbox@btgpactual.com
                  phoneNumber:
                    type: string
                    example: '5511000000002'
                  patrimonyAmount:
                    type: number
                    example: 0.01
                    title: Money
                  yearlyIncomeAmount:
                    type: number
                    example: 0.01
                    title: Money
                  monthlyAvgRevenueAmount:
                    type: number
                    example: 0.01
                    title: Money
                title: Customer
            application/json-NaturalPersonInfo:
              schema:
                type: object
                properties:
                  generalData:
                    type: object
                    properties:
                      taxId:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                    title: GeneralData
                  address:
                    type: object
                    properties:
                      type:
                        type: string
                        example: COMERCIAL
                        enum:
                        - RESIDENCIAL
                        - COMERCIAL
                        - OUTROS
                        - NATURALIDADE
                      zipCode:
                        type: string
                        example: '00000001'
                      country:
                        type: string
                        example: BR
                      state:
                        type: string
                        example: SP
                      city:
                        type: string
                        example: SAO PAULO
                      street:
                        type: string
                        example: RUA SANDBOX
                      number:
                        type: string
                        example: '369'
                      complement:
                        type: string
                        example: null
                      neighborhood:
                        type: string
                        example: BAIRRO SANDBOX
                    title: Address
                  additionalData:
                    type: object
                    properties:
                      birthState:
                        type: string
                      birthCity:
                        type: string
                      maritalStatus:
                        type: string
                        enum:
                        - CONTRATO_SOCIAL
                        - PROCURACAO
                        - ESTATUTO_SOCIAL
                        - REQUERIMENTO_EMPRESARIO
                        - BALANCO_DRE
                        - ATA_ELEICAO_DIRETORIA
                        - QUADRO_SOCIETARIO
                        - DOCUMENTO_FINANCEIRO
                        - CCMEI
                        - CARTA_APROVACAO_CONCURSO
                      spouse:
                        type: object
                        properties:
                          name:
                            type: string
                          taxId:
                            type: string
                    title: AdditionalData
                  complementaryData:
                    type: object
                    properties:
                      profession:
                        type: number
                      annualIncome:
                        type: number
                      totalAssets:
                        type: number
                    title: ComplementaryData
                title: NaturalPerson
      security:
      - BearerAuth: []
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Onboarding/obter-informacoes-basicas-da-empresa-cliente-no-parceiro
      summary: Get apps by client id well known customers by tax id
      x-summary-source: derived
      operationId: getAppsByClientIdWellKnownCustomersByTaxId
      x-operation-id-source: derived
  /apps/{clientId}/.well-known/customers/{taxId}/addresses:
    get:
      tags:
      - Enriquecimento
      description: Obter o endereço informações da empresa cliente no parceiro
      parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          example: '00000000000125'
          title: ClientId
      - name: taxId
        in: path
        required: true
        schema:
          type: string
          minLength: 11
          maxLength: 14
          pattern: ^[0-9]{11}|[0-9]{14}$
          example: '00000000000125'
          title: TaxId
      - name: x-correlation-id
        in: header
        description: Cabeçalho para correlação de logs
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Endereços da empresa cliente recuperada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: COMERCIAL
                          enum:
                          - RESIDENCIAL
                          - COMERCIAL
                          - OUTROS
                          - NATURALIDADE
                        zipCode:
                          type: string
                          example: '00000001'
                        country:
                          type: string
                          example: BR
                        state:
                          type: string
                          example: SP
                        city:
                          type: string
                          example: SAO PAULO
                        street:
                          type: string
                          example: RUA SANDBOX
                        number:
                          type: string
                          example: '369'
                        complement:
                          type: string
                          example: null
                        neighborhood:
                          type: string
                          example: BAIRRO SANDBOX
                      title: Address
      security:
      - BearerAuth: []
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Onboarding/obter-o-endereco-informacoes-da-empresa-cliente-no-parceiro
      summary: Get apps by client id well known customers by tax id addresses
      x-summary-source: derived
      operationId: getAppsByClientIdWellKnownCustomersByTaxIdAddresses
      x-operation-id-source: derived
  /apps/{clientId}/.well-known/customers/{taxId}/documents/{pathSuffix}:
    get:
      tags:
      - Enriquecimento
      description: Obter os a lista de documentos existentes da empresa cliente para download no parceiro
      parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          example: '00000000000125'
          title: ClientId
      - name: taxId
        in: path
        required: true
        schema:
          type: string
          minLength: 11
          maxLength: 14
          pattern: ^[0-9]{11}|[0-9]{14}$
          example: '00000000000125'
          title: TaxId
      - name: pathSuffix
        in: path
        required: true
        schema:
          type: string
          title: DocumentPathSuffix
      - name: x-correlation-id
        in: header
        description: Cabeçalho para correlação de logs
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Documento da empresa cliente baixado com sucesso
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/jpg:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/msword:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jfif:
              schema:
                type: string
                format: binary
            application/postscript:
              schema:
                type: string
                format: binary
      security:
      - BearerAuth: []
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Onboarding/obter-os-a-lista-de-documentos-existentes-da-empresa-cliente-para-download-no-parceiro
      summary: Get apps by client id well known customers by tax id documents by path suffix
      x-summary-source: derived
      operationId: getAppsByClientIdWellKnownCustomersByTaxIdDocumentsByPathSuffix
      x-operation-id-source: derived
  /apps/{clientId}/.well-known/customers/{taxId}/legal-representatives:
    get:
      tags:
      - Enriquecimento
      description: Obter os representantes legais da empresa cliente no parceiro
      parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          example: '00000000000125'
          title: ClientId
      - name: taxId
        in: path
        required: true
        schema:
          type: string
          minLength: 11
          maxLength: 14
          pattern: ^[0-9]{11}|[0-9]{14}$
          example: '00000000000125'
          title: TaxId
      - name: x-correlation-id
        in: header
        description: Cabeçalho para correlação de logs
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Endereço da empresa cliente recuperada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        cpf:
                          type: string
                          example: '00000000050'
                        name:
                          type: string
                          example: EMPRESA SANDBOX
                        email:
                          type: string
                          example: sandbox@btgpactual.com
                        phoneNumber:
                          type: string
                          example: '5511000000002'
                      title: LegalRepresentative
      security:
      - BearerAuth: []
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Onboarding/obter-os-representantes-legais-da-empresa-cliente-no-parceiro
      summary: Get apps by client id well known customers by tax id legal representatives
      x-summary-source: derived
      operationId: getAppsByClientIdWellKnownCustomersByTaxIdLegalRepresentatives
      x-operation-id-source: derived
  /apps/{clientId}/.well-known/customers/{taxId}/documents:
    get:
      tags:
      - Enriquecimento
      description: Obter um documento da empresa cliente no parceiro
      parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          example: '00000000000125'
          title: ClientId
      - name: taxId
        in: path
        required: true
        schema:
          type: string
          minLength: 11
          maxLength: 14
          pattern: ^[0-9]{11}|[0-9]{14}$
          example: '00000000000125'
          title: TaxId
      - name: x-correlation-id
        in: header
        description: Cabeçalho para correlação de logs
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Documento da empresa cliente baixado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - CONTRATO_SOCIAL
                          - PROCURACAO
                          - ESTATUTO_SOCIAL
                          - REQUERIMENTO_EMPRESARIO
                          - BALANCO_DRE
                          - ATA_ELEICAO_DIRETORIA
                          - QUADRO_SOCIETARIO
                          - DOCUMENTO_FINANCEIRO
                          - CCMEI
                          - CARTA_APROVACAO_CONCURSO
                          example: REQUERIMENTO_EMPRESARIO
                          title: DocumentType
                        _links:
                          type: object
                          properties:
                            downloadFiles:
                              type: array
                              items:
                                type: object
                                properties:
                                  href:
                                    type: string
                                    format: uri
                                    description: URL do arquivo
                                    example: https://api.uat.empresas.btgpactual.com/apps/94b02c4d-f2ed-4f7b-b743-7280004e79a0/customers/37297902000141/documents/c76e5d20-eb58-4f8b-b851-526da5f89369
                                  method:
                                    type: string
                                    enum:
                                    - GET
                                    description: Método HTTP
                                  accept:
                                    type: string
                                    description: tipo MIME do arquivo
                                title: FileLink
                          title: DocumentLinks
                      title: DocumentItem
                title: Documents
      security:
      - BearerAuth: []
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Onboarding/obter-um-documento-da-empresa-cliente-no-parceiro
      summary: Get apps by client id well known customers by tax id documents
      x-summary-source: derived
      operationId: getAppsByClientIdWellKnownCustomersByTaxIdDocuments
      x-operation-id-source: derived
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
