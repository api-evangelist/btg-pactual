openapi: 3.2.0
info:
  title: Acquirers - Salesprovider Recebíveis API
  version: 1.0.0
  description: 'Endpoints do Dashboard Transacional para parceiros (providers). Naming: camelCase, monetary values as { currency, value } objects, enums in snake_case.'
servers:
- url: https://api.abs.btgpactual.com
  description: Production
tags:
- name: Recebíveis
paths:
  /{companyId}/acquirer/receivable-units:
    get:
      tags:
      - Recebíveis
      description: Retorna a lista de unidades recebíveis para um dia específico, incluindo status, valor e data de pagamento, para exibição no dashboard do parceiro.
      parameters:
      - name: companyId
        in: path
        required: true
        description: CNPJ da empresa
        schema:
          type: string
        example: 30306294000145
      - name: startDate
        in: query
        description: 'Data de início para filtragem por intervalo de data. Formato: yyyy-MM-dd'
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        description: 'Data final para filtragem por intervalo de data. Formato: yyyy-MM-dd'
        schema:
          type: string
          format: date
      - name: cursor
        in: query
        description: Cursor para paginação. Utilizado para buscar a próxima página de resultados. O valor do cursor é retornado na resposta da API e deve ser fornecido para obter a próxima página de resultados.
        schema:
          type: string
      - name: pageSize
        in: query
        description: Tamanho da página a ser retornada.
        schema:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
      - name: unitId
        in: query
        description: 'ID da unidade de recebíveis para filtragem. Formato: UUID'
        schema:
          type: string
          format: uuid
      - name: cardBrand
        in: query
        description: 'Marca do cartão para filtragem. Exemplo: Visa, Mastercard, etc.'
        schema:
          type: string
          enum:
          - visa
          - mastercard
          - elo
          - hipercard
          - amex
          - other
          description: Card brand (proper names are acceptable in original case)
          title: CardBrand
      - name: saleType
        in: query
        description: 'Modalidade da venda para filtragem. Exemplo: crédito, débito, etc.'
        schema:
          type: string
          enum:
          - credit_card
          - debit_card
          - pix
          title: PaymentMethodType
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                required:
                - _links
                type: object
                properties:
                  _links:
                    description: Token para a próxima página de resultados. O formato é opaco e deve ser tratado como um identificador único para a posição do último item visto na página atual.
                    type: object
                    properties:
                      prev:
                        oneOf:
                        - type: 'null'
                        - type: object
                          properties:
                            href:
                              type: string
                            method:
                              type: string
                          title: NextCursorResponseDto
                      next:
                        oneOf:
                        - type: 'null'
                        - type: object
                          properties:
                            href:
                              type: string
                            method:
                              type: string
                          title: NextCursorResponseDto
                    title: LinksPaginationResponseDto
                  data:
                    type: array
                    items:
                      required:
                      - id
                      - dueDate
                      type: object
                      properties:
                        id:
                          type: string
                          description: Identificador da unidade recebível
                          format: uuid
                        dueDate:
                          type: string
                          description: Data de pagamento da unidade recebível no formato yyyy-MM-dd
                        cardBrand:
                          oneOf:
                          - type: 'null'
                          - type: string
                            enum:
                            - visa
                            - mastercard
                            - elo
                            - hipercard
                            - amex
                            - other
                            description: Card brand (proper names are acceptable in original case)
                            title: CardBrand
                        saleType:
                          type: string
                          enum:
                          - credit_card
                          - debit_card
                          - pix
                          title: PaymentMethodType
                          description: Tipo de venda
                        balance:
                          type: object
                          properties:
                            currency:
                              type: string
                              example: BRL
                            value:
                              type: string
                              example: '123.45'
                              description: Decimal value as string (2 decimal places)
                          required:
                          - currency
                          - value
                          title: MoneyDto
                      title: ReceivableUnitDto
                    description: Lista de itens
                title: CursorPaginatedResponseDtoOfReceivableUnitDto
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
      security:
      - bearerAuth: []
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Acquirers%20-%20Salesprovider/busca-a-lista-de-unidades-recebiveis
      summary: Get by company id acquirer receivable units
      x-summary-source: derived
      operationId: getByCompanyIdAcquirerReceivableUnits
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
