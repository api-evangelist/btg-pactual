openapi: 3.2.0
info:
  title: Btg Pactual Link de pagamento API
  version: 1.0.0
  description: 'Operations tagged Link de pagamento across 2 of this provider''s published API definitions: btg-pactual-acquirers-paymentlink-openapi.yml, btg-pactual-banking-paymentlink-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.empresas.btgpactual.com
  description: Sandbox
- url: https://api.empresas.btgpactual.com
  description: Produção
tags:
- name: Link de pagamento
paths:
  /{companyId}/banking/payment-link/{paymentLinkId}:
    put:
      tags:
      - Link de pagamento
      description: API responsável por editar um link de pagamento
      parameters:
      - in: path
        name: paymentLinkId
        schema:
          type: string
          example: 97c8ac0a-89cb-4bbe-842b-d4e79a685c39
          description: Identificador do Link de Pagamento
          title: PaymentLinkId
        required: true
      - name: companyId
        in: path
        required: true
        schema:
          type: string
        description: CNPJ da empresa
        example: '30306294000145'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Nome do link de pagamento
                  description: Nome do link de pagamento
                  title: PaymentLinkName
                amount:
                  type: number
                  example: 100
                  description: Valor do Link de Pagamento ou cobrança
                  title: Amount
                description:
                  type: string
                  example: Descrição do link de pagamento
                  description: Descrição do link de pagamento
                  title: Description
                paymentMethods:
                  type: array
                  items:
                    type: string
                    enum:
                    - CREDIT_CARD
                  example:
                  - CREDIT_CARD
                  description: Métodos de pagamento permitidos
                  title: PaymentMethods
                notifications:
                  type: object
                  properties:
                    deliveryMediums:
                      type: array
                      items:
                        type: string
                        enum:
                        - Email
                        - Sms
                        - Push
                      example:
                      - Email
                      - Push
                      title: DeliveryMediums
                    email:
                      type: string
                      example: exemplo@btgpactual.com
                      description: Email do beneficiário
                      title: Email
                    phone:
                      type: string
                      example: '55112312312321'
                      description: Telefone do beneficiário
                      title: Sms
                  title: Notifications
                schedule:
                  type: object
                  properties:
                    startAt:
                      type: string
                      format: date-time
                      example: '2024-01-01T12:00:00Z'
                      description: Data e hora de ativação do link de pagamento
                    endAt:
                      type: string
                      format: date-time
                      example: '2024-12-31T17:00:00Z'
                      description: Data e hora de desativação do link de pagamento
                  title: Schedule
                payer:
                  type: object
                  required:
                  - name
                  - taxId
                  properties:
                    name:
                      type: string
                      example: John Due
                    email:
                      type: string
                      format: email
                      example: user@gmail.com
                    personType:
                      type: string
                      enum:
                      - F
                      - J
                      example: J
                    phoneNumber:
                      type: string
                      example: '123123121231'
                    taxId:
                      type: string
                      example: '37297902000141'
                    address:
                      type: object
                      required:
                      - city
                      - state
                      - street
                      - zipCode
                      - number
                      - neighborhood
                      properties:
                        city:
                          type: string
                          example: São Paulo
                        state:
                          type: string
                          example: SP
                        street:
                          type: string
                          example: Faria Lima
                        zipCode:
                          type: string
                          example: '06312412'
                        number:
                          type: string
                          example: '123'
                        neighborhood:
                          type: string
                          example: Itaim Bibi
                      description: Endereço
                      title: Address
                    deliveryMediums:
                      type: array
                      items:
                        type: string
                        enum:
                        - Email
                        - Sms
                        - Push
