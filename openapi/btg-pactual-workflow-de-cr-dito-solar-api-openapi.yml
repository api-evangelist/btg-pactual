  /form/solar/receipts/installation:
    post:
      tags:
      - Workflow de crédito solar
      description: Envio do comprovante de instalação
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              required:
              - workflowLeadCanonical
              type: object
              properties:
                workflowLeadCanonical:
                  description: Propriedade base
                  required:
                  - operatorIdentification
                  - customerIdentification
                  - externalIdentification
                  - installationReceipt
                  type: object
                  properties:
                    operatorIdentification:
                      description: CPF do operador
                      type: string
                    customerIdentification:
                      description: CNPJ do cliente
                      type: string
                    externalIdentification:
                      description: Identificador único fornecido pelo parceiro. Será utilizado para identificar o cliente
                      type: string
                    installationReceipt:
                      description: Comprovante de instalação
                      required:
                      - externalIdentification
                      type: object
                      properties:
                        receiptAccessKey:
                          description: Chave de acesso do comprovante
                          type: string
                        preSignedFileURL:
                          description: Link pré-assinado do arquivo de comprovação de instalação
                          type: string
                        externalIdentification:
                          description: Identificação única fornecida da conta de luz no qual será relacionado o comprovante da instalação
                          type: string
                        fileName:
                          description: 'Nome do arquivo do comprovante de instalação + extensão. Obrigatório caso seja enviado link pre-assinado. Ex: instalacao.pdf'
                          type: string
                      title: installationReceipt
                  example:
                    operatorIdentification: '11111111111'
                    customerIdentification: '11111111111'
                    externalIdentification: GUID
