openapi: 3.2.0
info:
  title: Solar-Workflow Workflow de crédito solar API
  version: 1.0.0
  description: Api Developers Solar
servers:
- url: https://api.empresas.btgpactual.com/solar
  description: ''
tags:
- name: Workflow de crédito solar
paths:
  /form/solar/proposals/accept:
    post:
      tags:
      - Workflow de crédito solar
      description: Aceite da proposta
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              required:
              - workflowLeadCanonical
              type: object
              properties:
                workflowLeadCanonical:
                  description: Propriedade base
                  required:
                  - operatorIdentification
                  - customerIdentification
                  - externalIdentification
                  - desiredAmount
                  - projectTotalAmount
                  - upfrontPaymentAmount
                  type: object
                  properties:
                    operatorIdentification:
                      description: CPF do operador
                      type: string
                    customerIdentification:
                      description: CNPJ do cliente
                      type: string
                    externalIdentification:
                      description: Identificador único fornecido pelo parceiro. Será utilizado para identificar o cliente
                      type: string
                    desiredAmount:
                      description: Valor financiado
                      type: number
                    projectTotalAmount:
                      description: Valor total do projeto
                      type: number
                    upfrontPaymentAmount:
                      description: Valor da entrada
                      type: number
                  example:
                    operatorIdentification: '11111111111'
                    customerIdentification: '11111111111111'
                    externalIdentification: GUID
                    desiredAmount: 155700
                    projectTotalAmount: 155700
                    upfrontPaymentAmount: 0
                  title: acceptProposal
              title: acceptProposalCanonical
            examples:
              Exemplo:
                value:
                  workflowLeadCanonical:
                    operatorIdentification: '11111111111'
                    customerIdentification: '11111111111111'
                    externalIdentification: GUID
                    desiredAmount: 155700
                    projectTotalAmount: 155700
                    upfrontPaymentAmount: 0
        required: true
      responses:
        '200':
          description: Requisição recebida
        '500':
          content:
            application/json:
              schema:
                title: Root Type for internalServerErrorResponse
                description: ''
                type: object
                properties:
                  brn:
                    type: string
                  name:
                    type: string
                  invalidParams:
                    type: array
                    items: {}
                example:
                  brn: brn:empresas:credit-manager:errors:internal-server-error
                  name: ServerInternalError
                  invalidParams: []
              examples:
                ' ':
                  value:
                    brn: brn:empresas:credit-manager:errors:internal-server-error
                    name: ServerInternalError
                    invalidParams: []
          description: Erro interno
      security:
      - oauth2:
        - brn:btg:empresas:solar:workflow
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Solar-Workflow/aceite-da-proposta
      summary: Create form solar proposals accept
      x-summary-source: derived
      operationId: postFormSolarProposalsAccept
      x-operation-id-source: derived
  /customers/{customerIdentification}/operators/{operatorIdentification}/documents/{externalIdentification}:
    get:
      tags:
      - Workflow de crédito solar
      description: Api para consultar documentos enviados
      parameters:
      - name: customerIdentification
        description: CNPJ do cliente
        schema:
          type: string
        in: path
        required: true
      - name: operatorIdentification
        description: CPF do operador
        schema:
          type: string
        in: path
        required: true
      - name: externalIdentification
        description: Identificação do cliente gerada pelo parceiro
        schema:
          type: string
        in: path
        required: true
      - name: type
        description: Tipo do documento
        schema:
          type: string
        in: query
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  title: Root Type for documentPresignedResponse
                  description: Resposta para busca de documentos vinculado ao cliente
                  type: object
                  properties:
                    type:
                      description: Tipo do documento
                      type: string
                    pendencies:
                      description: Pendências
                      type: array
                      items:
                        title: Root Type for pendencyResponse
                        description: Response para pendencia
                        type: object
                        properties:
                          type:
                            description: Tipo da pendência
                            type: string
                          status:
                            description: Status da pendência
                            type: string
                          reason:
                            description: Motivo da pendência
                            type: string
                        example:
                          type: DOCUMENT
                          status: PENDING
                          reason: Motivo da pendência
                    presignedFiles:
                      description: Arquivos pré-assinados
                      type: array
                      items:
                        type: string
                  example:
                    type: ASSOCIATES_IR
                    pendencies: []
                    presignedFiles:
                    - PRE_SIGNED_URL
              examples:
                Exemplo:
                  value:
                  - type: ENERGY_BILL
                    pendencies: []
                    presignedFiles:
                    - PRE_SIGNED_URL
                  - type: SOCIAL_CONTRACT
                    pendencies: []
                    presignedFiles:
                    - PRE_SIGNED_URL
                  - type: BILLING_STATEMENT
                    pendencies: []
                    presignedFiles:
                    - PRE_SIGNED_URL
                  - type: ASSOCIATES_IR
                    pendencies: []
                    presignedFiles:
                    - PRE_SIGNED_URL
          description: Ok
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Solar-Workflow/api-para-consultar-documentos-enviados
      summary: Get customers by customer identification operators by operator identification…
      x-summary-source: derived
      operationId: getCustomersByCustomerIdentificationOperatorsByOperatorIdentificationDocumentsByExternalIdentification
      x-operation-id-source: derived
  /form/solar/income-auth-cards:
    post:
      tags:
      - Workflow de crédito solar
      description: Carta autorização de faturamento dos equipamentos
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              required:
              - workflowLeadCanonical
              type: object
              properties:
                workflowLeadCanonical:
                  description: propriedade base
                  type: object
                  allOf:
                  - required:
                    - externalIdentification
                    - customerIdentification
                    - operatorIdentification
                    type: object
                    properties:
                      externalIdentification:
                        description: Identificador único fornecido pelo parceiro. Será utilizado para identificar o cliente
                        type: string
                      customerIdentification:
                        description: CNPJ/CPF do cliente
                        type: string
                      operatorIdentification:
                        description: CPF do operador
                        type: string
                  title: requestFileRender
              title: requestFileRenderCanonical
            examples:
              Exemplo:
                value:
                  workflowLeadCanonical:
                    operatorIdentification: '11111111111'
                    customerIdentification: '11111111111111'
                    externalIdentification: GUID
        required: true
      responses:
        '200':
          description: A carta de autorização será enviada através de um link pré-assinado via webhook
      security:
      - oauth2:
        - brn:btg:empresas:solar:workflow
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Solar-Workflow/carta-autorizacao-de-faturamento-dos-equipamentos
      summary: Create form solar income auth cards
      x-summary-source: derived
      operationId: postFormSolarIncomeAuthCards
      x-operation-id-source: derived
  /form/solar/render-proposals:
    post:
      tags:
      - Workflow de crédito solar
      description: 'Download da proposta indicativa de Solar


        *Disponível durante etapa do aceite da proposta'
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              required:
              - workflowLeadCanonical
              type: object
              properties:
                workflowLeadCanonical:
                  description: propriedade base
                  type: object
                  allOf:
                  - required:
                    - externalIdentification
                    - customerIdentification
                    - operatorIdentification
                    type: object
                    properties:
                      externalIdentification:
                        description: Identificador único fornecido pelo parceiro. Será utilizado para identificar o cliente
                        type: string
                      customerIdentification:
                        description: CNPJ/CPF do cliente
                        type: string
                      operatorIdentification:
                        description: CPF do operador
                        type: string
                  title: requestFileRender
              title: requestFileRenderCanonical
            examples:
              Exemplo:
                value:
                  workflowLeadCanonical:
                    operatorIdentification: '11111111111'
                    customerIdentification: '11111111111111'
                    externalIdentification: GUID
        required: true
      responses:
        '200':
          description: A proposta indicativa será enviada em um link pré-assinado via webhook
      security:
      - oauth2:
        - brn:btg:empresas:solar:workflow
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Solar-Workflow/download-da-proposta-indicativa-de-solar
      summary: Create form solar render proposals
      x-summary-source: derived
      operationId: postFormSolarRenderProposals
      x-operation-id-source: derived
  /form/solar/disbursement-receipts:
    post:
      tags:
      - Workflow de crédito solar
      description: 'Comprovante de desembolso.


        *Disponível após contratação do crédito no portal do cliente'
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              required:
              - workflowLeadCanonical
              type: object
              properties:
                workflowLeadCanonical:
                  description: propriedade base
                  type: object
                  allOf:
                  - required:
                    - externalIdentification
                    - customerIdentification
                    - operatorIdentification
                    type: object
                    properties:
                      externalIdentification:
                        description: Identificador único fornecido pelo parceiro. Será utilizado para identificar o cliente
                        type: string
                      customerIdentification:
                        description: CNPJ/CPF do cliente
                        type: string
                      operatorIdentification:
                        description: CPF do operador
                        type: string
                  title: requestFileRender
              title: requestFileRenderCanonical
            examples:
              Exemplo:
                value:
                  workflowLeadCanonical:
                    operatorIdentification: '11111111111'
                    customerIdentification: '11111111111111'
                    externalIdentification: GUID
        required: true
      responses:
        '200':
          description: O comprovante de desembolso será enviado através de um link pré-assinado via webhook
      security:
      - oauth2:
        - brn:btg:empresas:solar:workflow
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Solar-Workflow/download-do-comprovante-de-desembolso
      summary: Create form solar disbursement receipts
      x-summary-source: derived
      operationId: postFormSolarDisbursementReceipts
      x-operation-id-source: derived
  /form/solar/notify-email-proposals:
    post:
      tags:
      - Workflow de crédito solar
      description: Envia proposta indicativa por e-mail
      requestBody:
        description: Enviar o payload dentro do objecto workflowLeadCanonical
        content:
          application/json:
            schema:
              description: Solicitação do envio da proposta indicativa por e-mail
              required:
              - workflowLeadCanonical
              type: object
              properties:
                workflowLeadCanonical:
                  description: propriedade base
                  type: object
                  allOf:
                  - required:
                    - email
                    - externalIdentification
                    - customerIdentification
                    - operatorIdentification
                    type: object
                    properties:
                      email:
                        description: E-mail do destinatário
                        type: string
                      externalIdentification:
                        description: Identificação do cliente gerada pelo parceiro
                        type: string
                      customerIdentification:
                        description: CNPJ do cliente
                        type: string
                      operatorIdentification:
                        description: cpf do operador
                        type: string
                  title: sendProposalByEmail
              title: sendProposalByEmailCanonical
            examples:
              Exemplo:
                value:
                  workflowLeadCanonical:
                    email: teste@teste.com
                    externalIdentification: GUID
                    customerIdentification: '11111111111111'
                    operatorIdentification: '11111111111111'
        required: true
      responses:
        '200':
          description: Proposta enviada por e-mail
      security:
      - oauth2:
        - brn:btg:empresas:solar:workflow
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Solar-Workflow/envia-proposta-indicativa-por-e-mail
      summary: Create form solar notify email proposals
      x-summary-source: derived
      operationId: postFormSolarNotifyEmailProposals
      x-operation-id-source: derived
  /form/solar/invoices:
    post:
      tags:
      - Workflow de crédito solar
      description: Envio das notas fiscais
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              required:
              - workflowLeadCanonical
              type: object
              properties:
                workflowLeadCanonical:
                  description: propriedade base
                  required:
                  - operatorIdentification
                  - customerIdentification
                  - externalIdentification
                  - upfrontPaymentAmount
                  - invoices
                  type: object
                  properties:
                    operatorIdentification:
                      description: CPF do operador
                      type: string
                    customerIdentification:
                      description: CNPJ do cliente
                      type: string
                    externalIdentification:
                      description: Identificador único fornecido pelo parceiro. Será utilizado para identificar o cliente
                      type: string
                    upfrontPaymentAmount:
                      description: Valor de entrada
                      type: number
                    invoices:
                      description: Notas fiscais
                      type: array
                      items:
                        description: Nota fiscal
                        required:
                        - invoiceType
                        - payeeTaxId
                        type: object
                        properties:
                          amount:
                            description: Valor da nota fiscal
                            type: number
                          isAlienatedToBtg:
                            description: Nota fiscal alienada ao BTG. *Obrigatório envio na nota fiscal de equipamentos
                            type: boolean
                          preSignedURL:
                            description: Link pre-assinado da nota fiscal
                            type: string
                          invoiceAccessKey:
                            description: Chave de acesso da nota fiscal
                            type: string
                          payeeTaxId:
                            description: CNPJ/CPF do beneficiário.
                            type: string
                          payerTaxId:
                            description: CNPJ/CPF do pagador. *Obrigatório envio na nota fiscal de equipamentos
                            type: string
                          invoiceType:
                            description: Tipo da nota fiscal
                            enum:
                            - SERVICES
                            - EQUIPMENTS
                            type: string
                          invoiceProducts:
                            description: Produtos da nota fiscal de equipamentos. *Obrigatório envio na nota fiscal de equipamentos
                            type: array
                            items:
                              description: Produtos da nota fiscal de equipamentos
                              required:
                              - Code
                              - Manufacturer
                              - Description
                              - Quantity
                              - UnitPrice
                              - Amount
                              type: object
                              properties:
                                Code:
                                  description: Código
                                  type: string
                                Manufacturer:
                                  description: Fabricante
                                  type: string
                                Description:
                                  description: Descrição da nota
                                  type: string
                                Quantity:
                                  description: Quantidade
                                  type: number
                                UnitPrice:
                                  description: Preço unitário
                                  type: number
                                Amount:
                                  description: 'Valor total: UnitPrice * Quantity'
                                  type: number
                              title: invoiceProducts
                          fileName:
                            description: 'Nome do arquivo da nota fiscal + extensão. Obrigatório caso seja enviado o link pre-assinado. Ex: servico.pdf'
                            type: string
                        example:
                          amount: 20000
                          PreSignedURL: ''
                          fileName: ''
                          invoiceAccessKey: '1111111111111111111111111111111111111111111'
                          payeeTaxId: '11111111111111'
                          payerTaxId: '11111111111'
                          invoiceType: EQUIPMENTS
                          isAlienatedToBtg: true
                        title: invoice
                  example:
                    operatorIdentification: '11111111111'
                    customerIdentification: '11111111111111'
                    externalIdentification: GUID
                    upfrontPaymentAmount: 0
                    invoices:
                    - amount: 20000
                      PreSignedURL: ''
                      invoiceAccessKey: '11111111111111111111111111111111111111111111'
                      payeeTaxId: '11111111111111'
                      payerTaxId: '11111111111'
                      invoiceType: EQUIPMENTS
                      isAlienatedToBtg: true
                    - PreSignedURL: ''
                      payeeTaxId: '11111111111111'
                      invoiceType: SERVICES
                  title: sendInvoices
              title: sendInvoicesCanonical
            examples:
              Exemplo:
                value:
                  workflowLeadCanonical:
                    operatorIdentification: '11111111111'
                    customerIdentification: '11111111111'
                    externalIdentification: GUID
                    upfrontPaymentAmount: 5000
                    invoices:
                    - amount: 20000
                      preSignedFileKey: ''
                      invoiceAccessKey: '11111111111111111111111111111111111111111111'
                      invoiceDataOrigin: FORM
                      payeeTaxId: '11111111111111'
                      payerTaxId: '11111111111'
                      invoiceType: EQUIPMENTS
                      isAlienatedToBtg: true
                    - preSignedFileKey: ''
                      payeeTaxId: '11111111111111'
                      invoiceType: SERVICES
        required: true
      responses:
        '200':
          description: Requisição recebida
        '500':
          content:
            application/json:
              schema:
                title: Root Type for internalServerErrorResponse
                description: ''
                type: object
                properties:
                  brn:
                    type: string
                  name:
                    type: string
                  invalidParams:
                    type: array
                    items: {}
                example:
                  brn: brn:empresas:credit-manager:errors:internal-server-error
                  name: ServerInternalError
                  invalidParams: []
              examples:
                ' ':
                  value:
                    brn: brn:empresas:credit-manager:errors:internal-server-error
                    name: ServerInternalError
                    invalidParams: []
          description: Erro interno
      security:
      - oauth2:
        - brn:btg:empresas:solar:workflow
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/Solar-Workflow/envio-das-notas-fiscais
      summary: Create form solar invoices
      x-summary-source: derived
      operationId: postFormSolarInvoices
      x-operation-id-source: derived
