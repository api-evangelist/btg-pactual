openapi: 3.2.0
info:
  title: SCF - Risco Sacado Commercial strategy API
  description: Esta API tem a finalidade de contratar Antecipações de Recebíveis. Para autenticação é necessário a utilização do fluxo de client credentials para autenticação na documentação da API. `AUTENTICAÇÃO -> Fluxos de Autenticação -> Client Credentials`
  version: 1.4.1
  contact:
    name: Time BTG Empresas
    email: ol-it-btgempresas@btgpactual.com
servers:
- url: https://api.sandbox.empresas.btgpactual.com/v1/scf
  description: SANDBOX URL
- url: https://api.empresas.btgpactual.com/v1/scf
  description: PROD URL
tags:
- name: Commercial strategy
paths:
  /companies/commercial-strategies:
    post:
      tags:
      - Commercial strategy
      description: Associação de lote de empresas a uma estratégia comercial.
      operationId: addCompaniesToCommercialStrategyRequest
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - companies
              - strategyUuid
              properties:
                companies:
                  type: array
                  items:
                    type: object
                    required:
                    - taxId
                    properties:
                      taxId:
                        type: string
                      name:
                        type: string
                    title: CompanyNameTaxIdDto
                strategyUuid:
                  type: string
      responses:
        '200':
          description: Define se houve sucesso ou erro ao executar o fluxo
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        errorMessage:
                          type: string
                          description: Erro ocorrido
                        errorCode:
                          type: string
                          enum:
                          - CACSQF0001
                          - CACSQF0002
                          - CACSQF0003
                          - CACSQF0004
                          - CACSQF0005
                          - CACSQF0006
                          - CACSQF0007
                          - CACSQF0008
                          - CACSQF0009
                          description: '___

                            Errors:

                            * CACSQF0001 - Commercial strategy UUID must be provided.

                            * CACSQF0002 - Commercial strategy not found.

                            * CACSQF0003 - Incomplete commercial strategy.

                            * CACSQF0004 - At least one company must be provided.

                            * CACSQF0005 - Company TaxId must be provided.

                            * CACSQF0006 - Can''t add company without name.

                            * CACSQF0007 - Company with id {companyId} had error on associate with commercial strategy {strategyUuid}.

                            * CACSQF0008 - Error on creating counterparties.

                            '
                        propertyName:
                          type: string
                          description: Propriedade que houve erro.
                title: ValidationResultSchema
        '400':
          description: Define se houve sucesso ou erro ao executar o fluxo
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        errorMessage:
                          type: string
                          description: Erro ocorrido
                        errorCode:
                          type: string
                          enum:
                          - CACSQF0001
                          - CACSQF0002
                          - CACSQF0003
                          - CACSQF0004
                          - CACSQF0005
                          - CACSQF0006
                          - CACSQF0007
                          - CACSQF0008
                          - CACSQF0009
                          description: '___

                            Errors:

                            * CACSQF0001 - Commercial strategy UUID must be provided.

                            * CACSQF0002 - Commercial strategy not found.

                            * CACSQF0003 - Incomplete commercial strategy.

                            * CACSQF0004 - At least one company must be provided.

                            * CACSQF0005 - Company TaxId must be provided.

                            * CACSQF0006 - Can''t add company without name.

                            * CACSQF0007 - Company with id {companyId} had error on associate with commercial strategy {strategyUuid}.

                            * CACSQF0008 - Error on creating counterparties.

                            '
                        propertyName:
                          type: string
                          description: Propriedade que houve erro.
                title: ValidationResultSchema
        '401':
          description: Não autorizado
      security:
      - oauth2:
        - empresas.btgpactual.com/scf/companies
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/SCF%20-%20Risco%20Sacado/add-companies-to-commercial-strategy-request
      summary: Add companies to commercial strategy request
      x-summary-source: derived
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://id.sandbox.btgpactual.com/oauth2/token
          scopes:
            empresas.btgpactual.com/scf/borderos: Scope to borderos
            empresas.btgpactual.com/scf/borderos.readonly: Scope to borderos read
            empresas.btgpactual.com/scf/companies: Scope to companies
            empresas.btgpactual.com/scf/companies.readonly: Scope to companies read
            empresas.btgpactual.com/scf/operations: Scope to operations
            empresas.btgpactual.com/scf/operations.readonly: Scope to operations read
            empresas.btgpactual.com/scf/receivables: Scope to receivables
            empresas.btgpactual.com/scf/receivables.readonly: Scope to receivables read
            empresas.btgpactual.com/scf/settlements: Scope to settlements
            empresas.btgpactual.com/scf/settlements.readonly: Scope to settlements read
            empresas.btgpactual.com/scf/trades: Scope to trades
            empresas.btgpactual.com/scf/trades.readonly: Scope to trades read
            empresas.btgpactual.com/payer-onboardings: Scope to financiers-payer
