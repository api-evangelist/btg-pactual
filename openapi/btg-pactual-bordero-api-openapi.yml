                          - BDQF0045
                          - BDQF0046
                          - BDQF0047
                          - BDQF0048
                          - BDQF0049
                          description: "___\nErrors:\n * BDQF0001 - Cadastro do bordero bloqueado\n * BDQF0002 - Sacado inválido\n * BDQF0003 - Necessário ao menos 1 recebível\n * BDQF0004 - Estratégia inválida\n * BDQF0005 - Uma moeda por bordero\n * BDQF0006 - Identificação do recebível necessária\n * BDQF0007 - Recebível duplicado na requisição\n * BDQF0008 - Recebível já existente\n * BDQF0009 - Data de vencimento inválida\n * BDQF0010 - Taxa não cadastrada\n * BDQF0011 - Taxa fornecedor inválida\n * BDQF0012 - Tipo de documento necessário\n * BDQF0013 - Tipo de documento inválido\n * BDQF0014 - Identificação do Fornecedor necessária\n * BDQF0015 - Fornecedor inválido\n * BDQF0016 - Fornecedor desativado\n * BDQF0017 - CPF inválido\n * BDQF0018 - CNPJ inválido\n * BDQF0019 - Falta de cadastro para caso offshore\n * BDQF0020 - Valor de vencimento inválido\n * BDQF0021 - Código do banco necessário\n * BDQF0022 - Agência inválida\n * BDQF0023 - Número da conta necessário\n * BDQF0024 - Dígito da conta necessário\n * BDQF0025 - Dígito da conta inválido\n * BDQF0026 - Arquivos necessários\n * BDQF0027 - URL do arquivo necessário\n * BDQF0028 - URL do arquivo inválido\n * BDQF0029 - Tipo de arquivo necessário\n * BDQF0030 - Tipo de arquivo inválido\n * BDQF0031 - Recebível não existe\n * BDQF0032 - Recebível não cancelável\n * BDQF0033 - Produto ou estratégia necessário\n * BDQF0034 - Produto inválido\n * BDQF0035 - Identificação do Sacado necessária\n * BDQF0036 - Deve haver apenas uma empresa principal no bordero (Sacado ou Fornecedor dependendo do produto)\n * BDQF0037 - Empresa principal inválida (Sacado ou Fornecedor dependendo do produto)\n * BDQF0038 - Moeda inválida\n * BDQF0039 - Data de desembolso inválida\n * BDQF0040 - Valor de desembolso inválido\n * BDQF0041 - Valor de desembolso não permitido\n * BDQF0042 - Sacado desativado\n * BDQF0043 - Registradora inválida\n * BDQF0044 - Extensão do arquivo necessária\n * BDQF0045 - Extensão do arquivo inválida\n * BDQF0046 - Rebate inválido\n * BDQF0047 - Rebate não permitido\n * BDQF0048 - Registradora necessária\n * BDQF0049 - Número de registro necessário\n"
                          title: ValidationErrorsBorderoEnumSchema
                title: BorderoBadRequestResponseSchema
        '401':
          description: Não autorizado
