        - empresas.btgpactual.com/scf/borderos.readonly
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/SCF%20-%20Risco%20Sacado/get-receivables-from-bordero
      summary: Get receivables from bordero
      x-summary-source: derived
