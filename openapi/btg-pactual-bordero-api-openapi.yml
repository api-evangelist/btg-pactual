      - oauth2:
        - empresas.btgpactual.com/scf/borderos
      x-docs-url: https://developers.empresas.btgpactual.com/docs/api-specs-target/SCF%20-%20Risco%20Sacado/create-bordero
      summary: Create bordero
      x-summary-source: derived
  /borderos/{trackingId}/receivables:
    get:
      tags:
      - Bordero
      description: Esta rota serve para consultar os recebíveis de um bordero a partir do 'trackingId' retornado na criação. Na resposta, é possível verificar todos os dados.
      operationId: getReceivablesFromBordero
      parameters:
      - in: path
        name: trackingId
        schema:
          type: string
          description: Uid Gerado
          example: 3382cc6f-1c59-4423-b364-c837deaf110d
          title: UIDSchema
        required: true
        description: Tracking Id do bordero
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  trackingId:
                    type: string
                    description: Uid Gerado
                    example: 3382cc6f-1c59-4423-b364-c837deaf110d
                    title: UIDSchema
                  createdAt:
                    description: Data de criação do bordero
                    type: string
                    format: date-time
                  receivables:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          description: Id do recebível
                          type: integer
                        identification:
                          type: string
                          description: 'Identificação do recebível (ex: Nº da NF)'
                          example: '5120070562'
                          title: ReceivableIdentificationSchema
                        trades:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Id do trade
                              contractNumber:
                                type: string
                                description: Número de contrato do trade
                                example: 123-12345
                              disbursedAmount:
                                type: number
                                format: double
                                description: Valor desembolsado
                        maturityAmount:
                          type: number
                          format: double
                          description: Valor de vencimento
                        maturityDate:
                          type: string
                          format: date
                          description: Data de vencimento
                        status:
                          enum:
                          - Aberto
                          - EmAprovacao
                          - Aprovado
                          - EmAgendamento
                          - Agendado
                          - EmAntecipacao
                          - Antecipado
                          - Liquidado
                          - Pago
                          - Cancelado
                          - EmAtraso
                          - Indisponivel
                          type: string
                          example: Aprovado
                          description: "Status do recebível\n___\nDefinições (o recebível não passará obrigatoriamente por todos os status):\n  * Aberto - Recebível criado e passando por validações\n  * EmAprovacao - Recebível pendente aprovação\n  * Aprovado - Recebível aprovado e disponível para antecipação\n  * EmAntecipacao - Recebível em processo de antecipação\n  * Antecipado - Recebível antecipado (pagamento ao cedente)\n  * Liquidado - Recebível liquidado (pagamento ao banco pelo cliente)\n  * Cancelado - Recebível cancelado\n  * EmAtraso - Liquidação do recebível em atraso (pagamento ao banco pelo cliente)\n  * Indisponivel - Recebível indisponível para antecipação\n"
                          title: ReceivableStatus
                        payeeTaxId:
                          type: string
                          description: Documento do cedente
                        payerTaxId:
                          type: string
                          description: Documento do sacado
                        currency:
                          enum:
                          - BRL
                          - USD
                          - EUR
                          description: Moeda
                          type: string
                          title: CurrencySchema
                      title: ReceivableSchema
                title: BorderoSchema
        '401':
          description: Não autorizado
        '404':
          description: Bordero com esse 'trackingId' não encontrado.
        default:
          description: Erro
          content:
            application/json:
              schema:
                type: object
                required:
                - errorCode
                - message
                properties:
                  errorCode:
                    type: integer
                  message:
                    type: string
                title: ErrorResponseSchema
