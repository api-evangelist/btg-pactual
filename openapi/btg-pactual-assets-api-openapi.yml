      description: Cria o ativo e inicia a admissão (busca de contrapartes, validação e elegibilidade) de forma assíncrona. A resposta 202 retorna o identificador do ativo; o resultado da admissão deve ser acompanhado pela consulta de status. A criação é idempotente pela combinação de `identification` + `fundTaxId`.
      requestBody:
