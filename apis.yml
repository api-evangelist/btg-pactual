aid: btg-pactual

name: BTG Pactual

description: BTG Pactual is a Brazilian investment bank and financial services group, describing itself as the largest investment bank in Latin
  America, offering investment, banking and business accounts to individuals and companies. Its BTG Pactual Empresas developer portal publishes
  business banking APIs (Banking PJ, account opening, FIDC, supply-chain finance, credit anticipation, solar credit and BTG Pay) with BTG Id OAuth
  authorization, a sandbox, webhooks, Postman collections, a changelog and a status page; its GitHub organization hosts Python clients for BTG
  Solutions data, trade and OTC market services.

